<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>行测题库校对页</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6ea;--txt:#1f2328;--dim:#6b7280;
--ok:#0a7d3c;--warn:#b45309;--bad:#c0392b;--acc:#2563eb;--accbg:#eef4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);
padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:15px;margin:0 12px 0 0;font-weight:600}
.tab{padding:4px 12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;
background:#fff;user-select:none;font-size:13px}
.tab.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
label{font-size:12px;color:var(--dim);display:inline-flex;gap:4px;align-items:center}
input[type=search]{padding:4px 8px;border:1px solid var(--line);border-radius:6px;width:120px}
#stat{margin-left:auto;font-size:12px;color:var(--dim)}
main{padding:14px;max-width:900px;margin:0 auto}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:12px 14px;margin-bottom:12px}
.q .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.q .id{font-weight:600;font-size:15px}
.q .tag{font-size:11px;padding:1px 7px;border-radius:10px;background:#f1f3f5;color:var(--dim)}
.q .tag.sub{background:#eef4ff;color:var(--acc)}
.q .flag{font-size:11px;padding:1px 7px;border-radius:10px;background:#fdecea;color:var(--bad)}
.q .spacer{margin-left:auto;display:flex;gap:6px}
.btn{font-size:11px;padding:2px 9px;border:1px solid var(--line);border-radius:6px;
cursor:pointer;background:#fff;color:var(--dim)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.mat{border-left:3px solid #f0b429;background:#fffdf5;padding:8px 10px;
margin-bottom:10px;border-radius:0 6px 6px 0;font-size:13px}
.mat .t{font-size:11px;color:var(--warn);font-weight:600;margin-bottom:4px}
.stem{white-space:pre-wrap;margin:6px 0 10px}
img{max-width:100%;height:auto;display:block;margin:6px 0;border:1px solid var(--line);
border-radius:6px;background:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.opt .k{font-weight:600;margin-right:6px}
.opt.right{background:#e8f7ee;border-color:#8fd3a8}
.opt.right .k{color:var(--ok)}
.ans{margin-top:8px;font-size:13px}
.ans b{color:var(--ok)}
.exp{margin-top:6px;padding:8px 10px;background:#f7f8fa;border-radius:8px;
font-size:13px;color:#40464d;white-space:pre-wrap;display:none}
.exp.show{display:block}
.pg{display:none;margin-top:8px;padding:6px;background:#f0f2f5;border-radius:8px}
.pg.show{display:block}
.pg img{margin:0}
.hide{display:none!important}
</style></head><body>
<header>
  <h1>行测题库校对页</h1>
  <span class="tab on" data-mod="all">全部</span>
  <span class="tab" data-mod="shuliang">数量关系</span>
  <span class="tab" data-mod="panduan">判断推理</span>
  <span class="tab" data-mod="yanyu">言语理解</span>
  <span class="tab" data-mod="ziliao">资料分析</span>
  <label><input type="checkbox" id="fImg">含图</label>
  <label><input type="checkbox" id="fMat">带材料</label>
  <label><input type="checkbox" id="fBad">只看可疑</label>
  <label><input type="checkbox" id="fAllExp" checked>展开解析</label>
  <input type="search" id="q" placeholder="题号/关键字">
  <span id="stat"></span>
</header>
<main id="list"></main>

y": "D", "text": "5", "image": null}], "answer": "A", "explanation": "由题意可知，五年前乙的年龄为（11-5）×31 =2 岁，两年前甲的年龄为（2+3）×2=10 岁，故今年甲的年龄是12 岁。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "shuliang-032", "module": "shuliang", "no": 32, "subType": "数学运算", "stem": "甲乙两人从相距 1350 米的地方，以相同的速度相对行走，两人在出发点分别放\n下 1 个标志物，再前进 10 米后放下 3 个标志物，前进 10 米放下 5 个标志物，再前进\n10 米放下 7 个标志物，以此类推。当两人相遇时，一共放下了几个标志物？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "4489", "image": null}, {"key": "B", "text": "4624", "image": null}, {"key": "C", "text": "8978", "image": null}, {"key": "D", "text": "9248", "image": null}], "answer": "D", "explanation": "甲、乙两人以相同的速度相对行走，放下标志物的方法也是一样的，因此，两人所放的标志物总数应该是一样的，我们只需要考察其中一个人的即可甲每走10 米放下一定数量的标志物，这些标志物数量构成首项为1，公差为2 的等差数列。甲、乙速度相同，因此甲所走的路程为1350÷2=675 米等差数列项数为[675÷10]+1=68 项，则甲所放的标志物总数为1×68+68×（68-1）÷2×2=4624 个。两人放的标志物总数为4624×2=9248 个。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "shuliang-033", "module": "shuliang", "no": 33, "subType": "数学运算", "stem": "A、 B 两辆列车早上 8 点同时从甲地出发驶向乙地，途中 A、 B 两列车分别停了\n10 分钟和 20 分钟，最后 A 车于早上 9 点 50 分， B 车于早上 10 点到达目的地。问两车\n平均速度之比为多少？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "1 ∶ 1", "image": null}, {"key": "B", "text": "3 ∶ 4", "image": null}, {"key": "C", "text": "5 ∶ 6", "image": null}, {"key": "D", "text": "9 ∶ 11", "image": null}], "answer": "A", "explanation": "A、B 车的行驶时间相同，均为1 小时40 分钟，路程相同，则平均速度之比为1∶1。 5 内部资免费交流", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "shuliang-034", "module": "shuliang", "no": 34, "subType": "数学运算", "stem": "7 2007 的个位数加上 3 2007 的个位数的和是（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "5", "image": null}, {"key": "B", "text": "8", "image": null}, {"key": "C", "text": "10", "image": null}, {"key": "D", "text": "13", "image": null}], "answer": "C", "explanation": "7 和3 的n 次方的个位数都是每4 个一循环。2007÷4……3，余数为3，所以所求为7 的3 次方的尾数（3），加上3 的3 次方的尾数（7），和为10。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "shuliang-035", "module": "shuliang", "no": 35, "subType": "数学运算", "stem": "将号码分别为 1、 2、…… 6 的 6 个小球放入一个袋中，这些小球仅号码不同，\n其余完全相同。首先，从袋中摸出一个球，号码为 a；放回后，再从此袋摸出一个球，\n其号码为 b，则使不等式 a-2b+2>0 成立的事件发生的概率为（）。", "stemImages": ["img/graph/SL-s-007.png", "img/graph/SL-s-008.png"], "optionImage": "img/graph/SL-fig-009.png", "graphicOptions": true, "options": [{"key": "A", "text": "", "image": null}, {"key": "B", "text": "", "image": null}, {"key": "C", "text": "", "image": null}, {"key": "D", "text": "", "image": null}], "answer": "C", "explanation": "根据不等式可得2b<a+2，且a≤6，故b<4，则b 只能取值1、2、3。当b=1 时，a 可取1、2、3、4、5、6，共6 种；当b=2 时，a 可取3、4、5、6，共4 种；当b=3 时，a 可取5、6，共2 种。总共有6+4+2=12 种情况符合题意，总的情况数为6×6=36，所求概率为31。故本题选C。", "material": null, "srcPage": 4, "imgN": 3, "f": []}, {"id": "shuliang-036", "module": "shuliang", "no": 36, "subType": "数学运算", "stem": "在一个除法算式里，被除数、除数、商和余数之和是 319，已知商是 21，余数\n是 6，问被除数是多少？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "237", "image": null}, {"key": "B", "text": "258", "image": null}, {"key": "C", "text": "279", "image": null}, {"key": "D", "text": "290", "image": null}], "answer": "C", "explanation": "在除法算式里，被除数=除数×商+余数，此题可以设除数为x，则被除数是21x+6。由题意可知，21x+6+x+21+6=319，解得x=13，故被除数为13×21+6=279。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "shuliang-037", "module": "shuliang", "no": 37, "subType": "数学运算", "stem": "某单位有职工 750 人，其中青年职工 350 人，中年职工 250 人，老年职工 150\n人。为了解该单位职工的健康情况，计划用等比例分层抽样的方法从中抽取样本。若样\n本中的青年职工为 7 人，则抽取职工总人数为（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "7", "image": null}, {"key": "B", "text": "15", "image": null}, {"key": "C", "text": "25", "image": null}, {"key": "D", "text": "35", "image": null}], "answer": "B", "explanation": "样本中青年职工所占比例与总体中青年职工所占比例相等，则所求为7÷750350 =15 人。故本题选B。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "shuliang-038", "module": "shuliang", "no": 38, "subType": "数学运算", "stem": "如下图，正方形 ABCD 边长为 10 厘米，一只小蚂蚁 E 从 A 点出发匀速移动，\n沿边 AB， BC， CD 前往 D 点。问哪个图形能反映三角形 AED 的面积与时间的关系？", "stemImages": ["img/graph/SL-s-009.png"], "optionImage": "img/graph/SL-fig-010.png", "graphicOptions": true, "options": [{"key": "A", "text": "", "image": null}, {"key": "B", "text": "", "image": null}, {"key": "C", "text": "", "image": null}, {"key": "D", "text": "", "image": null}], "answer": "A", "explanation": "小蚂蚁从A 到B 时，三角形AED 的面积不断变大；从B到C 时，三角形AED 的面积不变；从C 到D 时，三角形AED 的面积不断变小。故选A。", "material": null, "srcPage": 4, "imgN": 2, "f": []}, {"id": "shuliang-039", "module": "shuliang", "no": 39, "subType": "数学运算", "stem": "一个人到书店购买了一本书和一本杂志，在付钱时，他把书的定价中的个位上\n的数字和十位上的看反了，准备付 21 元取货。售货员说：“您应该付 39 元才对。”请\n问书比杂志贵多少钱？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "20", "image": null}, {"key": "B", "text": "21", "image": null}, {"key": "C", "text": "23", "image": null}, {"key": "D", "text": "24", "image": null}], "answer": "C", "explanation": "（39-21）÷（10-1）=2，则书定价的十位数应该比个位数大2；书和杂志的总价为39 元，因此书的价格只能为31 元，杂志为39-31=8 元；书比杂志贵31-8=23 元。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "shuliang-040", "module": "shuliang", "no": 40, "subType": "数学运算", "stem": "今天是本月的 1 日同时也是星期一，且今年某月的 1 日又是星期一。问这两个 1\n日之间最多相隔几个月？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "6", "image": null}, {"key": "B", "text": "7", "image": null}, {"key": "C", "text": "9", "image": null}, {"key": "D", "text": "11", "image": null}], "answer": "C", "explanation": "下表列出了1 至12 月的天数及每月天数除以7 的余数根据题意，当连续几个月的天数除以7 的余数之和能被7 整除，此时若起始月份第一天是星期一，则这连续几个月之后接下来一个月的第一天是星期一。分析计算发现，当某平年2 月的第一天是星期一时，当年11 月的第一天是星期一，间隔的9 个月每月天数除以7 余数之和是0+3+2+3+2+3+3+2+3=21，可以被7 整除。经计算检验发现，间隔11 个月的不存在。故本题答案为C。 6 内部资免费交流", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-041", "module": "shuliang", "no": 41, "subType": "数学运算", "stem": "某次列车含起点和终点共停靠 12 个车站，列车在相临两站间行进平均耗时 50\n分，每个站的平均停靠时间为 8 分。某日由于恶劣天气影响，该次列车从起点站出发到\n达终点站共耗时 12 小时 13 分，问该次列车当日晚点多长时间？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "53 分", "image": null}, {"key": "B", "text": "1 小时 35 分", "image": null}, {"key": "C", "text": "45 分", "image": null}, {"key": "D", "text": "1 小时 43 分", "image": null}], "answer": "D", "explanation": "12 个车站中间有11 个车程，停靠的车站为10 个，整个行程原定时间为50×11+8×10=630 分=10 小时30 分。列车当日晚点12 小时13 分-10 小时30 分=1 小时43 分。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-042", "module": "shuliang", "no": 42, "subType": "数学运算", "stem": "A、 B 两地间有三种类型列车运行，其中高速铁路动车组列车每天 6 车次，普通\n动车组列车每天 5 车次，快速旅客列车每天 4 车次。甲、乙两人要同一天从 A 地出发\n前往 B 地，假设他们买票前没有互通信息，而且火车票票源充足，问：他们买到同一\n趟列车车票的概率有多大？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "小于 10%", "image": null}, {"key": "B", "text": "10到 20之间", "image": null}, {"key": "C", "text": "20到 25之间", "image": null}, {"key": "D", "text": "25到 30之间", "image": null}], "answer": "A", "explanation": "车次共6+5+4=15 种，每个人有15 种选择，总的情况数为（15×15）种，两人买同一车次有15 种情况则所求概率为151515=151 <10%。故本题选A。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-043", "module": "shuliang", "no": 43, "subType": "数学运算", "stem": "一个正三角形和一个正六边形周长相等，则正六边形面积为正三角形的（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "2 倍", "image": null}, {"key": "B", "text": "1.5 倍", "image": null}, {"key": "C", "text": "3 倍", "image": null}, {"key": "D", "text": "2 倍", "image": null}], "answer": "B", "explanation": "由题意，正三角形的边长为正六边形边长的2 倍，正三角形可以划分为4 个边长为其一半的全等的小正三角形，正六边形可以划分为边长与其相等的6 个全等的小正三角形，所以正六边形的面积为正三角形的1.5 倍。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-044", "module": "shuliang", "no": 44, "subType": "数学运算", "stem": "某银行推出 3 年期和 5 年期的两种理财产品 A 和 B。小王分别购买这两种产品\n各 1 万元，结果发现，按单利计算（即利息不产生收益）， B 产品平均年收益率比 A\n产品多 2 个百分点，期满后， B 产品总收益是 A 产品的 2.5 倍。那么，小王各花 1 万元\n购买 A、 B 两种产品的平均年收益分别是（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "700 元和 900 元", "image": null}, {"key": "B", "text": "600 元和 900 元", "image": null}, {"key": "C", "text": "500 元和 700 元", "image": null}, {"key": "D", "text": "400 元和 600 元", "image": null}], "answer": "D", "explanation": "设A 产品的年收益率为x%，年收益为100x 元，则B 产品的年收益率为（x+2）%，年收益为［100×（x+2）］元，根据B 产品总收益是A 产品的2.5 倍，可列等式100x×3×2.5=100×（x+2）×5，解得x=4，则A、B 产品的平均年收益分别为400 元、600 元，故本题选D。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-045", "module": "shuliang", "no": 45, "subType": "数学运算", "stem": "某住户安装了分时电表，白天电价是 0.55 元，夜间电价是 0.3 元，计划 7 月份\n用电 400 度，电费不超过 160 元，那么，白天用电不应该超过多少度？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "150", "image": null}, {"key": "B", "text": "160", "image": null}, {"key": "C", "text": "170", "image": null}, {"key": "D", "text": "180", "image": null}], "answer": "B", "explanation": "设白天用电最大度数为x，夜间用电度数为400-x，那么0.55x+0.3×（400-x）≤160，解得x≤160。故选B。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-046", "module": "shuliang", "no": 46, "subType": "数学运算", "stem": "三个连续的奇数，后两数之积与前两数之积的差为 2004，则这三个数中最小的\n数为多少？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "497", "image": null}, {"key": "B", "text": "499", "image": null}, {"key": "C", "text": "501", "image": null}, {"key": "D", "text": "503", "image": null}], "answer": "B", "explanation": "设最小的数为x，三个奇数依次为x，x+2，x+4。根据题意列方程（x+2）×（x+4）-x×（x+2）=2004，得到x=499。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "shuliang-047", "module": "shuliang", "no": 47, "subType": "数学运算", "stem": "现有 3 个箱子，依次放入 1、 2、 3 个球，然后将 3 个箱子随机编号为甲、乙、\n丙，接着在甲、乙、丙 3 个箱子里分别放入其箱内球数的 2、 3、 4 倍。两次共放了 22\n个球。最终甲箱中的球比乙箱（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "多 1 个", "image": null}, {"key": "B", "text": "少 1 个", "image": null}, {"key": "C", "text": "多 2 个", "image": null}, {"key": "D", "text": "少 2 个", "image": null}], "answer": "A", "explanation": "设第一次放入甲、乙、丙内的个数分别为a、b、c 个，则第二次放入甲、乙、丙的个数分别为2a、3b、4c 个，有225436cbacba，解得a-c=2，根据题意a=3，c=1，所以b=2。此题选A。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "shuliang-048", "module": "shuliang", "no": 48, "subType": "数学运算", "stem": "一个班级组织跑步比赛，共设 100 米、 200 米、 400 米三个项目。班级有 50 人，\n报名参加 100 米比赛的有 27 人，参加 200 米比赛的有 25 人，参加 400 米比赛的有 21\n人。如果每人最多只能报名参加 2 项比赛，那么该班最多有多少人未报名参赛？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "11", "image": null}, {"key": "B", "text": "12", "image": null}, {"key": "C", "text": "13", "image": null}, {"key": "D", "text": "14", "image": null}], "answer": "C", "explanation": "要想未报名参赛的人数最多，则报名参赛的人数应尽可能地少，报名参加两项比赛的人应尽可能地多，此时参加比赛的人数应≥2212527，取最小整数应为37，未报名参赛的人数最多为50-37=13 人，故本题选C。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "shuliang-049", "module": "shuliang", "no": 49, "subType": "数学运算", "stem": "把一个正四面体的每个表面都分成 9 个相同的等边三角形，用任意颜色给这些\n小三角形上色，要求有公共边的小三角形颜色不同，问最多有多少个小三角形颜色相\n同？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "12", "image": null}, {"key": "B", "text": "15", "image": null}, {"key": "C", "text": "16", "image": null}, {"key": "D", "text": "18", "image": null}], "answer": "B", "explanation": "7 内部资免费交图1 图2 我们考虑小三角形颜色相同最多的那种颜色，设其为黑色。在图1 中，我们将不相邻的三角形涂一种颜色，因为要求有公共边的三角形颜色不同，则黑色部分三角形的颜色一样，因此余下三个面相对于这个面的位置是一样的，我们只要分析其中的一个面即可，如图2 所示，只有三个三角形能涂黑色，因此最多有6+3×3=15 个小三角形颜色相同。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "shuliang-050", "module": "shuliang", "no": 50, "subType": "数学运算", "stem": "小王、小张、小李 3 人进行了多轮比赛，比赛按名次高低计分，得分均为正整\n数。多轮比赛结束后，小王得 22 分，小张和小李各得 9 分且小张在其中一轮比赛中获\n第一名。那么，三人共进行了多少轮比赛？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "2", "image": null}, {"key": "B", "text": "3", "image": null}, {"key": "C", "text": "4", "image": null}, {"key": "D", "text": "5", "image": null}], "answer": "D", "explanation": "三个人的总得分为22+9+9=40 分，每一轮比赛会产生3 个名次，不同名次有不同得分，但每一轮的总分相同，则40=轮数×每一轮总分，即轮数是40 的约数，排除B。若为2 轮，每轮三人总分为20 分，由小张得过一轮的第一名且总得分为9，可知第一名的分数最多为8 分，得不到小王的22 分，排除。若为4 轮，每轮三人总分为10 分，由小张得过一轮的第一名且总得分为9，可知第一名的分数最多为6 分，9=6+1+1+1，10=6+1+3，此时小王最多得6×3+3<22 分，排除；若第一名的分数为5 分，9=5+1+1+2，不能组成每轮总分10 分，排除。故本题选D。若为5 轮，每轮得分为8 分，只能是8=5+2+1，此时22=5+5+5+5+2，9=5+1+1+1+1，9=2+2+2+2+1，符合题意。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "shuliang-051", "module": "shuliang", "no": 51, "subType": "数学运算", "stem": "甲、乙、丙三人同时从起点出发，匀速跑向 100 米外的终点，并在到达终点后\n立刻匀速返回起点。甲第一个到达终点时，乙和丙分别距离终点 20 米和 36 米。问当丙\n到达终点时，乙距离起点多少米？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "60", "image": null}, {"key": "B", "text": "64", "image": null}, {"key": "C", "text": "75", "image": null}, {"key": "D", "text": "80", "image": null}], "answer": "C", "explanation": "由题意可知，乙跑80 米时丙跑了64 米，假设丙到达终点时乙又跑了x 米，则有x80 = 3664，解得x=45，故乙距离起点的距离为100-（45-20）=75米。故选C。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "shuliang-052", "module": "shuliang", "no": 52, "subType": "数学运算", "stem": "一个植树小组植树，如果每人栽 6 棵，还剩 14 棵；如果每人栽 7 棵，就缺 4 棵。\n这个植树小组一共要栽多少棵树？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "19", "image": null}, {"key": "B", "text": "59", "image": null}, {"key": "C", "text": "18", "image": null}, {"key": "D", "text": "122", "image": null}], "answer": "D", "explanation": "植树小组有（14+4）÷（7-6）=18 人，一共要栽树6×18+14=122棵。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "shuliang-053", "module": "shuliang", "no": 53, "subType": "数学运算", "stem": "在一次产品质量抽查中，某批次产品被抽出 10 件样品进行检验，其中恰有两件\n不合格品。如果对这 10 件样品逐件进行检验，则这两件不合格品恰好在第五次被全部\n检出的概率是（）。\n45 45 45 90", "stemImages": ["img/graph/SL-s-010.png", "img/graph/SL-fig-001.png"], "optionImage": null, "graphicOptions": true, "options": [{"key": "A", "text": "", "image": null}, {"key": "B", "text": "", "image": null}, {"key": "C", "text": "", "image": null}, {"key": "D", "text": "", "image": null}], "answer": "A", "explanation": "所求事件为前4 次抽出1 件不合格品，第5 次为不合格品。则概率为1010881412AACC= 454。故选A。 8 内部资免费交流", "material": null, "srcPage": 6, "imgN": 2, "f": []}, {"id": "shuliang-054", "module": "shuliang", "no": 54, "subType": "数学运算", "stem": "把黑桃、红桃、方片、梅花四种花色的扑克牌按黑桃 10 张、红桃 9 张、方片 7\n张、梅花 5 张的顺序循环排列。问第 2015 张扑克牌是什么花色？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "黑桃", "image": null}, {"key": "B", "text": "红桃", "image": null}, {"key": "C", "text": "梅花", "image": null}, {"key": "D", "text": "方片", "image": null}], "answer": "C", "explanation": "一个完整的循环包括黑桃10 张，红桃9 张，方片7 张，梅花5 张，共31 张，2015 可被31 整除（2015÷31=65），因此第2015 张牌是梅花。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "shuliang-055", "module": "shuliang", "no": 55, "subType": "数学运算", "stem": "青年义务服务队甲队原有 35 人，乙队原有 176 人，因任务需要，甲队人力应加\n强，现从预备队调来 2 人，再从乙队支援多少人后，甲队人数刚好是乙队人数的一半？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "35", "image": null}, {"key": "B", "text": "34", "image": null}, {"key": "C", "text": "33", "image": null}, {"key": "D", "text": "88", "image": null}], "answer": "B", "explanation": "最后甲队的人数为（35+2+176）÷3=71 人，所以从乙队支援了71-35-2=34 人。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "shuliang-056", "module": "shuliang", "no": 56, "subType": "数学运算", "stem": "某乡镇对集贸市场 36 种食品进行检查，发现超过保质期的 7 种，防腐添加剂不\n合格的 9 种，产品外包装标识不规范的 6 种。其中，两项同时不合格的 5 种，三项同时\n不合格的 2 种。问三项全部合格的食品有多少种？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "14", "image": null}, {"key": "B", "text": "21", "image": null}, {"key": "C", "text": "23", "image": null}, {"key": "D", "text": "32", "image": null}], "answer": "C", "explanation": "不合格的食品数共有7+9+6-5-2×2=13，则三项全部合格的食品有36-13=23 种。", "material": null, "srcPage": 7, "img le": "shuliang", "no": 71, "subType": "数学运算", "stem": "甲、乙、丙 3 个施工队，乙的工效与甲、丙两队合作的工效相等，丙的工效是\n甲、乙两队合作工效的四分之一。现有一项工程，据测算，三队合作 30 个工作日可完\n成。如果由甲队单独来做，需要多少个工作日？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "60", "image": null}, {"key": "B", "text": "96", "image": null}, {"key": "C", "text": "100", "image": null}, {"key": "D", "text": "150", "image": null}], "answer": "C", "explanation": "设甲、乙、丙的效率分别为x、y、z，根据题意有y=x+z、x+y=4z，解得3y=5x，设甲的效率为3，乙效率为5，则丙效率为2，三队合作30 个工作日完成30×（2+3+5）=300，该工作总量由甲单独完成，需要300÷3=100 天。故选C。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "shuliang-072", "module": "shuliang", "no": 72, "subType": "数学运算", "stem": "商店里花布的米数是白布的 2 倍，如果每天卖 30 米白布和 40 米花布，几天后，\n白布全部卖完，而花布还剩 120 米，商店里原来有花布多少米？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "360", "image": null}, {"key": "B", "text": "300", "image": null}, {"key": "C", "text": "240", "image": null}, {"key": "D", "text": "180", "image": null}], "answer": "A", "explanation": "方法一，设n 天以后，白布全部卖完，则有40n+120=2×30n，解得n=6。所以花布原有40×6+120=360 米方法二，已知花布米数是白布的2 倍，则每天卖30 米白布和60 米花布，则会都卖完，所以卖了120÷（60-40）=6 天，故原来有花布40×6+120=360 米。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "shuliang-073", "module": "shuliang", "no": 73, "subType": "数学运算", "stem": "有六个人的平均年龄是 16 岁，把其中一个人换成另外一个 13 岁少年后，再增\n加一个 20 岁的青年，这七个人的平均年龄则变为 18 岁。被换掉的那个人的年龄是多少？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "6 岁", "image": null}, {"key": "B", "text": "3 岁", "image": null}, {"key": "C", "text": "5 岁", "image": null}, {"key": "D", "text": "4 岁", "image": null}], "answer": "B", "explanation": "换人之前六个人年龄和是16×6=96 岁，七个人的年龄和是18×7=126 岁，其中不变的五个人年龄和是126-13-20=93 岁，则被换掉的那个人年龄是96-93=3 岁，选择B。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "shuliang-074", "module": "shuliang", "no": 74, "subType": "数学运算", "stem": "鲜花队准备排成一个正方形队列，由于服装不够，只好减少 27 人，使横竖各减\n少了一排，鲜花队现在的 Type": "数学运算", "stem": "张某和李某在同一家公司工作，其 2017 年的月薪都是 10000 元。已知张某和\n李某加入公司第一年的月薪都是 4000 元，张某每年的月薪都比上一年上涨 Y 元，而李\n某每年的月薪都比上一年上涨（Y+200）元。则张某在公司最少工作了几年？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "6", "image": null}, {"key": "B", "text": "5", "image": null}, {"key": "C", "text": "4", "image": null}, {"key": "D", "text": "3 2 1", "image": null}], "answer": "A", "explanation": "方法一，根据题意，张某和李某的月薪都涨了10000-4000=6000元，则6000 能被Y 和Y+200 整除，求最少工作了几年，即要求Y 尽可能大。6000 的约数由大到小为6000，3000，2000，1500，1200，1000……，其中1200 和1000 相差200，每年上涨一次工资，则张某至少工作了10006000 =6 年。故本题选A方法二，根据题意，张某和李某的月薪都涨了10000-4000=6000 元，每年上涨一次工资，则张某工作了Y6000 年，可利用代入排除法，代入A 项，张某工作6 年，Y=66000 15 内部资免费交流 =1000，李某工作了20010006000=5 年，满足题意。验证B、C、D 三项都不符合题意。故本题选A。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "shuliang-103", "module": "shuliang", "no": 103, "subType": "数字推理", "stem": "", "stemImages": ["img/graph/SL-s-021.png"], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "33", "image": null}, {"key": "B", "text": "11", "image": null}, {"key": "C", "text": "30", "image": null}, {"key": "D", "text": "19", "image": null}], "answer": "A", "explanation": "设分数为xy，则有213-522yxyx解得2310yx。故x+y=33。此题也可这样分析，两次变换所得分数，分子相同，分母相差3+2=5。12= 24，与25相比，分子都为2，分母相差1，故1 份为5，所以两次变换所得分数是1025、1020，故原分数是1023，分子与分母之和为33。", "material": null, "srcPage": 13, "imgN": 1, "f": []}, {"id": "shuliang-104", "module": "shuliang", "no": 104, "subType": "数学运算", "stem": "小周买了五件价格不等的服装，总价为 2160 元。其中最贵的两件衣服总价与\n其余三件衣服的总价相当，而最便宜的两件衣服的总价比最贵的衣服高 100 元，比第二\n贵的衣服高 200 元。则第三贵的衣服价格是多少元？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "300", "image": null}, {"key": "B", "text": "330", "image": null}, {"key": "C", "text": "360", "image": null}, {"key": "D", "text": "390", "image": null}], "answer": "D", "explanation": "总价为2160 元，设价格从高到低分别为a1、a 2、a 3、a 4、a 5，由题意知，a 1 +a 2 =a 3 +a 4 +a 5 =1080 元，a 4 +a 5 =a1 +100，a 4 +a 5 =a 2 +200，则a 4+a 5 =（a 1 +100+a 2 +200）÷2=（1080+300）÷2=690，则价格第三贵的衣服价格为a 3=1080-690=390 元，答案选D。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "shuliang-105", "module": "shuliang", "no": 105, "subType": "数学运算", "stem": "甲、乙、丙、丁四人赛跑，已知乙比丙快 3 分钟，丁比甲快 6 分钟，丙比丁慢\n1 分钟，那么最快和最慢的相差几分钟？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "6", "image": null}, {"key": "B", "text": "7", "image": null}, {"key": "C", "text": "8", "image": null}, {"key": "D", "text": "9", "image": null}], "answer": "C", "explanation": "乙比丙快3 分钟，丙比丁慢1 分钟，则乙比丁快2 分钟；又丁比甲快6 分钟，所以，最快的是乙，最慢的是甲，乙比甲快8 分钟。故本题选C。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "shuliang-106", "module": "shuliang", "no": 106, "subType": "数学运算", "stem": "小王近期正在减肥，某天他匀速健步走 20 分钟后，计步器显示他走了 3800 步，\n2.5 千米，消耗热量 150 千卡。则为了达到通过健步走消耗 600 千卡热量的目标，他还\n得继续走多少步？（假设小王每走一步，消耗的热量保持不变）", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "3800", "image": null}, {"key": "B", "text": "7600", "image": null}, {"key": "C", "text": "11400", "image": null}, {"key": "D", "text": "15200", "image": null}], "answer": "C", "explanation": "由题可知还需要消耗600-150=450 千卡热量才能达到目标，消耗150 千卡热量需要走3800 步，则消耗450 千卡热量需要走（450÷150）×3800=11400步，选择C。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "shuliang-107", "module": "shuliang", "no": 107, "subType": "数学运算", "stem": "工业原料 A 因供不应求，每吨的价格上涨了 20，导致使用 A 原料的产品每\n件生产成本较最初上涨了 120 元，此时，企业改进生产工艺，每件产品可少使用 A 原\n料 1 千克，此时每件产品的生产成本只较最初上涨 40 元。则改进生产工艺之前，每件\n产品使用多少千克 A 原料？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "12", "image": null}, {"key": "B", "text": "9", "image": null}, {"key": "C", "text": "7.5", "image": null}, {"key": "D", "text": "6", "image": null}], "answer": "B", "explanation": "设A 原料每千克的价格为m 元，则价格上涨后每千克为1.2m 元；改进生产工艺前，生产每件产品需要A 原料x 千克。根据题意，则有mxxmx）（）（12.1m-m2.1= 40120，即2.12.02.0xx=3，解得x=9。故本题选B。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "shuliang-108", "module": "shuliang", "no": 108, "subType": "数学运算", "stem": "甲和乙走完 AB 两地之间的距离分别需要 120 分钟和 X 分钟。某日甲从 A 地\n出发前往 B 地， 1 小时后乙从 B 地出发前往 A 地，两人到达目的地后都立即折返。如\n甲和乙前两次相遇都是迎面相遇，则 X 的取值范围为（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "30<X<150", "image": null}, {"key": "B", "text": "30<X<180", "image": null}, {"key": "C", "text": "40<X<150", "image": null}, {"key": "D", "text": "40<X<180", "image": null}], "answer": "B", "explanation": "甲乙第一次一定会迎面相遇，第二次迎面相遇考虑两种极限情况。一种是乙到A 地后又返回B 地时，甲刚好到达B 地，此时甲走了120÷2=60分钟，乙走了2 个全程，此情况下X=60÷2=30 分钟。另一种是当甲返回A 地时，乙刚 16 内部资免费交好到达A 地，则甲走了120÷2×3=180 分钟，同时乙走了一个全程，此情况下X=180 分钟。所以30<X<180。故本题选B。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "shuliang-109", "module": "shuliang", "no": 109, "subType": "数学运算", "stem": "某工厂的产品有 7 家代理商，如果以满意度最高为 7 分，满意度最低为 1 分，\n7 家代理商对工厂的满意度正好是 1 分到 7 分的不同整数值。若从中任意选择 3 家代理\n商进行调查，其对工厂满意度的平均值与所有代理商满意度平均值相差小于 1 的概率为", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "30%", "image": null}, {"key": "B", "text": "40%", "image": null}, {"key": "C", "text": "48%", "image": null}, {"key": "D", "text": "60%", "image": null}], "answer": "D", "explanation": "所有代理商满意度的平均值为数字1～7 的平均数，为4。任选3 家代理商对工厂满意度的平均值与4 相差小于1，则满意度分数之和与12 相差小于3，即为10～14观察1～7 中任意三个数的和。其中2～6 中最小和为2+3+4=9，最大和为4+5+6=15，其余任意三个数的和均满足10～14，有35C -2=8 种；选择1 和2～6 中任意两个数，应满足2～6 中任意两个数的和大于等于9，只有（3，6）（4，5）（4，6）（5，6）4种；选择7 和2～6 中任意两个数，应满足2～6 中任意两个数的和小于等于7，只有（2，3）（2，4）（2，5）（3，4）4 种；选择1、7 和2～6 中任意一个数，和为10～14，有15C =5 种。符合题意的情况数为8+4+4+5=21 种，所有的情况数为37C =35，所求概率为21÷35=60%。故本题选D。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "shuliang-110", "module": "shuliang", "no": 110, "subType": "数学运算", "stem": "将 90 分为 a、 b、 c、 d 四个数之和，如果 a 数加上 2， b 减去 2， c 数乘以 2， d\n数除以 2 后得到的四个数相等，那么 a、 b、 c、 d 四个数的值分别为（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "
