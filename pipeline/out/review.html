e": null}, {"key": "C", "text": "技术层", "image": null}, {"key": "D", "text": "基础层", "image": null}], "answer": "A", "explanation": "由图2 所示可知，“自动驾驶”“智慧城市”概念均属于人工智能的应用层。故本题选A。", "material": {"id": "yanyu-m01", "module": "yanyu", "title": "篇章1", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "人工智能，英文缩写为 AI （ArtificialIntelligence），指的是由人类发明设计的智能"}, {"t": "text", "v": "系统，能够模仿人类的思考方式，实现人脑的部分功能，替代人脑解决特定问题。"}, {"t": "text", "v": "人工智能的概念最早在 20 世纪 50 年代提出， 1956 年的达特茅斯暑期会议上正式"}, {"t": "text", "v": "提出了人工智能的概念。期间经历了三次发展浪潮，当前处于第三次大发展期。"}, {"t": "text", "v": "第一次浪潮发生在 1956 — 1976 年，主导理论是逻辑主义，主要成果是完成了一些"}, {"t": "text", "v": "定理证明以及一些逻辑程序语言。"}, {"t": "text", "v": "第二次浪潮发生在 1976 — 2006 年，主导理论是连接主义，主要成果是神经网络理"}, {"t": "text", "v": "论的提出以及应用。但是在实践中发现可以解决一些简单、单一的问题，对于复杂问题"}, {"t": "text", "v": "的处理效果不尽理想。"}, {"t": "text", "v": "第三次浪潮发生在 2006 —现在，可以称之为基于互联网大数据的深度学习，将大"}, {"t": "text", "v": "数据、神经元网络和数学统计的方法结合在一起。第三次浪潮的理论基础和第二次浪潮"}, {"t": "text", "v": "类似。主要的差别在于基于神经网络的深度学习算法取得了巨大的成功。这里的主要推"}, {"t": "text", "v": "动因素包括了硬件的进步、卷积神经网格模型优化、参数训练技巧的发展等。"}, {"t": "img", "v": "img/material/YY-mat01-01.png"}, {"t": "text", "v": "1"}, {"t": "text", "v": "前两次浪潮解决了人工智能的一些基础理论问题，第三次浪潮的发展已经使得人工"}, {"t": "text", "v": "智能技术的发展程度（识别率、准确率等）可以实际解决很多传统需要人类大脑才能解"}, {"t": "text", "v": "决的问题，具备了很强的实用性，获得生产力。"}, {"t": "text", "v": "人工智能根据从底层到应用的技术逻辑可以分成基础层、技术层、应用层。"}, {"t": "text", "v": "基础层从硬件和理论层面，为人工智能的实现提供了根本保障，主要包括 AI 芯片"}, {"t": "text", "v": "和深度学习算法， AI 芯片的发展进步，提供了越来越强的计算能力 ; 深度学习算法的"}, {"t": "text", "v": "建立，提供了 AI 解决问题的计算方法。"}, {"t": "text", "v": "技术层是基于基础层的支撑，设计出的解决某一类过去需要人脑解决问题的通用方"}, {"t": "text", "v": "法，具体包括智能语音、计算机视觉、自然语言处理以及其他类这四大人脑功能的处理"}, {"t": "text", "v": "方法。这些方法基于深度学习算法，根据具体的数据以及处理场景，形成了专门的成套"}, {"t": "text", "v": "技术处理方法和最佳实践，通过技术层的实现，我们可以将基础层提供的计算能力以及"}, {"t": "text", "v": "计算方法运用到具体领域，去真实对应到大脑的某一类功能以及实践能力。"}, {"t": "text", "v": "应用层是指基于技术层的能力，去解决具体现实生活中的问题。比如利用计算机视"}, {"t": "text", "v": "觉技术，实现金融、安防等多个领域的人脸识别，利用智能语音技术，实现智能音箱、"}, {"t": "text", "v": "录音笔等的语音识别 ; 利用自然语言处理技术，用于智能客服的问答。在实际的应用中，"}, {"t": "text", "v": "技术层和应用层的关系是相互交叉的，某个领域的应用可能用到多个维度的技术层的能"}, {"t": "text", "v": "力，比如金融行业的应用对于智能语音、计算机视觉、自然语言处理技术都会有需求 ;"}, {"t": "text", "v": "同样某个技术层的能力也可以广泛应用到多个不同的应用领域，比如计算机视觉技术可"}, {"t": "text", "v": "以广泛应用到金融、安防、医疗、交通、教育等多个维度。"}, {"t": "img", "v": "img/material/YY-mat01-02.png"}, {"t": "text", "v": "2"}, {"t": "text", "v": "当前的人工智能应用的核心，是基于神经网络的深度学习，该方法的特点是需要根"}, {"t": "text", "v": "据特定应用目的，利用大量且优质的数据，对学习网络进行反复训练，通过传播算法，"}, {"t": "text", "v": "不断自动变换各层以及各节点的参数，以最终得到符合实际应用要求的训练结果。"}]}, "srcPage": 36, "imgN": 0, "f": []}, {"id": "yanyu-125", "module": "yanyu", "no": 125, "subType": "篇章阅读", "stem": "从文中可以知道，影响特定场景下人工智能对问题解决效果的关键因素包括：\n（1）足量的优质数据集\n（2）不断优化的算法\n（3）处理海量数据的强大算力\n（4）源源不断的资金投入", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "只有（1）（2）和（3）", "image": null}, {"key": "B", "text": "只有（2）（3）和（4）", "image": null}, {"key": "C", "text": "只有（3）（4）", "image": null}, {"key": "D", "text": "只有（1）（2）", "image": null}], "answer": "A", "explanation": "由材料最后一段内容可知，人工智能的核心是基于神经网络的深度学习，该方法的特点是需要根据特定应用目的，利用大量且优质的数据，对学习网络进行反复训练，通过传播算法，不断自动变换各层以及各节点的参数，以最终得到符合实际应用要求的训练结果。深度学习的训练特点，决定了数据、算法、算力、领域专业能力是人工智能效果的关键。因此影响特定场景下人工智能解决问题效果的关键因素包括了（1）（2）（3）。（4）的资金投入在文章中未体现。故本题选A。", "material": {"id": "yanyu-m01", "module": "yanyu", "title": "篇章1", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "人工智能，英文缩写为 AI （ArtificialIntelligence），指的是由人类发明设计的智能"}, {"t": "text", "v": "系统，能够模仿人类的思考方式，实现人脑的部分功能，替代人脑解决特定问题。"}, {"t": "text", "v": "人工智能的概念最早在 20 世纪 50 年代提出， 1956 年的达特茅斯暑期会议上正式"}, {"t": "text", "v": "提出了人工智能的概念。期间经历了三次发展浪潮，当前处于第三次大发展期。"}, {"t": "text", "v": "第一次浪潮发生在 1956 — 1976 年，主导理论是逻辑主义，主要成果是完成了一些"}, {"t": "text", "v": "定理证明以及一些逻辑程序语言。"}, {"t": "text", "v": "第二次浪潮发生在 1976 — 2006 年，主导理论是连接主义，主要成果是神经网络理"}, {"t": "text", "v": "论的提出以及应用。但是在实践中发现可以解决一些简单、单一的问题，对于复杂问题"}, {"t": "text", "v": "的处理效果不尽理想。"}, {"t": "text", "v": "第三次浪潮发生在 2006 —现在，可以称之为基于互联网大数据的深度学习，将大"}, {"t": "text", "v": "数据、神经元网络和 此应尽量减少使用", "image": null}, {"key": "D", "text": "食品添加剂已成为现代食品工业生产中不可缺少的物质", "image": null}], "answer": "D", "explanation": "食品添加剂是指经国家批准的，因防腐保鲜、提高加工工艺等需要而加入食品中的化学合成物或天然物质。A 项描述不全面，排除。文中只提到在安全范围内使用食品添加剂是安全的，未提到有益，排除B。结合文段，食品添加剂的使用直接影响食品安全，但并未提到尽量减少使用，排除C 项。故本题答案为D。", "material": {"id": "yanyu-m02", "module": "yanyu", "title": "篇章2", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "俗话说：“民以食为天。”近年来，我们的食品安全环境日趋严峻，随着毒奶粉、"}, {"t": "text", "v": "染色馒头等事件的不断出现，人们不禁要问，食品添加剂安全吗？"}, {"t": "text", "v": "食品添加剂是指经国家批准的，因防腐保鲜、提高加工工艺等需要而加入食品中的"}, {"t": "text", "v": "化学合成物或天然物质。我国《食品添加剂使用卫生标准》将其分为防腐剂、凝固剂、"}, {"t": "text", "v": "品质改良剂、增味剂、营养强化剂等 22 类 1500 多种。当人类的食品进入工业化生产之"}, {"t": "text", "v": "后，除了极少数的天然野生食品外，几乎没有什么是不含添加成分的。目前，近 97%"}, {"t": "text", "v": "的食品中使用了各类添加剂。"}, {"t": "text", "v": "食品添加剂对食品的防腐保鲜效果十分明显。根据食品安全要求，每克食品的细菌"}, {"t": "text", "v": "总数不能超过 8 万个。假如不用防腐剂，即使在 0~4 ℃的低温环境中，肉制品保存到第"}, {"t": "text", "v": "五天，细菌总数也将超过每克 10 万个。而防腐剂能遏制肉制品中的肉毒梭状芽孢杆菌"}, {"t": "text", "v": "的大量繁殖，有效延长肉制品的保质期。现在人们所吃的食品的酸、甜、鲜通常不是食"}, {"t": "text", "v": "品天然拥有的味道，往往是由添加剂“调”出来的。食品的诱人口感，如面条有弹性，"}, {"t": "text", "v": "点心酥脆，大多也是添加剂的功劳。"}, {"t": "text", "v": "腐乳红曲是由大米发酵而来的，能够降低血脂，它既是色素又是功能性添加剂；从"}, {"t": "text", "v": "甘草里面提取的甜味剂，能改善肝功能；从玉米芯里面提取的木糖醇具有护肝、防龋齿"}, {"t": "text", "v": "的作用。在面粉里面添加钙粉、维生素等，能使面粉的营养更加全面。"}, {"t": "text", "v": "现代食品工业发展离不开食品添加剂，食品添加剂的使用也直接影响食品安全。例"}, {"t": "text", "v": "如，摄入过多的膨松剂或防腐剂，轻则会引起流口水、腹泻、心跳加快等症状，重则会"}, {"t": "text", "v": "对胃、肝、肾造成严重危害。为规范食品添加剂的使用，各国都制定了严格的法律法规。"}, {"t": "text", "v": "如我国的食品卫生标准就明确规定，山梨酸钾可以作为食品防腐剂，但必须严格控制添"}, {"t": "text", "v": "加比例，它的许可添加量在 0.5以内。在美国，苯甲酸钠只允许在化妆品中使用，并"}, {"t": "text", "v": "且浓度必须在 0.1%~0.2范围内。世界卫生组织也规定了一个“ADI”，即依照人"}, {"t": "text", "v": "体体重，一种无健康危害的食品添加剂的每日允许摄入量的估计值。例如：糖精钠的"}, {"t": "text", "v": "ADI 值为 5 毫克 / 公斤，即糖精钠每日允许摄入量为每公斤体重 5 毫克。"}, {"t": "text", "v": "必须指出的是，一直受到人们谴责的苏丹红、三聚氰胺等都不是食品添加剂，而是"}, {"t": "text", "v": "非法添加物。这样的非法添加物常见的还有块黄、硼酸、硫氰酸钠、蛋白精、酸性橙等。"}, {"t": "text", "v": "一般来说，不违规、不超量、不超范围地使用食品添加剂的食品是安全的。"}]}, "srcPage": 37, "imgN": 0, "f": []}, {"id": "yanyu-127", "module": "yanyu", "no": 127, "subType": "篇章阅读", "stem": "下列关于食品添加剂功能的表述，不符合原文意思的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "延年益寿的功能", "image": null}, {"key": "B", "text": "改善食品外观和味道的功能", "image": null}, {"key": "C", "text": "防病抗病功能", "image": null}, {"key": "D", "text": "防腐保鲜功能", "image": null}], "answer": "A", "explanation": "结合文段可知，食品添加剂的功能包括改善食品外观和味道（如面条有弹性）、防病抗病（如木糖醇有护肝、防龋齿的作用）、防腐保鲜（如山梨酸钾）。A 项在文中没有论及，当选。", "material": {"id": "yanyu-m02", "module": "yanyu", "title": "篇章2", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "俗话说：“民以食为天。”近年来，我们的食品安全环境日趋严峻，随着毒奶粉、"}, {"t": "text", "v": "染色馒头等事件的不断出现，人们不禁要问，食品添加剂安全吗？"}, {"t": "text", "v": "食品添加剂是指经国家批准的，因防腐保鲜、提高加工工艺等需要而加入食品中的"}, {"t": "text", "v": "化学合成物或天然物质。我国《食品添加剂使用卫生标准》将其分为防腐剂、凝固剂、"}, {"t": "text", "v": "品质改良剂、增味剂、营养强化剂等 22 类 1500 多种。当人类的食品进入工业化生产之"}, {"t": "text", "v": "后，除了极少数的天然野生食品外，几乎没有什么是不含添加成分的。目前，近 97%"}, {"t": "text", "v": "的食品中使用了各类添加剂。"}, {"t": "text", "v": "食品添加剂对食品的防腐保鲜效果十分明显。根据食品安全要求，每克食品的细菌"}, {"t": "text", "v": "总数不能超过 8 万个。假如不用防腐剂，即使在 0~4 ℃的低温环境中，肉制品保存到第"}, {"t": "text", "v": "五天，细菌总数也将超过每克 10 万个。而防腐剂能遏制肉制品中的肉毒梭状芽孢杆菌"}, {"t": "text", "v": "的大量繁殖，有效延长肉制品的保质期。现在人们所吃的食品的酸、甜、鲜通常不是食"}, {"t": "text", "v": "品天然拥有的味道，往往是由添加剂“调”出来的。食品的诱人口感，如面条有弹性，"}, {"t": "text", "v": "点心酥脆，大多也是添加剂的功劳。"}, {"t": "text", "v": "腐乳红曲是由大米发酵而来的，能够降低血脂，它既是色素又是功能性添加剂；从"}, {"t": "text", "v": "甘草里面提取的甜味剂，能改善肝功能；从玉米芯里面提取的木糖醇具有护肝、防龋齿"}, {"t": "text", "v": "的作用。在面粉里面添加钙粉、维生素等，能使面粉的营养更加全面。"}, {"t": "text", "v": "现代食品工业发展离不开食品添加剂，食品添加剂的使用也直接影响食品安全。例"}, {"t": "text", "v": "如，摄入过多的膨松剂或防腐剂，轻则会引起流口水、腹泻、心跳加快等症状，重则会"}, {"t": "text", "v": "对胃、肝、肾造成严重危害。为规范食品添加剂的使用，各国都制定了严格的法律法规。"}, {"t": "text", "v": "如我国的食品卫生标准就明确规定，山梨酸钾可以作为食品防腐剂，但必须严格控制添"}, {"t": "text", "v": "加比例，它的许可添加量在 0.5以内。在美国，苯甲酸钠只允许在化妆品中使用，并"}, {"t": "text", "v": "且浓度必须在 0.1%~0.2范围内。世界卫生组织也规定了一个“ADI”，即依照人"}, {"t": "text", "v": "体体重，一种无健康危害的食品添加剂的每日允许摄入量的估计值。例如：糖精钠的"}, {"t": "text", "v": "ADI 值为 5 毫克 / 公斤，即糖精钠每日允许摄入量为每公斤体重 5 毫克。"}, {"t": "text", "v": "必须指出的是，一直受到人们谴责的苏丹红、三聚氰胺等都不是食品添加剂，而是"}, {"t": "text", "v": "非法添加物。这样的非法添加物常见的还有块黄、硼酸、硫氰酸钠、蛋白精、酸性橙等。"}, {"t": "text", "v": "一般来说，不违规、不超量、不超范围地使用食品添加剂的食品是安全的。"}]}, "srcPage": 38, "imgN": 0, "f": []}, {"id": "yanyu-128", "module": "yanyu", "no": 128, "subType": "篇章阅读", "stem": "根据原文内容，下列理解和分析不正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "目前，只有约 3的食品中没有使用食品添加剂", "image": null}, {"key": "B", "text": "苏丹红、三聚氰胺、苯甲酸钠都属于非法添加剂", "image": null}, {"key": "C", "text": "山梨酸钾作为食品防腐剂，过量食用会对胃、肝、肾造成严重危害", "image": null}, {"key": "D", "text": "腐乳红曲、甘草甜味剂、玉米木糖醇等对健康有益", "image": null}], "answer": "B", "explanation": "由“在美国，苯甲酸钠只允许在化妆品中使用”可知，苯甲酸钠虽然只允许在化妆品中出现，但并未被归为非法添加物。故本题答案为B。", "material": {"id": "yanyu-m02", "module": "yanyu", "title": "篇章2", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "俗话说：“民以食为天。”近年来，我们的食品安全环境日趋严峻，随着毒奶粉、"}, {"t": "text", "v": "染色馒头等事件的不断出现，人们不禁要问，食品添加剂安全吗？"}, {"t": "text", "v": "食品添加剂是指经国家批准的，因防腐保鲜、提高加工工艺等需要而加入食品中的"}, {"t": "text", "v": "化学合成物或天然物质。我国《食品添加剂使用卫生标准》将其分为防腐剂、凝固剂、"}, {"t": "text", "v": "品质改良剂、增味剂、营养强化剂等 22 类 1500 多种。当人类的食品进入工业化生产之"}, {"t": "text", "v": "后，除了极少数的天然野生食品外，几乎没有什么是不含添加成分的。目前，近 97%"}, {"t": "text", "v": "的食品中使用了各类添加剂。"}, {"t": "text", "v": "食品添加剂对食品的防腐保鲜效果十分明显。根据食品安全要求，每克食品的细菌"}, {"t": "text", "v": "总数不能超过 8 万个。假如不用防腐剂，即使在 0~4 ℃的低温环境中，肉制品保存到第"}, {"t": "text", "v": "五天，细菌总数也将超过每克 10 万个。而防腐剂能遏制肉制品中的肉毒梭状芽孢杆菌"}, {"t": "text", "v": "的大量繁殖，有效延长肉制品的保质期。现在人们所吃的食品的酸、甜、鲜通常不是食"}, {"t": "text", "v": "品天然拥有的味道，往往是由添加剂“调”出来的。食品的诱人口感，如面条有弹性，"}, {"t": "text", "v": "点心酥脆，大多也是添加剂的功劳。"}, {"t": "text", "v": "腐乳红曲是由大米发酵而来的，能够降低血脂，它既是色素又是功能性添加剂；从"}, {"t": "text", "v": "甘草里面提取的甜味剂，能改善肝功能；从玉米芯里面提取的木糖醇具有护肝、防龋齿"}, {"t": "text", "v": "的作用。在面粉里面添加钙粉、维生素等，能使面粉的营养更加全面。"}, {"t": "text", "v": "现代食品工业发展离不开食品添加剂，食品添加剂的使用也直接影响食品安全。例"}, {"t": "text", "v": "如，摄入过多的膨松剂或防腐剂，轻则会引起流口水、腹泻、心跳加快等症状，重则会" <script>
const D = JSON.parse(document.getElementById('data').textContent);
const PAGES = D.pages, IMG = 'images/';
let mod = 'all';
const list = document.getElementById('list');
const stat = document.getElementById('stat');

function imgTag(p){ return '<img loading="lazy" src="'+p+'">'; }

function card(q){
  const imgs = q.stemImages.concat(q.optionImage?[q.optionImage]:[])
    .concat(q.options.filter(o=>o.image).map(o=>o.image));
  let h = '<div class="q" data-mod="'+q.module+'" data-img="'+(imgs.length?1:0)
        + '" data-mat="'+(q.materialId?1:0)+'" data-bad="'+(q.f.length?1:0)
        + '" data-txt="'+q.id+' '+q.stem+'">';
  h += '<div class="hd"><span class="id">'+q.id+'</span>'
     + '<span class="tag">'+q.no+' 题</span>'
     + '<span class="tag sub">'+q.subType+'</span>';
  q.f.forEach(x=>h+='<span class="flag">'+x+'</span>');
  h += '<span class="spacer"><span class="btn pgbtn">原PDF页 '+q.srcPage+'</span></span></div>';

  if(q.material){
    h += '<div class="mat"><div class="t">材料 '+q.material.title+'</div>';
    q.material.content.forEach(c=>{
      h += c.t==='text' ? '<div>'+esc(c.v)+'</div>' : imgTag(IMG+basename(c.v));
    });
    h += '</div>';
  }
  if(q.stem) h += '<div class="stem">'+q.stem+'</div>';
  q.stemImages.forEach(p=>h+=imgTag(IMG+basename(p)));
  if(q.optionImage) h += '<div class="tag">选项合图</div>'+imgTag(IMG+basename(q.optionImage));

  h += '<div class="opts">';
  q.options.forEach(o=>{
    h += '<div class="opt'+(o.key===q.answer?' right':'')+'"><span class="k">'+o.key
       + '</span>'+(o.text?esc(o.text):'')+(o.image?imgTag(IMG+basename(o.image)):'');
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="ans">答案 <b>'+(q.answer||'?')+'</b></div>';
  h += '<div class="exp'+(document.getElementById('fAllExp').checked?' show':'')
     + '">'+esc(q.explanation)+'</div>';
  h += '<div class="pg"><img loading="lazy" src="pages/'+PAGES[q.module]+'-'
     + String(q.srcPage).padStart(3,'0')+'.png"></div>';
  return h+'</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function basename(p){return p.split('/').pop();}

function render(){
  const kw = document.getElementById('q').value.trim().toLowerCase();
  const fi = document.getElementById('fImg').checked;
  const fm = document.getElementById('fMat').checked;
  const fb = document.getElementById('fBad').checked;
  let n = 0;
  let h = '';
  D.questions.forEach(q=>{
    if(mod!=='all' && q.module!==mod) return;
    if(fi && !q.imgN) return;
    if(fm && !q.materialId) return;
    if(fb && !q.f.length) return;
    if(kw && !(q.id+' '+q.stem+' '+q.explanation).toLowerCase().includes(kw)) return;
    n++; h += card(q);
  });
  list.innerHTML = h;
  stat.textContent = '显示 '+n+' / '+D.questions.length+' 题'
    + '（可疑 '+D.questions.filter(q=>q.f.length).length+'）';
}
list.addEventListener('click', e=>{
  const b = e.target.closest('.pgbtn');
  if(b){ b.closest('.q').querySelector('.pg').classList.toggle('show'); return; }
  const ex = e.target.closest('.exp');
  if(ex) ex.classList.toggle('show');
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); mod = t.dataset.mod; render(); window.scrollTo(0,0);
});
['fImg','fMat','fBad','fAllExp'].forEach(id=>{
  document.getElementById(id).onchange = render;
});
document.getElementById('q').oninput = render;
render();
</script></body></html>
