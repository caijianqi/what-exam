集合容斥问题，所求为49+36+28-13-9×2=82。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "shuliang-114", "module": "shuliang", "no": 114, "subType": "数学运算", "stem": "某公司 100 名员工对甲、乙两名经理进行满意度评议，对甲满意的人数占全体\n参加评议员工，对乙满意的人数比甲的人数多 6 人，对甲、乙都不满意的占都满\n意人数多 2 人，则对甲、乙都满意的人数是多少人？", "stemImages": ["img/graph/SL-fig-013.png"], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "36", "image": null}, {"key": "B", "text": "26", "image": null}, {"key": "C", "text": "48", "image": null}, {"key": "D", "text": "42", "image": null}], "answer": "D", "explanation": "对甲满意的人数为100×53 =60 人，对乙满意的人数为60+6=66人。设对甲、乙都满意的人数为x 人，则对甲、乙都不满意的人数为（31 x+2）人，满足60+66-x=100-（31 x+2），解得x=42。", "material": null, "srcPage": 14, "imgN": 1, "f": []}, {"id": "shuliang-115", "module": "shuliang", "no": 115, "subType": "数学运算", "stem": "一厂家生产销售某新型节能产品，产品生产成本是 168 元，销售定价为 238 元，\n一位买家向该厂家预订了 120 件产品，并提出如果产品售价每降低 2 元，就多订购 8\n件。则该厂家在这笔交易中所能获得的最大利润是（）元。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "17920", "image": null}, {"key": "B", "text": "13920", "image": null}, {"key": "C", "text": "10000", "image": null}, {"key": "D", "text": "8400", "image": null}], "answer": "C", "explanation": "设厂家降价x 次，则可获利润（70-2x）×（120+8x）= -16x 2 +320x+8400 元，当x=-）（16-2320=10 时，取得最大值10000 元。 17 内部资免费交流", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "shuliang-116", "module": "shuliang", "no": 116, "subType": "数学运算", "stem": "一名顾客购买两件均低于 100 元的商品，售货员在收款时错将其中一件商品标\n价的个位数和十位数弄反了，该顾客因此少付了 27 元。被弄错价格的这件商品的标价\n不可能是（）元。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "42", "image": null}, {"key": "B", "text": "63", "image": null}, {"key": "C", "text": "85", "image": null}, {"key": "D", "text": "96", "image": null}], "answer": "A", "explanation": "根据题意，商品标价的个位数和十位数弄反了，少付27元，则价格的两个数字不可能同奇或同偶。只有A 项同偶，此题应选A。或此数应满足十位数字比个位数字大3，只有A 项不满足。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "shuliang-117", "module": "shuliang", "no": 117, "subType": "数学运算", "stem": "某单位购买了 10 台新电脑，计划分配给甲、乙、丙 3 个部门使用。已知每个\n部门都需要新电脑，且每个部门最多得到 5 台，那么电脑分配方法共有（）种。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "9", "image": null}, {"key": "B", "text": "12", "image": null}, {"key": "C", "text": "18", "image": null}, {"key": "D", "text": "27", "image": null}], "answer": "C", "explanation": "根据题意可分为以下两种情况进行讨论： （1）有一个部门分得5 台电脑，此时各部门分得的电脑数有5、3、2 和5、4、1两类，此时共有13C ×22A ×2=3×2×2=12 种分配方法； （2）没有部门分得5 台电脑，此时各部门分得的电脑数有4、4、2 和4、3、3 两类，此时共有13C +13C =3+3=6 种分配方法则电脑分配方法共有12+6=18 种，故答案为C。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "shuliang-118", "module": "shuliang", "no": 118, "subType": "数学运算", "stem": "甲乙二人在环湖小路上匀速步行，且绕行方向不变。 19 时，甲从 A 点、乙从 B\n点同时出发相向而行。 19 时 25 分，两人相遇； 19 时 45 分，甲到达 B 点； 20 时 5 分，\n两人再次相遇。乙环湖一周需要（）分钟。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "72", "image": null}, {"key": "B", "text": "81", "image": null}, {"key": "C", "text": "90", "image": null}, {"key": "D", "text": "100", "image": null}], "answer": "C", "explanation": "两人第一次相遇用时25 分钟（19:00-19:25），甲自己从A到B 花费了45 分钟（19:00-19:45）。因此甲、乙速度和与甲的速度之比为所用时间的反比45∶25。化简后速度比为9∶5，设甲为5 份，则乙为4 份。从19 时25 分到20时5分经过40分钟二人共走了一个周长的路程，因此速度为9份时走完一周要40分钟，乙速度为4 份，走完一周用时90 分钟。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "shuliang-119", "module": "shuliang", "no": 119, "subType": "数学运算", "stem": "一批零件，如果全部交由甲厂加工，正好在计划的时间完成；如果全部交由乙\n厂加工，要超过计划时间 5 天才能完成。如果先由甲乙两厂合作加工 3 天，剩余的再由\n乙厂单独加工，正好也是在计划的时间完成。则加工完这批零件计划的时间是（）\n天。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "5", "image": null}, {"key": "B", "text": "7", "image": null}, {"key": "C", "text": "7.5", "image": null}, {"key": "D", "text": "8.5", "image": null}], "answer": "C", "explanation": "方法一，设计划完成时间为x 天，根据题意可列方程x3 +5xx=1，得到计划时间x=7.5方法二，根据题意，甲3 天完成的量等于乙5 天完成的量，则设甲的效率为5，乙的效率为3，所求计划的时间为3×5÷（5-3）=7.5 天。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "shuliang-120", "module": "shuliang", "no": 120, "subType": "数学运算", "stem": "某单位举办趣味体育比赛，共组织了甲、乙、丙、丁 4 个队。比赛共 5 项，每\n项第一名得 3 分，第二名得 2 分，第三名得 1 分，第四名不得分。已知甲队获得了 3\n次第一名，乙队获得 3 次第二名，那么得分最少的队的分数不可能超过（）分。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "5", "image": null}, {"key": "B", "text": "6", "image": null}, {"key": "C", "text": "7", "image": null}, {"key": "D", "text": "8", "image": null}], "answer": "C", "explanation": "比赛总分为（3+2+1）×5=30 分，要让得分最少的队尽可能高，需要让各队得分尽量平均。4 队平均分为30÷4=7.5 分，甲至少得了3×3=9 分超过平均分，因此第一名至少得9 分，其他各队都得7 分时得分最少的队分数最高如下表所示，这种情况真实存在。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "panduan-001", "module": "panduan", "no": 1, "subType": "逻辑判断", "stem": "某公司有四个部门：股票投资部“S”、债券投资部“B”、衍生品投资部“D”、\n量化投资部“Q”，由甲、乙、丙、丁四位总经理审核，每天审核一个部门。\n已知：\n① S 的审核在 B 之前；\n②甲审核 D；\n③乙的审核在丙之后；\n④丁审核的部门在第二天；\n⑤ Q 不是最后一个被审核。\n根据以上条件，以下哪项不可能为真？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "乙总经理的审核排在丁总经理之前", "image": null}, {"key": "B", "text": "甲总经理负责第一天的审核", "image": null}, {"key": "C", "text": "丙总经理审核量化投资部“Q”", "image": null}, {"key": "D", "text": "债券投资部“B”在第三天被审核", "image": null}], "answer": "A", "explanation": "A 项若乙在丁之前，结合“乙的审核在丙之后”，则排序为丙-乙-丁，那么无论怎么排序都和“丁审核的部门在第二天”相违背，不可能为真； B 项甲负责第一天审核，且审核D，则丁第二天，丙第三天，乙第四天；且“Q 不是最后一个被审核”则乙不审核Q，则乙审核B。则丁或丙审核S，剩下一个审核D。满足题干要求； C 项丙总经理审核量化投资部“Q”，“Q 不是最后一个被审核”，则丙审核Q 在第一天、第三天；第二天为丁，又“S 的审核在B 之前”，则B 在第三天或者第四天被审核；又乙的审核在丙之后，则乙在第四天审核，则只能审核B，则有以下两种情况第一种衍生品投资部“D债券投资部“B量化投资部“Q股票投资部“S第二种衍生品投资部“D债券投资部“B量化投资部“Q股票投资部“S” D 项债券投资部“B”在第三天被审核，则S 在第一天或者第二天，Q 不是最后一个被审核，则若S 在第一天，则Q 在第二天，B 在第三天，D 在最后一天，此时甲审核D；丁审核Q；丙审核B；乙审核D，矛盾，此情况排除则若S 在第二天，立即丁审核，B 在第三天，则Q 在第一天；D 在最后一天被甲审核；则丙审核B；乙审核Q，满足情况故本题选A。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "panduan-002", "module": "panduan", "no": 2, "subType": "逻辑判断", "stem": "某单位规定：如果员工年度考核优秀，则可获得海外培训机会，或者获得额外奖\n金。小王既没有获得海外培训机会，也没有获得额外奖金。\n根据以上陈述，可以推出（）。", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "小王年度考核不优秀", "image": null}, {"key": "B", "text": "小王年度考核优秀", "image": null}, {"key": "C", "text": "小王应该获得额外奖金", "image": null}, {"key": "D", "text": "小王应该获得海外培训机会", "image": null}], "answer": "A", "explanation": "员工年度考核优秀则获得海外培训机会，或奖金。小王没有获得海外培训机会且没有获得额外奖金，则考核不优秀。故本题选A。 2 内部资免费交流", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "panduan-003", "module": "panduan", "no": 3, "subType": "逻辑判断", "stem": "王铭、李盈、杜葭三人大学毕业后，一个当上了公务员，一个当上了空姐，另一\n个当上了司机。他们各自作了如下陈述：\n王铭：王铭当上了公务员，李盈当上了空姐；\n李盈：王铭当上了空姐，杜葭当上了公务员；\n杜葭：王铭当上了司机，李盈当上了公务员。\n结果证实，王铭、李盈、杜葭的陈述都只对了一半。由此可见：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "王铭当上了空姐", "image": null}, {"key": "B", "text": "李盈当上了公务员", "image": null}, {"key": "C", "text": "杜葭当上了空姐", "image": null}, {"key": "D", "text": "王铭当上了司机", "image": null}], "answer": "D", "explanation": "分析推理题。王铭和杜葭的话都涉及了王铭和李盈两人，由每人的陈述都只对一半可知，两人针对王铭和李盈的陈述必各有一半为真，则李盈所说的王铭当上了空姐为假，进而推出杜葭当上了公务员为真。则杜葭的后半句为假，前半句为真，王铭当上了司机。王铭的前半句为假，后半句为真，李盈当上了空姐。故答案选D。此题也可用代入法或假设法解题。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "panduan-004", "module": "panduan", "no": 4, "subType": "逻辑判断", "stem": "某研究表明，如果中子星的质量超过 32 倍太阳的质量，中子就无法与自身引力\n相抗衡，从而发生中子塌陷。\n下列观点能有力支持以上推断的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "宇宙中存在质量比中子星大无数倍的黑洞", "image": null}, {"key": "B", "text": "宇宙中存在着许多密度是中子星密度 32 倍以上的神秘星体", "image": null}, {"key": "C", "text": "自然界中没有任何物质能支撑 32 倍以上太阳质量的物质引起的引力塌陷", "image": null}, {"key": "D", "text": "塌陷是大质量中子星使内部达到新的平衡的途径之一", "image": null}], "answer": "C", "explanation": "加强型题目。C 项如果为假则题干中的中子星可能不会发生塌陷，是题干成立的前提，最好的支持了题干结论。A 项为无关项；B 项削弱了题干结论；D 项塌陷只是达到平衡的途径之一，并不代表一定会发生中子塌陷，加强力度不如C 项。故答案选C。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "panduan-005", "module": "panduan", "no": 5, "subType": "逻辑判断", "stem": "私营部门试图通过提供高薪来吸引有技能的研究科学家。结果，大多数受雇于私\n营部门的研究科学家赚的钱比技能相仿的在政府部门工作的研究科学家多出 50。所\n以，除非政府雇佣的研究科学家更多地被对公众的职责感而不是被他们的个人利益所驱\n使，否则政府就有可能使它最有技能的科学家流失到私营部门，因为这些科学家中没有\n人会在私营部门中找不到工作。\n上述论述依赖的假设是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "与私营部门相比，政府部门的研究科学家的科研贡献难以被承认", "image": null}, {"key": "B", "text": "目前，在政府部门工作的研究科学家中，没有人赚的钱比受雇于私营部门的研究 科学家多", "image": null}, {"key": "C", "text": "政府部门雇佣的技能卓越的研究科学家的人数没有私营部门中多", "image": null}, {"key": "D", "text": "政府不给它的研究科学家提供非常好的工作条件或由于低薪水所应获得补偿的 额外福利", "image": null}], "answer": "D", "explanation": "前提型题目。题干结论是“除非政府雇佣的研究科学家更多地被对公众的职责感而不是被他们的个人利益所驱使，否则政府就有可能使它最有技能的科学家流失到私营部门”，论据是受雇于私营部门的研究科学家赚的钱更多要使题干推论成立，必须确定除了薪水之外，政府对它雇佣的科学家没有提供更好的工作条件或额外的福利，D 项是必须假设的，否则研究科学家还可能因更好的工作条件或额外的福利而选择在政府部门工作，题干结论不成立。A、B、C 三项都不是必须假设的。故答案选D。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "panduan-006", "module": "panduan", "no": 6, "subType": "逻辑判断", "stem": "某个山村里住着盗贼和牧师两种人，盗贼只说假话，牧师只说真话。牧师又分为\n富有的牧师和贫穷的牧师。一天，一对夫妇来到该村庄，希望找到贫穷的牧师来为自己\n主持婚礼。路上遇到三位村民。问及其各自身份时，甲村民说：“我不是富有的牧师”。\n乙村民说：“我不是盗贼，甲是盗贼。”丙说：“请相信我，乙和甲其中一人说了假话。”\n请问关于三人的身份下列推论正确的是？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "甲是富有的牧师", "image": null}, {"key": "B", "text": "甲是盗贼", "image": null}, {"key": "C", "text": "乙是盗贼", "image": null}, {"key": "D", "text": "丙是贫穷的牧师", "image": null}], "answer": "C", "explanation": "假设甲是盗贼，则甲说了真话，与题干信息盗贼说假话不符，故甲不是盗贼，排除B。假设甲是富有的牧师，则甲说了假话，而富有的牧师说真话，则甲不是富有的牧师，排除A。假设甲是贫穷的牧师，则甲说了真话，符合题干信息。故甲是贫穷的牧师。甲是贫穷的牧师，那么乙说甲是盗贼则是一句假话，故乙说了假话，乙是盗贼。此时丙说了真话，但是无法确定丙是哪种牧师。故答案选C。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "panduan-007", "module": "panduan", "no": 7, "subType": "逻辑判断", "stem": "今年河南突降暴雨导致郑州及周边多地市受灾。某大学校学生会积极组织全校师\n生为灾区捐款捐物。某天，该学生会收到一笔 5 千元的捐款。经过了解是大四医学院四\n位同学李明、肖艳、张毅、杨硕中的一人捐赠的。经询问，四人给出如下答复，李明：\n“是杨硕捐赠的。”肖艳：“如果我捐赠了，杨硕也会捐赠。”张毅：“我不知道是谁，\n反正不是我。”杨硕：“肖艳确实捐赠了，但是我没有捐赠。”\n已知四人中只有一人说了假话，请问谁是捐赠者，谁是说假话的人？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "杨硕；肖艳", "image": null}, {"key": "B", "text": "李明；杨硕", "image": null}, {"key": "C", "text": "张毅；李明", "image": null}, {"key": "D", "text": "杨硕；杨硕", "image": null}], "answer": "D", "explanation": "本题考查假言命题矛盾关系。四人中，肖艳和杨硕的话互为矛盾关系，故两句话一真一假，已知四人中只有一人说假话，则唯一一句假话在肖艳和杨硕之间。而李明和张毅都说了真话。由李明说真话可知捐赠者是杨硕。而杨硕说自己没有捐，则说了假话。故答案选D。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "panduan-008", "module": "panduan", "no": 8, "subType": "逻辑判断", "stem": "班主任要求甲、乙、丙、丁四位同学背诵《习近平新时代中国特色社会主义思想\n学习纲要》中的“八个明确”和“十四个坚持”，之后班主任询问他们背诵情况时，他\n们发生如下对话：\n甲说：“我们中至少有一个人全都背下来了。”\n乙说：“我没背下来‘八个明确’。”\n丙说：“我们所有人都全背下来了。”\n丁说：“我们中有些人没有全背下来。”\n已知四个同学中只有一个同学说了真话。下列表述可以通过上文推出的是：\n①丁没有全背下来；\n②丙全都背了下来；\n③乙没有背下来“十四个坚持”；\n④多于一个人全都背了下来", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "②、④", "image": null}, {"key": "B", "text": "①、③", "image": null}, {"key": "C", "text": "①", "image": null}, {"key": "D", "text": "①、②和④", "image": null}], "answer": "B", "explanation": "题干中丙说的“我们所有人都背下来了”与丁说的“我们中有些人没有全背下来”为矛盾关系，两者永远一真一假。同时，丙说的“我们所有人都背下来了”与甲说的“我们中至少有一个人全都背下来了”为推出关系，如果丙说的话为真，则甲说的话必为真。题干指出四个人中只有一人说了真话，由此可以得出说真话 3 内部资免费交的一定是丁。所以甲、乙、丙说的都是假话，由此可得甲说的“我们中至少有一个人全都背下来了”为假，四人中一个全背下来的都没有，由此可得①丁没有全背下来为真；②丙全都背了下来为假；④多于一个人全都背了下来为假；由乙说的话为假可得：乙背下来了“八个明确”，由于没有一个人全都背下来，故乙一定没有背下来“十四个坚持”，所以③可以由题干推出。本题可以推出的为①、③，故本题选B。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "panduan-009", "module": "panduan", "no": 9, "subType": "逻辑判断", "stem": "甲、乙、丙、丁、戊共计 5 人计划出门旅行，并且都预定了海边的民宿，民宿的\n房号从左至右依次为 1-5 号。已知：\n（1）甲和丁预定的民宿不相邻；\n（2）如果丙预定 2 号民宿，那么丁预定 4 号民宿；\n（3）戊的预定的民宿房号比丙小；\n（4）甲、乙预定的民宿房号比丙大。\n据此，一定可以推出：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "戊预定 1 号民宿", "image": null}, {"key": "B", "text": "甲预定 4 号民宿", "image": null}, {"key": "C", "text": "丙预定 3 号民宿", "image": null}, {"key": "D", "text": "乙预定 5 号民宿", "image": null}], "answer": "C", "explanation": "首先整理题干条件如下：（1）甲丁不相邻；（2）丙2 号⇒丁4 号；（3）戊比丙小，但不清楚二者是否相邻；（4）丙比甲、乙小，但不清楚甲乙的先后位置、不清楚二者是否相邻。本题可以以第二个条件为突破口分情况讨论第一种情况，丙是2 号根据（2）可知，丁预定4 号民宿；根据（3）可知，戊预定1 号民宿；所以，甲和乙预定的民宿房号为3 号、5 号，可以互换。此时，无论怎样甲、丁预定的民宿都相邻，与条件（1）矛盾。故第一种情况不成立，可知丙不是2 号第二种情况，丙不是2 号据条件（3）（4）可知甲、乙、丙、戊预定的民宿相对顺序为戊<丙<甲、乙，由于丙不是2 号，则丁一定在丙前面，此时丙只能预定3 号民宿；甲和乙预定4 号和5号民宿，可以互换；戊和丁预定1 号和2 号民宿，可以互换故本题选C 项。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "panduan-010", "module": "panduan", "no": 10, "subType": "逻辑判断", "stem": "人工智能算法正在渗入人们生活的方方面面，不仅衣食住行，夹杂情感需求的\n恋爱、婚配问题也开始被引入算法寻求解决方案。有人认为，在寻找对象这件事情上，\n算法匹配之后的推荐也许是不错的选择。\n以下哪项如果为真，最能质疑上述结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "依赖算法会激发人的惰性，致使人的社交欲望和动力降低，最终被困在算法里", "image": null}, {"key": "B", "text": "人工智能算法会形成模型和套路，有时候算法的套路可以打破人类思维局限", "image": null}, {"key": "C", "text": "算法能接触到的信息依赖于使用者的给予，人们在给算法提供数据时一般会过度 美化自己", "image": null}, {"key": "D", "text": "人们关注的焦点应当是如何让人工智能算法更好地为人服务，避免人被算法操纵", "image": null}], "answer": "C", "explanation": "题干结论是：在寻找对象这件事情上，算法匹配之后的推荐也许是不错的选择。 A 项，指出依赖算法会导致人社交欲望降低，进而被困在算法里，说明依赖算法有弊端，但是没有说明算法是否能帮人找到合适的对象，不能质疑题干结论。 B 项，指出人工智能算法形成的套路能打破人类思维局限，但没有告诉我们是否能帮人找到合适的对象，不能质疑题干结论。 C 项，指出人们在使用算法时提供的数据会过度美化自己，那么在介绍对象时，算法提供的信息可能就不能全面真实的反映个人情况，质疑了算法推荐对象的可靠性，也就质疑了题干结论。 D 项，指出人们关注的焦点应该是如何让人工智能算法更好的为人服务，与题干讨论的人工智能算法能否帮人找到合适的对象不是一个话题，不能质疑题干结论故答案选C。 4 内部资免费交流", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "panduan-011", "module": "panduan", "no": 11, "subType": "定义判断", "stem": "所谓千滚水是指，在炉上沸腾了很长时间或者反复煮沸过的水，同理还有反复\n蒸煮馒头后剩下的“蒸锅水”等。近日，关于千滚水是否致癌的问题专家和群众莫衷一\n是。人们认为，水在经过反复煮沸后，水中不挥发的致癌物质——亚硝酸盐的含量会升\n高，所以经常饮用千滚水会有致癌的风险。\n以下哪项如果为真，最能驳斥群众想法的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "研究发现：水加热后随着水煮沸次数的增多，水中的亚硝酸根离子会逐渐转化为 硝酸根离子，硝酸盐不会对身体造成不良影响", "image": null}, {"key": "B", "text": "在日常生活中摄入亚硝酸盐的主要渠道还是食物，真正应该注意的是各种腌制食 物、肉类罐头和变质蔬菜等", "image": null}, {"key": "C", "text": "即使是反复烧开 20 次的水，其亚硝酸盐的含量仅约为 0.038 毫克 / 升，远低于国 家标准中要求的≤ 1 毫克 / 升的标准", "image": null}, {"key": "D", "text": "煲汤时锅中的水也会反复烧开，广东人经常食用“老火煲汤”，但是广东地区的 骨癌发病率并不比全国的发病率高", "image": null}], "answer": "A", "explanation": "题干中群众的想法是：水在经过反复煮沸后，水中不挥发的物质——亚硝酸盐的含量会升高，所以经常饮用千滚水会有致癌的风险。 A 项，说明千滚水中致癌物质亚硝酸盐会转化为硝酸盐，而硝酸盐不会对身体造成不良影响，也就不会产生致癌风险，切断论据和结论的联系，可以削弱，保留。 B 项，指出生活中摄入亚硝酸盐的主要渠道，但是无法说明千滚水中亚硝酸盐的情况、也无法说明是否致癌，为无关项，排除。 C 项，指出反复烧开20 次的水中亚硝酸盐的含量仍旧远远低于国家标准，说明了其安全性，可以削弱，保留。 D 项，以广东地区为例，试图通过经常食用“老火煲汤”、但是骨癌发病率不比全国高进行削弱，但是漏洞较大：因为汤中除了水之外还有其他物质，所以并不清楚当地骨癌发病率不比全国高是与哪些因素相关。所以无法进行削弱，排除对比A、C 两项，C 项论述的是反复烧开20 次的特例，并且没有说明亚硝酸盐与癌症之间的关系；而A 项切断了论据与结论之间的联系，更为本质、力度更强故本题选A。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "panduan-012", "module": "panduan", "no": 12, "subType": "逻辑判断", "stem": "某研究团队通过构建小鼠肥胖模型，探究了高脂饮食对致病菌定植和抗生素治\n疗的影响及其内在机制。研究发现，相较于正常饮食小鼠，高脂饮食小鼠细菌感染后对\n杀菌抗生素治疗的敏感性降低。研究人员认为，高脂饮食可能会削弱抗生素的体内有效\n性。\n以下哪项如果为真，最能支持题干结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "团队通过药代动力学分析表明，抗生素活性的差异并不受到药物体内代谢的影响", "image": null}, {"key": "B", "text": "高脂饮食导致的肥胖，通常伴随一系列炎症性疾病，如 2 型糖尿病，心血管疾病 等", "image": null}, {"key": "C", "text": "高脂饮食通过影响肠道菌群的组成进而改变特定代谢物丰度，最终削弱了抗生素 的体内有效性", "image": null}, {"key": "D", "text": "医生不适当或不必要的处方抗生素，病人滥用抗生素，是导致抗生素耐药性的主 要原因", "image": null}], "answer": "C", "explanation": "论据：相较于正常饮食小鼠，高脂饮食小鼠细菌感染后对杀菌抗生素治疗的敏感性降低。结论：高脂饮食可能会削弱抗生素的体内有效性。 A 选项，抗生素活性的差异并不受到药物体内代谢的影响，没有说清楚抗生素活性会不会受到高脂饮食的影响，不能支持； B 选项，高脂饮食导致的肥胖，通常伴随一系列炎症性疾病，没有说清楚，高脂饮食会不会削弱抗生素的体内有效性，不能支持； C 选项，解释因果，高脂饮食会通过影响肠道菌群的组成进而改变特定代谢物丰度，从而削弱了抗生素的体内有效性，支持了题干结论； D 选项，医生不适当或不必要的处方抗生素，病人滥用抗生素，是导致抗生素耐药性的主要原因，没有说清楚高脂饮食会不会导致抗生素的体内有效性降低，不能支持题干结论故本题选C。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "panduan-013", "module": "panduan", "no": 13, "subType": "逻辑判断", "stem": "手机应用软件更新一般有三个目的：一是根据用户在体验中的反馈来修复一部\n分漏洞，随着不断升级来提升 App 稳定性；二是在界面 UI 设计、功能操作、系统功能\n等方面对软件进行优化，让用户拥有更好的使用体验；三是增加对新设备的支持。很多\n手机 App 会发布新功能，如果不更新就不能使用这些功能。但手机软件更新也会有一\n定的风险，如果与系统不兼容，轻则闪退，重则手机“假死”。有时，还可能伴随耗电\n高、信号稍微下降等现象，这主要是跟手机的配置有关。\n据此，可以推出的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "要使用手机 App 的新功能就可能会有一定的风险", "image": null}, {"key": "B", "text": "用户可根据手机 App 更新日志确定是否需要升级", "image": null}, {"key": "C", "text": "更新手机应用软件是使用手机新功能的充分条件", "image": null}, {"key": "D", "text": "手机的配置情况不同，耗电量和信号强度就不同", "image": null}], "answer": "A", "explanation": "A 项，通过“如果不更新就不能使用这些功能。但手机软件更新也会有一定的风险”可知，A 项正确，保留。 B 项，题干并未涉及APP 更新日志，属于无中生有，排除。 5 内部资免费交流 C 项，通过“如果不更新就不能使用这些功能”可知，更新手机应用软件是使用新功能的必要条件，排除。 D 项，通过“手机软件更新也会有一定的风险，如果与系统不兼容，轻则闪退，重则手机‘假死’。有时，还可能伴随耗电高、信号稍微下降等现象，这主要是跟手机的配置有关”可知，因为手机配置情况不同，可能有的手机更新软件后会出现耗电高、信号稍微下降等现象，可能有的手机更新软件后不会出现此类情况，而未涉及不同手机的耗电量和信号强度的比较，D 项表述错误，排除故本题选A。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "panduan-014", "module": "panduan", "no": 14, "subType": "逻辑判断", "stem": "研究发现，每天喝 3 杯以上碳酸饮料的青少年比每天只喝一杯的同龄人出现睡\n眠障碍的几率要高出 55。据此，研究人员认为频繁摄入碳酸饮料使青少年更容易出\n现睡眠障碍问题。\n以下哪项如果为真，最能支持上述结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "频繁摄入碳酸饮料等快餐食品的问题在低收入国家以外的国家中都非常普遍", "image": null}, {"key": "B", "text": "睡眠质量差会影响青少年的思维能力和认知能力，更会使青少年免疫力低下", "image": null}, {"key": "C", "text": "碳酸饮料往往含有咖啡因，过于频繁地摄入这些食品，会导致睡眠障碍", "image": null}, {"key": "D", "text": "睡前喝咖啡等不良生活行为习惯，作息混乱的不良睡眠习惯都会导致睡眠障碍", "image": null}], "answer": "C", "explanation": "论据：每天喝3 杯以上碳酸饮料的青少年比每天只喝一杯的同龄人出现睡眠障碍的几率要高出55%。结论：频繁摄入碳酸饮料使青少年更容易出现睡眠障碍问题。 A 选项，频繁摄入碳酸饮料等快餐食品的问题在低收入国家以外的国家中都非常普遍，没有说明频繁摄入碳酸饮料会不会使青少年更容易出现睡眠障碍问题，不能支持，排除； B 选项，睡眠质量差会有不利影响，而题干讨论的是频繁摄入碳酸饮料是不是青少年更容易出现睡眠障碍问题的原因，选项没有说清楚，不能支持，排除； C 选项，解释说明，碳酸饮料中含有咖啡因会影响睡眠，因此频繁摄入碳酸饮料使青少年更容易出现睡眠障碍问题，支持了题干结论； D 选项，不良的生活行为习惯和不良的睡眠习惯会导致睡眠障碍，没有说清楚频繁摄入碳酸饮料会不会使青少年更容易出现睡眠障碍问题，不能支持，排除故本题答案选C。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "panduan-015", "module": "panduan", "no": 15, "subType": "逻辑判断", "stem": "相关实验表明，当噪声达到 90 分贝时，人的视觉细胞敏感性就会下降，识别弱\n光反应时间延长；噪声达到 95 分贝时，有 40的人瞳孔放大，视线模糊；而噪声达到\n115 分贝时，大多数人眼球对光亮度的适应都有不同程度减弱。所以，眼睛也怕“吵”。\n以下哪项如果为真，最能加强上述结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "长时间处于噪声环境中的人很容易发生眼疲劳、眼痛、眼花和视物流泪等眼损伤 现象", "image": null}, {"key": "B", "text": "一次性长时间在超分贝噪音环境中暴露过长时间，就会造成感应神经性耳聋", "image": null}, {"key": "C", "text": "眼睛和耳朵都和神经中枢相连，声音太大使神经受损，进而导致整体视觉功能下 降", "image": null}, {"key": "D", "text": "蛋白质、脂肪、无机盐、维生素、微量元素等营养物质的缺乏，可能影响视力发 育", "image": null}], "answer": "C", "explanation": "题干结论：眼睛也怕“吵”，即噪音会影响眼睛功能。 A 选项，补充论据，噪声下还容易发生一系列眼损伤现象，说明噪声会影响眼睛功能，加强了题干结论，保留； B 选项，超分贝噪音会影响听力，没有说明噪音对眼睛功能的影响，不能加强，排除； C 选项，解释说明，声音太大使神经受损，神经受损导致整体视觉功能下降，说明眼睛确实怕吵，噪音会影响眼睛功能，加强了题干结论； D 选项，营养物质的缺乏，可能影响视力发育，没有说明噪声对眼睛的影响，不能加强，排除。 6 内部资免费交比较A、C 两项，C 选项解释了噪音和眼睛功能损伤之间的因果联系，加强力度更强，故本题答案选C。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "panduan-016", "module": "panduan", "no": 16, "subType": "逻辑判断", "stem": "为了解国产电影在大学生中的受欢迎程度，某高校进行了一项线上问卷调查。\n对回收的 500 份调查问卷进行了统计，结果显示有 80的大学生表示很喜欢国产电影。\n因此可以认为国产电影在大学生中有较好的口碑。\n以下哪项如果为真，最能质疑上述结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "问卷显示大学生除了喜欢国产电影外对欧美电影评价也很高", "image": null}, {"key": "B", "text": "许多大学生出于对国产电影的兴趣主动填写了调查问卷", "image": null}, {"key": "C", "text": "本次问卷统计存在误差，实际喜欢国产电影人数可能未到 80%", "image": null}, {"key": "D", "text": "大学生们普遍认为高质量的国产电影能代表中国的文化自信", "image": null}], "answer": "B", "explanation": "题干通过线上调查大学生是否喜欢国产电影的统计来论证当下大学生对国产电影的欢迎程度，其漏洞在于线上调查的结果能否代表大学生群体观点。 A 项，指出参与问卷的大学生除国产电影外还喜欢欧美电影，并未质疑国产电影的受欢迎程度，排除。 B 项，指出参与调查的大学生本身就可能是更喜欢国产电影的，那么针对他们的调查结果就不能代表所有大学生的喜好，即调查结果不具备普遍代表性，可以质疑题干结论，保留。 C 项，指出该问卷调查存在误差，实际喜欢国产电影人数并未到80%，可以质疑题干结论，保留。 D 项，指出国产电影和中国文化自信的关系，为无关项，排除比较B、C 两个选项，C 选项若误差过小，仍有大部分学生喜欢国产电影，则质疑力度较弱，而B 选项更直接否定题干结论成立的可能性故本题选B。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "panduan-017", "module": "panduan", "no": 17, "subType": "逻辑判断", "stem": "柚子是人们喜爱的水果品种，而近年来，红心柚因为色泽漂亮，营养价值更高\n而很受市场欢迎。但是，有一些消费者买到的红心柚切开后，内里果肉颜色不均匀，表\n皮海绵体发红，但果肉有的还是白的。于是网友猜测，这些红心柚子是被无良商家用注\n射色素的方法染成的。\n以下哪项如果为真，最不能削弱上述论证？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "用打针注射色素，柚子表皮上会有细微的针孔，并且打针后两三个小时就会发黑， 很容易被人识破", "image": null}, {"key": "B", "text": "影响果肉颜色变化的因素有很多，生长过程中光照、气温以及柚子的品种都会对 果肉颜色产生影响", "image": null}, {"key": "C", "text": "当红心柚子的细胞液泡中含有大量的番茄红素但缺乏β - 胡萝卜素时，果肉会出 现颜色不均的情况", "image": null}, {"key": "D", "text": "种植过程中，红心柚苗株嫁接技术不过关或和白柚品种授粉等，会导致柚皮生长 的颜色不均", "image": null}], "answer": "D", "explanation": "题干的论证主线是：红心柚切开后，内里果肉颜色不均匀，表皮海绵体发红，但果肉有的还是白的→这种颜色不均的红心柚子是被无良商家用注射色素的方法染成的。 A 项，指出给柚子打针容易被发现，说明商家不太可能采取打针方式给柚子染色，注射色素染色的方法不具有可行性，可以削弱，排除。 B 项，指出柚子果肉颜色变化受到很多因素影响，给出他因，可以削弱，排除。 C 项，指出柚子之所以会颜色不均是由于所含物质不同所导致的，可以削弱，排除。 D 项，论述的是柚皮生长颜色不均，与红心柚果肉颜色不均话题不一致，无关项，保留故本题选D。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "panduan-018", "module": "panduan", "no": 18, "subType": "逻辑判断", "stem": "从 14 世纪中叶到 18 世纪初，黑死病在欧洲间歇性多次暴发。现代医学揪出了\n鼠疫杆菌，破解了黑死病的传播途径：通过老鼠和跳蚤传播。与黑死病纠缠的漫长过程\n中，人们摸索出一些有效的防疫措施。威尼斯在 1374 年成为第一个禁止来自疫区的旅\n行者和商人进入的城市，很快其他意大利城邦也开始效仿，黑死病悄然消失了。有人据\n此认为，隔离是对抗黑死病的有效手段。\n以下哪项如果为真，最能削弱上述结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "人们尝试过各种各样的治疗方法，都没能彻底战胜黑死病", "image": null}, {"key": "B", "text": "除了隔离，人们还使用熏香和甘菊熏烤家中和公共场所对抗黑死病", "image": null}, {"key": "C", "text": "隔离期间人们更加注重卫生，卫生条件的改善减少了与老鼠、跳蚤的接触", "image": null}, {"key": "D", "text": "18 世纪中期木材短缺，出现了砖石结构的房子，改变了老鼠的寄居环境", "image": null}], "answer": "C", "explanation": "题干的论证主线是：黑死病通过老鼠和跳蚤传播+威尼斯及其他意大利城邦采取隔离的措施，黑死病悄然消失了→隔离是对抗黑死病的有效手段。 A 项，各种各样的方法都没治好黑死病，跟隔离是否是有效手段无关，排除。 7 内部资免费交流 B 项，人们使用熏香和甘菊对抗黑死病，是否有效并不知晓，不能削弱，排除。 C 项，隔离期间注重卫生，减少了与老鼠、跳蚤的接触，切断了黑死病传播途径，证明不是隔离起到了作用、而是注重卫生起的作用，可以削弱，保留。 D 项，试图通过改变老鼠的居住环境对结论进行削弱，但是不清楚改变老鼠的寄居环境后是否能够减少老鼠与人的接触、是否能够起到对抗黑死病的作用，排除。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "panduan-019", "module": "panduan", "no": 19, "subType": "定义判断", "stem": "晕车是指在乘坐车、船时，人体内耳前庭平衡感受器受到过度运动刺激，使交\n感神经兴奋性增强导致的神经功能紊乱，引起眩晕、呕吐等症状。有趣的是，晕车的人\n自己开车时却不晕车。\n以下哪项最能解释上述现象：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "晕车的人在开车的时候给了自己足够的不晕车的心理暗示", "image": null}, {"key": "B", "text": "开车时精力需高度集中，会使大脑皮层高级中枢高度兴奋", "image": null}, {"key": "C", "text": "开车时大脑可以提前预判位移，缓冲前庭系统受到的刺激", "image": null}, {"key": "D", "text": "随着开车频次的增加，晕车的人会因为习惯了而不再晕车", "image": null}], "answer": "C", "explanation": "题干的矛盾：晕车的人自己开车时不晕车。 A 项，心理暗示是否能发挥作用未知，不能解释，排除。 B 项，开车时精力集中，让大脑皮层高级中枢神经兴奋，但大脑皮层中枢神经高度兴奋和晕车之间关系不确定，不能解释，排除。 C 项，开车时大脑提前预判位移，可以缓冲前庭系统受到的刺激，从而减轻神经功能紊乱产生的晕车症状，可以解释，保留。 D 项，说明随开车频次增多，习惯了便不再晕车，它表述的情况是习惯以后，无论坐车还是开车都不会晕，无法解释坐车晕开车却不晕的情况，排除故本题选C。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "panduan-020", "module": "panduan", "no": 20, "subType": "逻辑判断", "stem": "某国屡创新低的生育率加上日益严重的老龄化，使该国进入了“人口灾难”的\n死胡同。为鼓励生育，政府力推生育津贴、免费教育、职业保姆等措施。然而近期的人\n口调查显示，该国今年第三季度生育率降至 0.88，创下有记录以来的最低季度数值。\n以下哪个选项最能解释上述现象：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "新增人口少会导致劳动力的减少、消费的疲软、老龄化的加剧、社会福利支出的 加重等一系列问题", "image": null}, {"key": "B", "text": "该国“男主外、女主内”的思想根深蒂固，需要缓解的不是生孩子的环境，而是 年轻人的生存压力", "image": null}, {"key": "C", "text": "养育子女成本的不断增加使晚婚不婚趋势不断增强以及生育年龄不断推迟，进而 导致生育率下降", "image": null}, {"key": "D", "text": "生育率的持续走低使该国适婚适育年龄段人口减少，房价升高、就业不稳定也使 得人们无暇他顾", "image": null}], "answer": "D", "explanation": "题干的矛盾是：某国力推生育津贴、免费教育、职业保姆等措施，但生育率却创新低。 A 项，新增人口少会造成一系列问题旨在说明生育率低会产生不利影响，与题干矛盾无关，不能解释，排除。 B 项，指出需要出台的措施应该是缓解年轻人的生存压力，而现有的措施针对的则是缓解生孩子的环境，故并不能鼓励生育，所以生育率没有得到提高，但是不能解释为什么生育率会创新低，排除。 C 项，指出养育子女成本不断增加是生育率下降的根本原因，而政府力推的免费教育可以降低养育子女成本，所以使得题干更加矛盾，不能解释，排除。 D 项，房价升高、就业不稳定使得人们无暇他顾说明出台的措施不具有针对性，故该措施起不到鼓励生育的作用，而生育率的持续走低使得该国适婚适育年龄段人口减少可以解释为什么生育率创新低，可以合理的解释题干的矛盾，保留故本题选D。 8 内部资免费交流", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "panduan-021", "module": "panduan", "no": 21, "subType": "逻辑判断", "stem": "胶原蛋白是存在于哺乳动物体内纤维状的蛋白质，它位于结缔组织的细胞外空\n间。体内的肌腱、肌肉、骨骼和韧带都含有胶原蛋白，胶原蛋白还存在于牙齿，肠，角\n膜，血管和椎间盘的牙本质中。在这些区域中，成纤维细胞合成胶原蛋白，它的产生随\n着年龄的增长而下降。因此，它常以膳食补充剂的形式出现。胶原蛋白在烹饪时会转化\n为明胶，该明胶包含独特的氨基酸含量，包括谷氨酸，脯氨酸和甘氨酸。膳食补充剂含\n有水解胶原蛋白，可以增加头发的厚度、收紧皮肤的弹性。\n据此，可以推出：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "胶原蛋白中含有大量的氨基酸", "image": null}, {"key": "B", "text": "植物性食品中不含有胶原蛋白", "image": null}, {"key": "C", "text": "摄取胶原蛋白可以滋养头发和皮肤", "image": null}, {"key": "D", "text": "胶原蛋白的含量和人的年龄负相关", "image": null}], "answer": "B", "explanation": "A 项，由“胶原蛋白在烹饪时会转化为明胶，该明胶包含独特的氨基酸含量，包括谷氨酸，脯氨酸和甘氨酸”可知，题干指出胶原蛋白氨基酸种类多，而非含量多，偷换概念，排除。 B 项，由“胶原蛋白是存在于哺乳动物体内纤维状的蛋白质”可知，胶原蛋白只存在于动物中，正确，保留。 C 项，由“膳食补充剂含有水解胶原蛋白，可以增加头发的厚度、收紧皮肤的弹性”可知，题干说的是水解胶原蛋白，偷换概念，排除。 D 项，由“在这些区域中，成纤维细胞合成胶原蛋白，它的产生随着年龄的增长而下降”可知，胶原蛋白的产量和年龄增长呈负相关，而非含量，排除故本题选B。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "panduan-022", "module": "panduan", "no": 22, "subType": "逻辑判断", "stem": "如果预约上专家号，小军就去医院做检查。只要小军去医院，他一定去找杨医\n生。除非杨医生不上班，否则李医生不会接待小军。\n已知，李医生接待了小军，那么，下列说法正确的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "杨医生和李医生之间，小军只能选一个", "image": null}, {"key": "B", "text": "小军找过杨医生，但杨医生不在医院", "image": null}, {"key": "C", "text": "小军没有预约上专家号", "image": null}, {"key": "D", "text": "不能确定杨医生是不是上班", "image": null}], "answer": "B", "explanation": "考查假言命题的推理规则。根据题干所给条件可写成： ①连锁推理：预约专家号→小军去医院→找杨医生； ②李医生接待小军→杨医生不上班现已知李医生接待了小军，通过②可得到杨医生不上班，故D 错误。A 项可转换成“要么找李医生，要么找杨医生”与题干逻辑不符；B 项，由李医生接待了小军，可知小军去了医院，根据①可知，小军找过杨医生，该项正确；C 项，否定了①的前件，无法进行有效推理。故本题选B。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "panduan-023", "module": "panduan", "no": 23, "subType": "逻辑判断", "stem": "由于按揭贷款的利率下调，人们每月还贷压力减小，因此一家机构预测某地的\n商品房销售量会增长，但实际上，销售量并未出现明显增长。\n下列哪项如果为真，最能解释以上现象？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "当地一直存在人口外流的现象", "image": null}, {"key": "B", "text": "本地的商品房价格没有明显下降", "image": null}, {"key": "C", "text": "有的开发商取消了购房优惠政策", "image": null}, {"key": "D", "text": "因经济环境不好，当地人均收入下降", "image": null}], "answer": "D", "explanation": "题干的现象是：人们每月的还贷压力减小，房地产销售量并未出现明显增长。D 项指出经济环境不好当地的人均收入下降，即尽管还贷压力减小了，但人们的购房压力并没有减轻，所以房地产销售量没有上升，很好地解释了题干现象。A、B、C 三项均不能有效解释题干现象。故答案选D。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "panduan-024", "module": "panduan", "no": 24, "subType": "逻辑判断", "stem": "为了让居者有其屋，某市筹集资金推进保障房建设，明年该市保障房建设将迎\n来完工的高潮。目前，保障房申请资格如何限定引起市民普遍关注，有人认为，保障房\n是政府筹资建设的，因此只能让本市居民购买，对于非本市户籍的人口，不应具有保障\n房申请资格。\n以下最能够质疑这一观点的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "保障房建设的资金来源除了政府财政外，还有大量的商业资本", "image": null}, {"key": "B", "text": "该市非户籍常住人口为政府财政上缴了大量税费", "image": null}, {"key": "C", "text": "该市户籍人口的收入水平普遍高于非户籍人口", "image": null}, {"key": "D", "text": "该市的常住人口有一半以上均为非户籍人口", "image": null}], "answer": "B", "explanation": "题干由“保障房是政府筹资建设的”得出结论“保障房只能让本市居民购买，对于非本市户籍的人口，不应具有保障房申请资格”。A 项只是说资金还有大量的商业资本，但与非本市户籍人口无关；B 项说明非户籍常住人口为政府财政上缴了大量税费，即政府的筹资包括非户籍人口的税费，从而削弱了结论；C、D 两项与题干结论无关。故答案选B。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "panduan-025", "module": "panduan", "no": 25, "subType": "逻辑判断", "stem": "有句话这么说：下雨天，有雨伞的比没带雨伞的更容易淋湿；有拐杖的比没带\n拐杖的更容易绊倒。\n以下最能支持上述论点的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "雨伞既能在晴天的时候挡太阳，又能在下雨天遮雨", "image": null}, {"key": "B", "text": "拐杖能帮助有行走障碍的人行走", "image": null}, {"key": "C", "text": "下雨天，看很多人都没有带雨伞和拐杖", "image": null}, {"key": "D", "text": "下雨天，带雨伞的人常常不注意遮雨，带拐杖的人常常不注意路滑", "image": null}], "answer": "D", "explanation": "论点是下雨天，有雨伞的比没带雨伞的更容易淋湿，有拐杖的比没带拐杖的更容易绊倒。D 项解释说明了下雨天有雨伞的更容易淋湿和有拐杖的更容易绊倒的原因，加强了结论。A、B 和C 项都属于无关项。 9 内部资免费交流", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "panduan-026", "module": "panduan", "no": 26, "subType": "逻辑判断", "stem": "富安公司是一家制造电子产品的公司，其大部分都是在流水线的工人，并且这\n部分雇员都是拿着最低的工资，但最近，在员工的争取下，大幅提高了雇员的最低工资，\n但是该公司的利润不但没有下降，反而提高了。\n以下哪项如果为真，最有助于解释这一现象？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "人力成本只占富安公司经营的 30%", "image": null}, {"key": "B", "text": "富安公司投入利润的 5用于研发新技术", "image": null}, {"key": "C", "text": "最近，电子产品的原材料价格普遍上涨", "image": null}, {"key": "D", "text": "富安公司降低了其高薪雇员的工资", "image": null}], "answer": "D", "explanation": "题干要求解释的矛盾现象是，大幅提高了雇员的最低工资，但是公司利润反而提高了。即便人力成本所占比重为30%，最低工资提高了，还是会导致利润下降，A 项无法解释；B 项与题干论证无关；C 项原材料价格上涨，加之工人工资提高，最终会使企业利润下降，也无法解释；D 项虽然提高了最低工资，但是又降低了高薪雇员的工资，这样会使企业人力成本下降，提高利润，合理地解释了题干矛盾。故答案选D。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "panduan-027", "module": "panduan", "no": 27, "subType": "逻辑判断", "stem": "白炽灯功率越大，灯光越明亮。 100 瓦的白炽灯功率高于 15 瓦的白炽灯功率，\n因此， 100 瓦的白炽灯比 15 瓦的白炽灯明亮。\n下列与上述推理最为类似的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "一个人越喜欢看电视和看书，他的近视程度越厉害。老张的爱人比他爱看电视， 因此，老张的爱人近视程度比他的近视程度厉害", "image": null}, {"key": "B", "text": "一套房子的面积越大，它的总价越高。老张的房子比同一栋楼老李的房子面积大， 因此，老张的房子比老李的房子贵", "image": null}, {"key": "C", "text": "今年跳远冠军的成绩比前年跳远冠军的成绩好。张华是今年的跳远冠军，因此， 他今年的跳远成绩比他前年的好", "image": null}, {"key": "D", "text": "产品质量越高并且广告投入越多，产品需求就越大。甲公司投入的广告费比乙公 司的多，因此，对甲公司产品的需求量比对乙公司的需求量大", "image": null}], "answer": "B", "explanation": "评价型题目。题干的论证方式通过比较白炽灯的功率的大小来决定灯光的亮暗，即寻找这二者间成正比的关系。 A 项是看电视和看书的多少，与近视程度的比较，是三者间的关系；同理，D 项是产品质量和广告的多少，与产品需求的关系的比较，也是三者间的关系，均不符合题干的推理方式。C 项没有体现出两个概念间的正比关系，也不符合题干。故答案选B。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "panduan-028", "module": "panduan", "no": 28, "subType": "逻辑判断", "stem": "航天器经过大气层返回地球时，会与大气层摩擦导致温度急剧升高。为使航天\n器克服“热障”安全返回地球。国外某研究机构在回收微小卫星 EGG 上做了新的技术\n尝试。 EGG 在下降过程中张开由二氧化碳充气扩张而成的半球形隔热减速伞，之后其\n受到的大气阻力显著增加，开始缓慢进入大气层并顺利落向地球。\n上述技术尝试基于的前提是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "航天器表层材料需具备耐受超高温的性能", "image": null}, {"key": "B", "text": "研究航天器耐热材料的成本比减速伞成本要高", "image": null}, {"key": "C", "text": "航天器落入大气层时过热是下降过程的常见难题", "image": null}, {"key": "D", "text": "航天器以较慢速度进入地球可减少摩擦导致的发热", "image": null}], "answer": "D", "explanation": "题干中的技术尝试是为了使航天器克服“热障”安全返回地球，即通过让航天器缓慢进入大气层来解决航天器与大气层摩擦导致温度急剧升高的问题，因此D 项是其必需的前提，否则如果航天器以较慢的速度进入地球也无法减少摩擦导致的发热，题干中新的技术尝试就无法达到目的。A 项表层材料的性能、B 项材料的成本都为无关项；C 项也不是必需的前提。故本题选D。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "panduan-029", "module": "panduan", "no": 29, "subType": "逻辑判断", "stem": "在医院同一病房里住着 4 个病人： 1 号床、 2 号床、 3 号床和 4 号床，他们当中\n有一个人在打电话，一个人在吃水果，一个人去做检查，另一个人在睡觉。并且已知：\n① 1 号床病人没有打电话，也没有睡觉；\n② 2 号床病人没有去做检查，也没有打电话；\n③如果 1 号床病人没有去做检查，那么 4 号床病人没有打电话；\n④ 3 号病床病人没有睡觉，也没有打电话；\n⑤ 4 号床病人没有睡觉，也没有去做检查。\n下面关于四个病人说法正确的一项是 ?", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "1 号床病人正在睡觉", "image": null}, {"key": "B", "text": "2 号床病人在吃水果", "image": null}, {"key": "C", "text": "3 号床病人去做检查", "image": null}, {"key": "D", "text": "4 号床病人在打电话", "image": null}], "answer": "D", "explanation": "根据①②④可知，1 号床病人、2 号床病人、3 号床病人都没有打电话，则打电话的是4 号床病人。根据③以及“打电话的是4 号床病人”可知，1 号床病人去做了检查。根据④可知，2 号床病人在睡觉，3 号床病人在吃水果。故本题选D。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "panduan-030", "module": "panduan", "no": 30, "subType": "逻辑判断", "stem": "一项针对某地的调查发现，目前具备企业年金投资管理资格的公司，均启动了\n职业年金投资运作，所有进入了职业年金投资运作阶段的公司都启动了管理人招标工\n作，大部分大中型企业都启动了职业年金投资运作，但没有小微企业具备企业年金投资\n管理资格。\n由此可推出该地：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "有些小微企业未启动管理人招标工作", "image": null}, {"key": "B", "text": "没有大中型企业具备企业年金投资管理资格", "image": null}, {"key": "C", "text": "没有小微企业已进入职业年金投资运作阶段", "image": null}, {"key": "D", "text": "有些大中型企业启动了管理人招标工作", "image": null}], "answer": "D", "explanation": "根据题干信息可画图如下（其中“小微企业”与“启动了职业年金投资运作”、“启动了管理人招标工作”关系不确定，图中用虚线表示）资格运作招标大中小微 10 内部资免费交由图可知，小微企业与管理人招标工作关系不确定，可能所有小微企业都启动了管理人招标工作，A 推不出；可能有大中型企业具备企业年金投资管理资格，B 推不出；小微企业与职业年金投资运作阶段关系不确定，可能有小微企业已进入职业年金投资运作阶段，C 推不出；启动了职业年金投资运作的那部分大中型企业一定启动了管理人招标工作，D 项可以推出。故选D。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "panduan-031", "module": "panduan", "no": 31, "subType": "逻辑判断", "stem": "珍妮、丽萨、洛斯、智秀四人参加一项偶像选秀，获得了比赛的前四名。据了\n解，他们之间有以下关系：\n①洛斯和智秀经常相约一起去美容院；\n②第一名和第三名在这次比赛中刚认识；\n③第二名不会坐地铁，也不去美容院；\n④珍妮的名次比丽萨的名次靠前；\n⑤丽萨和智秀每天一起坐地铁上班。\n根据以上条件，此次比赛的一、二、三、四名次的获得者是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "洛斯、珍妮、丽萨、智秀", "image": null}, {"key": "B", "text": "智秀、珍妮、洛斯、丽萨", "image": null}, {"key": "C", "text": "智秀、洛斯、珍妮、丽萨", "image": null}, {"key": "D", "text": "洛斯、智秀、珍妮、丽萨", "image": null}], "answer": "A", "explanation": "根据①③⑤可知，第二名不坐地铁、也不去美容院，则智秀、洛斯、丽萨不可能是第二名，因此第二名只能是珍妮，排除C、D 两项。根据②可知，第一名或第三名在比赛前不认识，结合①洛斯和智秀经常相约一起去美容院可以排除B选项。故本题选A。", "material": null, "srcPage": 11, "imgN": 0, "f": []}, {"id": "panduan-032", "module": "panduan", "no": 32, "subType": "逻辑判断", "stem": "小王，小杜，小李毕业之后分别在重庆、郑州和太原工作，三人的职业分别是\n老师、医生和编辑。已知小王不在重庆工作，小杜不在郑州工作；在重庆工作的不是编\n辑；在郑州工作的是老师；小杜不是医生。\n那么，小王、小杜、小李的工作地点分别是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "郑州、太原、重庆", "image": null}, {"key": "B", "text": "郑州、重庆、太原", "image": null}, {"key": "C", "text": "重庆、太原、郑州", "image": null}, {"key": "D", "text": "太原、重庆、郑州", "image": null}], "answer": "A", "explanation": "已知在郑州工作的是老师，在重庆工作的不是编辑，那么在重庆工作的只能是医生，又由小杜不是医生可知小杜不在重庆工作，而小王不在重庆工作，所以在重庆工作的只能是小李，故选择A 项。", "material": null, "srcPage": 11, "imgN": 0, "f": []}, {"id": "panduan-033", "module": "panduan", "no": 33, "subType": "逻辑判断", "stem": "公司国际部新招了甲乙丙丁戊五位外国籍员工，他们分别来自不同的国家。公\n司有人向人事部的小孙询问他们五人的国籍，小孙说：“如果甲是美国人，那么乙不是\n欧洲人；丙和甲当中至少有一个是美国人；如果乙不是欧洲人，那么丁就不是法国人；\n或者丁是法国人，或者戊不是英国人。”\n如果戊是英国人，可以得到：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "乙不是欧洲人", "image": null}, {"key": "B", "text": "丙是美国人", "image": null}, {"key": "C", "text": "甲是美国人", "image": null}, {"key": "D", "text": "丁不是法国人", "image": null}], "answer": "B", "explanation": "题干中的信息可整理为：①甲美⇒乙非欧；②丙美或甲美；③乙非欧⇒丁非法；④丁法或戊非英；⑤戊英。由④⑤可得，丁是法国人，排除D 项；再由③可得，乙是欧洲人，排除A 项；再由①可得，甲不是美国人，排除C 项；再由②可得丙是美国人，B 项正确。故本题选B。", "material": null, "srcPage": 11, "imgN": 0, "f": []}, {"id": "panduan-034", "module": "panduan", "no": 34, "subType": "逻辑判断", "stem": "受特殊情况影响，某市 47 个高速路口目前只能开放 9 个。交警部门连夜调配人\n员前往 9 个高速路口执勤，以保证通行安全顺畅，同时派出多个巡查组进行巡查。巡查\n将按照以下计划进行：\n（1）如果去了 1 号口，则必须去 2 号口，而 1 号口与 9 号口相距较远，如果去了\n1 号口，则不用再去 9 号口；\n（2）只有不去 6 号口，才必须去 2 号口或 9 号口；\n（3） 5 号口和 6 号口至少要去一个。\n如果某巡查组去了 6 号口，则他们可能还需要去：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "1 号口和 4 号口", "image": null}, {"key": "B", "text": "2 号口和 5 号口", "image": null}, {"key": "C", "text": "5 号口和 8 号口", "image": null}, {"key": "D", "text": "3 号口和 9 号口", "image": null}], "answer": "C", "explanation": "题干信息可整理为：①去1 号口⇒去2 号口且不去9 号口；②去2 号口或9 号口⇒不去6 号口；③去5 号口或者去6 号口若某巡查组去了6 号口，根据②可知，他们不去2 号口和9 号口，排除B 和D；再根据①，他们不去1 号口，可排除A；C 项正确。故本题选C。", "material": null, "srcPage": 12, "imgN": 0, "f": []}, {"id": "panduan-035", "module": "panduan", "no": 35, "subType": "逻辑判断", "stem": "最近，科学家们的一项研究或许给了家长充分的理由没收孩子们的手机。研究\n发现，当前 8-18 岁的孩子每天花在智能手机、平板电脑、视频游戏和其他屏幕娱乐设\n备上的时间普遍超过了 7 小时。与此同时， 8-18 岁的孩子面临的高血压、心脏病等健\n康问题日益加重。因此，科学家们认为，长时间使用屏幕娱乐设备，正是多种疾病在青\n少年群体中发生率升高的原因。\n以下哪项为真，最能质疑科学家的结论：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "许多从事视频游戏开发的人，并没有出现过高血压、心脏病等健康问题", "image": null}, {"key": "B", "text": "高油、高糖、高热量等不健康的饮食习惯在当代青少年中越来越常见", "image": null}, {"key": "C", "text": "患有高血压、心脏病等疾病后，长时间观看屏幕电子设备会加重病情", "image": null}, {"key": "D", "text": "如果每天多进行一个小时的体育锻炼，孩子们的健康状况就能有所改善", "image": null}], "answer": "B", "explanation": "题干论证主线是：当前8-18 岁的孩子每天花在智能手机、平板电脑、视频游戏和其他屏幕娱乐设备上的时间普遍超过了7 小时，与此同时，8-18岁的孩子面临的肥胖、高血压、心脏病等健康问题日益加重→长时间使用屏幕电子设备，正是造成多种疾病在青少年群体中发生率升高的原因。 A 项，题干论证主要讨论的是青少年的情况，与从事视频游戏开发的人没有关系，该项不能质疑科学家的结论。 B 项，说明当代青少年存在不健康的饮食习惯，一定程度上降低了长时间使用屏幕娱乐设备是青少年群体多种疾病发生率升高的原因的可能性，削弱了科学家的结论。 11 内部资免费交流 C 项，患有高血压、心脏病等疾病后，长时间观看屏幕电子设备会加重病情，但题干论证的是长时间观看屏幕电子设备是不是造成青少年患多种疾病的原因，C 为无关项。 D 项，说明体育锻炼对改善孩子们的健康状况有帮助，但是并未说明造成孩子们健康状况恶化的原因是什么，不能质疑科学家的结论。故答案选B。", "material": null, "srcPage": 12, "imgN": 0, "f": []}, {"id": "panduan-036", "module": "panduan", "no": 36, "subType": "逻辑判断", "stem": "最近，“洗血”被炒得火热，如果你去网上搜索，会发现十万多条与“洗血”\n美容相关的内容，各种网红 APP 也不乏对它的各种推荐，以至于不少人成为这项“医\n美技术”的拥护者。“洗血”即从身体中抽取一定量的血液，向血液中注入臭氧，血液\n颜色变得鲜红，再输回体内。商家称，这种方法可净化血液，起到美容养颜的效果。\n以下哪项如果为真，最能质疑商家的结论 ?", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "有“洗血”体验者表示，眼见自己的血液从暗红色变为鲜红色，输回身体之后， 感觉血液流动速度变快，整个人容光焕发", "image": null}, {"key": "B", "text": "“洗血”美容疗法有着严格的要求和规范，对其开展的环境、整体科室的配置、 从业人员的资质都有要求", "image": null}, {"key": "C", "text": "“洗血”美容疗法类似于“臭氧大自血疗法”，又称“三氧自血免疫疗法”（简 称“三氧疗法”），机制上类似于血液净化", "image": null}, {"key": "D", "text": "血液颜色变化，只是人体中动脉血和静脉血互相循环的一个正常变化，并不会对 人体产生任何有益或有害的影响", "image": null}], "answer": "D", "explanation": "此题考查可能性推理削弱型。题干中商家结论是“‘洗血’可净化血液，起到美容养颜的效果”。A 项通过举例说明在接受“洗血”后整个人容光焕发，支持了题干结论。B 项说明“洗血”疗法要求较高，无法削弱“洗血”的作用。C 项是对“洗血”的名称与机制的介绍，不能削弱。D 项血液颜色变化，不会对人体产生任何影响，说明“洗血”疗法根本没用，更谈不上美容养颜的效果，削弱了题干结论。故选D。", "material": null, "srcPage": 12, "imgN": 0, "f": []}, {"id": "panduan-037", "module": "panduan", "no": 37, "subType": "逻辑判断", "stem": "地理老师画了亚洲、欧洲、美洲、非洲和大洋洲的图形，并给每个图形编了代\n号，然后请五个同学上来每人认出两个洲。同学们的回答都不一样，甲： 3 是欧洲， 2\n是美洲；乙： 4 是亚洲， 2 是大洋洲；丙： 1 是亚洲， 5 是非洲；丁： 4 是非洲， 3 是大\n洋洲；戊： 2 是欧洲， 5 是美洲。地理老师说：“你们每人对了一半。”\n根据上述条件，下列判断中正确的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "1 是亚洲， 2 是欧洲", "image": null}, {"key": "B", "text": "2 是大洋洲， 3 是非洲", "image": null}, {"key": "C", "text": "3 是欧洲， 4 是非洲", "image": null}, {"key": "D", "text": "4 是美洲， 5 是非洲", "image": null}], "answer": "C", "explanation": "分析推理类题目。注意甲和戊的话都是对欧洲和美洲的判断，且戊的前半句话与甲的两个判断都矛盾，根据“每人对了一半”可知，戊的前半句话一定为假，后半句话为真，5 是美洲；甲的后半句话为假，前半句话为真，3 是欧洲；丁的后半句话为假，前半句话为真，4 是非洲；丙的后半句话为假，前半句话为真，则1是亚洲；乙的前半句话为假，后半句话为真，2 是大洋洲。故答案选C。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "panduan-038", "module": "panduan", "no": 38, "subType": "逻辑判断", "stem": "核聚变的主要原料之一氘在自然界中的分布极广，在海水中，每 6700 个氢原子\n中就有一个氘原子。因此，可以认为，核聚变的能源事实上是取之不尽的。\n若上述结论成立，下列哪些项必须为真？\n（1）海水中存在着数量巨大的氢原子\n（2）现有科技水平能成功分离氢原子与氘原子\n（3）反应之后的氘原子存在于水分子中", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "（1）（2）", "image": null}, {"key": "B", "text": "（1）（3）", "image": null}, {"key": "C", "text": "（2）（3）", "image": null}, {"key": "D", "text": "（1）（2）（3）", "image": null}], "answer": "A", "explanation": "前提型题目。题干中由“每6700 个氢原子中就有一个氘原子”推出结论“核聚变的能源事实上是取之不尽的”要使推论成立，必须要有大量氢原子，并且能分离出氢原子和氘原子，即（1）和（2）都是必须假设的，必须为真。（3）与题干推理无关。故答案选A。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "panduan-039", "module": "panduan", "no": 39, "subType": "逻辑判断", "stem": "某公司规定，只有在本公司连续工作 20 年以上或者具有突出业绩的职工，才能\n享受公司发放的特殊津贴。小张虽然只在该公司工作了 3 年，但现在却享受公司发放的\n特殊津贴，因此他一定是作出了突出业绩。\n下列选项的推理方式与上述题干最为类似的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "要想取得好成绩，既要勤奋学习，又要方法得当。汪洋虽然勤奋，但成绩不太好， 看来他的学习方法不当", "image": null}, {"key": "B", "text": "一个罪犯要实施犯罪，必须既有作案动机，又有作案时间。在某案中 A 嫌疑人 有作案动机，但却无作案时间，因此， A 嫌疑人不是该案的作案者", "image": null}, {"key": "C", "text": "如果既经营无方又铺张浪费，那么一个企业必将严重亏损。大鹏公司虽经营无方， 但并没出现严重亏损，这说明它至少没有铺张浪费", "image": null}, {"key": "D", "text": "法制的健全或者执政者强有力的社会控制能力是维持一个国家社会稳定必不可 少的条件。某国社会稳定，但法制尚不健全，因此，其执政者一定具有强有力的社会控 制能力", "image": null}], "answer": "D", "explanation": "评价型题目。本题题干是一个必要条件假言命题的有效推理形式，肯定后件就能肯定前件，其中前件是一个相容的选言命题，否定其中一个选言肢就能肯定另一个选言肢，选项中只有D 项也是类似的推理形式。A、B、C 三项都不含选言命题。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "panduan-040", "module": "panduan", "no": 40, "subType": "逻辑判断", "stem": "甲、乙、丙、丁、戊五个学生参加高考，他们成绩之间有关系是：丙没有乙高，\n戊没有丁高，甲高于乙，而丁不如丙高，则成绩最高的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "甲", "image": null}, {"key": "B", "text": "乙", "image": null}, {"key": "C", "text": "丙", "image": null}, {"key": "D", "text": "丁", "image": null}], "answer": "A", "explanation": "分析推理题，采用排序法。由题干可列出五名学生的成绩高低关系式：丙＜乙；戊＜丁；甲＞乙；丁＜丙。进而可以列出连锁关系式：甲＞乙＞丙＞丁＞戊。所以选A。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "panduan-041", "module": "panduan", "no": 41, "subType": "逻辑判断", "stem": "刘平学习对外汉语专业，王娜学习汉语专业，学习对外汉语专业的都学习过汉\n语专业的课程，学习汉语专业的都学习过古汉语，国内综合大学都设有汉语专业。\n由此我们知道：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "刘平可能没有学习过古汉语", "image": null}, {"key": "B", "text": "王娜学习过对外汉语专业", "image": null}, {"key": "C", "text": "刘平不在综合性大学", "image": null}, {"key": "D", "text": "王娜可能在综合性大学", "image": null}], "answer": "D", "explanation": "考查必然性推理。由“刘平学习过对外汉语专业”和“学习对外汉语专业的都学习过汉语专业的课程”可知，刘平学习过汉语专业；进而由“学习 12 内部资免费交汉语专业的都学习过古汉语”，刘平学习过古汉语，A 项错误；由“王娜学习汉语专业”和“学习对外汉语专业的都学习过汉语专业的课程”不能推出B 项；同理，C 项不能由题干推出；只有D 项是可以从题干得到的一种可能性推理结论，所以选D。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "panduan-042", "module": "panduan", "no": 42, "subType": "类比推理", "stem": "由“高薪未必养廉”这句话我们可以推出：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "低薪同样养廉", "image": null}, {"key": "B", "text": "养廉必定高薪", "image": null}, {"key": "C", "text": "高薪难以养廉", "image": null}, {"key": "D", "text": "低薪肯定养廉", "image": null}], "answer": "C", "explanation": "考查充分条件假言推理。题干可转化为“如果高薪，那么不一定能养廉”的充分条件形式，对于充分条件的假言推理，A、B、D 三项都不是有效形式，只有C 项是有效的推理，所以选C。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "panduan-043", "module": "panduan", "no": 43, "subType": "逻辑判断", "stem": "乒乓球教练将从右手执拍的选手 A、 B、 C 和左手执拍的 W、 X、 Y、 Z 中选出\n四名队员参加奥运会，要求至少有两名右手执拍的选手，而且选出的四名队员都可以互\n相配对进行对打，已知 B 不能与 W 配对， C 不能与 Y 配对， X 不能与 W 或 Y 配对。\n若 A 不能入选，那么有几种选法？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "一种", "image": null}, {"key": "B", "text": "二种", "image": null}, {"key": "C", "text": "三种", "image": null}, {"key": "D", "text": "四种", "image": null}], "answer": "A", "explanation": "分析推理题。从题干出发，由至少有两名右手执拍的选手与A 不能入选，可知B、C 一定入选，则从Ｗ、Ｘ、Ｙ、Ｚ中再选出两人即可。又因为选出的四名队员都可以互相配对，已知B 不能与Ｗ配对，C 不能与Ｙ配对，那么只有B、C、Ｚ、Ｘ一种选法。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "panduan-044", "module": "panduan", "no": 44, "subType": "逻辑判断", "stem": "一家飞机发动机制造商开发出了一种新型发动机，安全性能要好于旧型发动机。\n在新旧两种型号的发动机同时被销售的第一年，旧型发动机的销量超过了新型发动机，\n该制造商于是得出结论认为安全性并非客户的首要考虑。\n下面哪项如果正确，会最严重地削弱制造商的结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "新型发动机和旧型发动机没有特别大的价格差别", "image": null}, {"key": "B", "text": "新型发动机可以被所有的使用旧型发动机的飞机使用", "image": null}, {"key": "C", "text": "私人飞机主和航空公司都从这家飞机发动机制造商这里购买发动机", "image": null}, {"key": "D", "text": "客户认为旧型发动机在安全性能方面比新型号好，因为他们对旧型发动机的安全 性了解更多", "image": null}], "answer": "D", "explanation": "削弱型题目。题干结论是制造商认为“安全性并非客户的首要考虑”；理由是：制造商开发的新型发动机安全性好于旧型发动机，但是销量却不如旧的好要削弱制造商的结论就要说明客户首先考虑的还是安全性，之所以出现“销量不如旧的好”的结果可能是由于其他原因，D 项恰好说明了这一点，所以能严重削弱题干结论；A、B 两项都没有从安全性与销量的关系上来论述，不能削弱结论；C 项与题干论证无关。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "panduan-045", "module": "panduan", "no": 45, "subType": "逻辑判断", "stem": "粮食可以在收割前在期货市场进行交易。如果预测水稻产量不足，水稻期货价\n格就会上升；如果预测水稻丰收，水稻期货价格就会下降。假设今天早上，气象学家们\n预测从明天开始水稻产区会有适量降雨。因为充分的潮湿对目前水稻的生长非常重要，\n所以今天的水稻期货价格会大幅下降。\n下面哪项如果正确，最严重地削弱以上的观点？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "农业专家们今天宣布，一种水稻病菌正在传播", "image": null}, {"key": "B", "text": "本季度水稻期货价格的波动比上季度更加剧烈", "image": null}, {"key": "C", "text": "气象学家们预测的明天的降雨估计很可能会延伸到谷物产区以外", "image": null}, {"key": "D", "text": "在关键的授粉阶段没有接受足够潮湿的谷物不会取得丰收", "image": null}], "answer": "A", "explanation": "削弱型题目。题干的结论为：今天的水稻期货价格会大幅下降；理由是：气象学家们预测从明天开始水稻产区会有适量降雨，充分的潮湿对目前水稻的生长很重要。 A 项水稻病菌的传播会使水稻减产，所以水稻的期货价格不一定会下降，削弱了题干结论。B 项期货价格波动剧烈，不能削弱或加强结论；C 项不影响水稻期货价格，与题干结论无关；D 项关键的授粉阶段时的天气状况由题干无法得知，无法判断水稻是否歉收，不能削弱题干观点。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "panduan-046", "module": "panduan", "no": 46, "subType": "逻辑判断", "stem": "如今的音像市场上，正版的激光唱盘和影视盘销售不佳，而盗版的激光唱盘和\n影视盘却屡禁不止，销售非常火爆。有的分析人员认为，这主要是因为价格上盗版盘更\n有优势，所以在市场上更有活力。\n以下哪项是这位分析人员在分析中隐含的假定？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "正版的激光唱盘和影视盘往往内容呆板，不适应市场的需要", "image": null}, {"key": "B", "text": "与价格的差别相比，正版盗版质量差别不大", "image": null}, {"key": "C", "text": "知识产权保护对盗版盘的打击使得盗版盘的价格上涨", "image": null}, {"key": "D", "text": "盗版的激光唱盘和影视盘比正版的盘进货渠道畅通", "image": null}], "answer": "B", "explanation": "本题属于前提型题目。分析人员认为盗版价格低所以导致盗版销售量好。要保证分析人员的结论是正确的，就要假设正版盗版的质量相差无几。因此，B 是正确答案。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "panduan-047", "module": "panduan", "no": 47, "subType": "逻辑判断", "stem": "大学生都必须学习自然科学基础。如果代数是必修的或者几何是必修的，那么\n所有学生都将学数学。一部分学生要学习微积分方程，但代数和三角都是所有学生必修\n的，因此：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "所有学生都将学习数学", "image": null}, {"key": "B", "text": "所有学生都将学习代数", "image": null}, {"key": "C", "text": "所有学生都将学习微积分方程", "image": null}, {"key": "D", "text": "所有学生都将学习自然科学基础", "image": null}], "answer": "A", "explanation": "一部分学生要学习微积分方程，显然不能得到C，排除掉；代数是所有学生必修课，但是不能得出所有学生都将学习代数，必修也可以是已经学习 13 内部资免费交过，所以排除B，但是根据代数是必修的可以得到所有学生都将学习数学，A 可得；同理，不能得到D。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "panduan-048", "module": "panduan", "no": 48, "subType": "逻辑判断", "stem": "有一台可打出五彩冰淇淋的机器，机器的每个孔可以打出不同颜色。并且满足\n以下条件：\n（1）如果 1 号孔打出红色，那么 2 号孔不能打出蓝色；\n（2）或者 3 号孔打出红色，或者 1 号孔打出红色；\n（3）如果 2 号孔不能打出蓝色，那么 4 号孔不能打出绿色；\n（4）或者 4 号孔打出绿色，或者 5 号孔不能打出黄色。\n下列哪项如果为真，可以得出“3 号孔打出红色”的结论？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "1 号孔打出红色", "image": null}, {"key": "B", "text": "2 号孔不能打出蓝色", "image": null}, {"key": "C", "text": "4 号孔不能打出绿色", "image": null}, {"key": "D", "text": "5 号孔打出黄色", "image": null}], "answer": "D", "explanation": "（1）1 红色则2 非蓝色；（2）3 或者红色，1 或者红色；（3）2 非蓝色则4 非绿色；（4）4 绿色或5 非黄色；根据（2），若得出3 号孔打出红色，则1 非红色，排除A 项；B 项，代入（2）则4 非绿色，则5 为黄色，无法得出3号孔打出红色，排除；C 项，4 非绿色，则5 为黄色，无法得出3 号孔打出红色，排除；D 项，5 号孔打出黄色，则4 号孔打出绿色，则2 号孔打出蓝色，则1 号孔打出红色，满足要求；故本题选D。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "panduan-049", "module": "panduan", "no": 49, "subType": "逻辑判断", "stem": "在 A 国，比较复杂的民事审判往往超过陪审团的理解力。结果，陪审团对此作\n出的决定经常是错误的。因此，有人建议，涉及较复杂的民事审判由法官而不是陪审团\n来决定，这将提高司法部门的服务质量。\n上述建议依据下列哪项假设？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "即使涉及到不复杂的民事审判，陪审团的决定也常常出现差错", "image": null}, {"key": "B", "text": "法官在决定复杂民事审判的时候，对那些审判的复杂性，比陪审团的人员有更好 的理解", "image": null}, {"key": "C", "text": "大多数民事审判的复杂性超过了陪审团的理解力", "image": null}, {"key": "D", "text": "在 A 国以外一些具有相同法系的国家也早就有类似的提议，并有付诸实施的记录", "image": null}], "answer": "B", "explanation": "前提型题目。有人建议由法官来决定民事审判，他的依据是陪审团对比较复杂的民事审判理解能力不强。为保证该项建议的正确性，就要确保法官对比较复杂的民事审判的理解力超过陪审团人员，所以，应选择B。", "material": null, "srcPage": 16, "imgN": 0, "f": []}, {"id": "panduan-050", "module": "panduan", "no": 50, "subType": "逻辑判断", "stem": "在某国的总统竞选中，争取连任的现任总统在竞选演说时强调：“本届政府执\n政期间，失业率降低了两个百分点，可见本届政府的施政纲领是正确的。”\n如果下列哪项为真，则能有力地削弱以上的申辩？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "政府用调低利率的办法来刺激工商业的发展，使通货膨胀率上升了 40%", "image": null}, {"key": "B", "text": "由于减轻了失业压力，从而减少了犯罪率", "image": null}, {"key": "C", "text": "就业人数增加，减轻了政府福利开支", "image": null}, {"key": "D", "text": "失业率下降，新毕业的大学生就业容易了", "image": null}], "answer": "A", "explanation": "削弱型题目。现任总统认为失业率下降了，证明本届政府的施政纲领是正确的。要削弱这个结论，就要证明政府在除失业率问题外，其他问题处理得不好，A 有效地削弱了该结论。而B、C、D 实际是加强了该结论。", "material": null, "srcPage": 16, "imgN": 0, "f": []}, {"id": "panduan-051", "module": "panduan", "no": 51, "subType": "逻辑判断", "stem": "A 市卫生局调查发现，最近几年来，成年人患乙肝的病例在逐年增多。但是 A\n市卫生局局长说，以此还不能得出乙肝发病率正在逐年上升的结论。\n以下哪项为真，最能支持局长的发言？", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "成年人的乙肝发病数据是根据 A 市卫生局几次抽样调查的结果推出的", "image": null}, {"key": "B", "text": "调查显示， A 市未成年人中的乙肝病例大幅度下降了", "image": null}, {"key": "C", "text": "近年来， A 市农村地区的乙肝发病率有所下降", "image": null}, {"key": "D", "text": "最近几年， A 市越来越多的居民注射了乙肝疫苗", "image": null}], "answer": "B", "explanation": "加强型题目。题干中局长的观点是：从成年人乙肝病例的逐年增多不能得出乙肝发病率正在逐年上升的结论。 A 项在一定程度上质疑了数据的代表性，但是不足以支持结论；B 项说明虽然成年人乙肝病例在逐年提高，乙肝发病率不一定逐年上升，支持了结论；C 项也支持了结论，但与B 项相比，B 项中的“未成年人”恰好是“成年人”以外的人群，而且C 项中的“有所”相比于B 项中的“大幅度”程度较小，故C 项的支持程度不如B 项；D 项为无关项。故答案为B。", "material": null, "srcPage": 16, "imgN": 0, "f": []}, {"id": "panduan-052", "module": "panduan", "no": 52, "subType": "逻辑判断", "stem": "科学家经过归纳发现，地球上之所以有生命存在，至少是具备了以下条件：一\n是存在液态水；二是与热源保持一定的距离从而产生适当的稳定的温差范围。在宇宙的\n其他地方，这两个条件的同时出现几乎是不可能的，所以其他星球上不可能存在与地球\n上一样的生命。\n下列最能反驳以上观点的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "液态水与一个稳定的温差范围不是生命产生的唯一条件", "image": null}, {"key": "B", "text": "人类观测宇宙的科技水平尚未达到足以使人类了解整个宇宙的高度", "image": null}, {"key": "C", "text": "科学家发现在某行星上曾有很长一段时间存在液态水", "image": null}, {"key": "D", "text": "科学家预言宇宙生物的环境适应能力可能比人类强", "image": null}], "answer": "B", "explanation": "削弱型题目。由“宇宙的其他地方几乎不可能有既有液态水又有稳定温差的地方”推出“其他星球上不可能存在与地球上一样的生命”。 A 项“不是生命产生的唯一条件”，却是地球上的生命产生的必要条件，缺少了这两个条件，就不可能存在与地球上一样的生命，故A 项不能削弱题干观点；C、D 项是无关项；B 项说明宇宙中可能存在两个条件都符合的地方，只是人类还不能观测到，削弱了题干结论。故答案选B。 14 内部资免费交流", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "panduan-053", "module": "panduan", "no": 53, "subType": "逻辑判断", "stem": "某学校新来了三位年轻老师，蔡老师、朱老师、孙老师，他们每人分别教生物、\n物理、英语、政治、历史和数学六科中的两科课程。其中，三个人有以下关系：①物理\n老师和政治老师是邻居；②蔡老师在三人中年龄最小；③孙老师、生物老师和政治老师\n三人经常一起从学校回家；④生物老师比数学老师年龄要大些；⑤在双休日，英语老师、\n数学老师和蔡老师三人经常一起打排球。\n根据以上条件，可以推出朱老师教：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "历史和生物", "image": null}, {"key": "B", "text": "物理和数学", "image": null}, {"key": "C", "text": "英语和生物", "image": null}, {"key": "D", "text": "政治和数学", "image": null}], "answer": "C", "explanation": "分析推理类题目。由条件③可知孙老师不教生物和政治，由条件②和条件④可知蔡老师不教生物，可推出教生物的是朱老师；进而由条件④可知朱老师不教数学，则由条件⑤可知，朱老师教英语。故答案选C。", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "panduan-054", "module": "panduan", "no": 54, "subType": "逻辑判断", "stem": "这种基于网络的信息流却有着自身的致命缺陷，那就是确保信息的真实性存在\n难度。由于缺乏相应的监督机制与过滤程序，任何人、任何团体只要具备了自主意识和\n网络条件，都可以成为信息流的制造者，甚至可以引导信息流的价值趋向和未来走势。\n上面陈述直接支持的观点是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "网络信息具备迅捷快速的优点，真实性缺乏是其硬伤", "image": null}, {"key": "B", "text": "网络信息的制造者严重缺乏社会责任感", "image": null}, {"key": "C", "text": "开放性的信息流具有随机性和偶然性，可能对生活带来消极影响", "image": null}, {"key": "D", "text": "在网络信息时代，网络就像一把双刃剑，可以造福人类，也可能带来灾难性后果", "image": null}], "answer": "C", "explanation": "结论型题目。题干中没有谈到网络信息的优点，所以不能推出A 项；题干只讲了网络信息流本身的缺点，因此B 项也无法推出；C 项是题干内容能推出的结论；D 项中的双刃剑在题干中也没有提到，因此也无法推出。故答案选C。", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "panduan-055", "module": "panduan", "no": 55, "subType": "逻辑判断", "stem": "尽管计算机可以帮助人们进行沟通，计算机游戏却妨碍了青少年沟通能力的发\n展。他们把课余时间都花费在玩计算机游戏上，而不是与人交流上。所以说，把课余时\n间花费在玩计算机游戏上的青少年比其他孩子的沟通能力差。\n上述结论最有可能基于以下假设：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "一些被动的活动，如看电视和听音乐，并不会阻碍孩子们交流能力的发展", "image": null}, {"key": "B", "text": "大多数孩子在玩计算机游戏之外还有其他事情可做", "image": null}, {"key": "C", "text": "在课余时间不玩计算机游戏的孩子至少有一些时候是在与人交流", "image": null}, {"key": "D", "text": "由玩计算机游戏带来的思维能力的增强对孩子们的智力开发并没有实质性的益处", "image": null}], "answer": "C", "explanation": "前提型题目。题干由“青少年把课余时间花在玩计算机游戏上而不是与人交流上”推出结论“把课余时间花在玩计算机游戏上的青少年比其他孩子的沟通能力差”要使推论成立，则需要前提证明不玩计算机游戏的青少年花在与人交流上的时间比玩计算机游戏的孩子多，否则不能认为他们的沟通能力比玩计算机游戏的青少年好。故C 项是必须的假设。", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "panduan-056", "module": "panduan", "no": 56, "subType": "逻辑判断", "stem": "近年来，由于医疗服务保障的城乡差异，大城市的人均寿命比农村高了 12 年，\n贫困地区儿童死亡率为大城市的 9 倍。这是某论坛公共卫生分论坛上学者提供的最新研\n究成果。\n下列能够有力削弱以上论述所支持的观点的是：\n（1）在某些沿海地区，城乡差别正在日益缩小，农村人口的医疗保障水平已经大\n大提高\n（2）某些乡村医院在统计中故意隐瞒儿童死亡记录\n（3）调查数据基于两年前西北某地区医院的统计\n（4）该论坛在公共卫生机构中享有很高声誉\n（5）近年来，我国的人口流动性比以往大大提高", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "（1）（3）", "image": null}, {"key": "B", "text": "（2）（3）", "image": null}, {"key": "C", "text": "（1）（3）（5）", "image": null}, {"key": "D", "text": "（2）（4）（5）", "image": null}], "answer": "A", "explanation": "削弱型题目。题干中指出大城市的人均寿命比农村高12 年，贫困地区儿童死亡率为大城市的9 倍，原因是医疗服务保障的城乡差异要削弱这个论述，就要指出城乡差距日益缩小，或者指出这个调查不具有代表性，（1）和（3）都能很好削弱题干论述的观点；（2）说明乡村儿童死亡率比调查研究的数据更高，加强了题干观点；（4）也加强了题干论点；一般来说，寿命和死亡率都是按照户口统计的，人口流动性提高不影响统计结果，故（5）不能削弱题干观点。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "panduan-057", "module": "panduan", "no": 57, "subType": "逻辑判断", "stem": "已知“如果小明去上海，那么小红或小青也去上海”为真，则以下选项必然为\n真的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "如果小红不去上海，那么小明不去上海", "image": null}, {"key": "B", "text": "如果小青不去上海，那么小明不去上海", "image": null}, {"key": "C", "text": "如果小红和小青都不去，那么小明不去上海", "image": null}, {"key": "D", "text": "如果小明不去上海，那么小红和小青均不去上海", "image": null}], "answer": "C", "explanation": "考查复言命题推理。题干是一个充分条件假言推理，其正确推理形式是：肯定前件式和否定后件式。C 项否定了后件，可推出否定的前件即“小明不去上海”，故C 项正确。A、B 两项都不能否定后件，D 项否定前件不是有效的推理形式。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "panduan-058", "module": "panduan", "no": 58, "subType": "定义判断", "stem": "机关行政现代化是指机关行政观念民主化、规章制度人性化和管理手段科学化，\n机关行政是现代社会发展和科学技术进步的客观需要，是经济和社会发展的重要组成部\n分，现在，行政环境已经发生了根本性的划时代的变化。\n以下选项能最好地补充上文的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "行政机关也不能因循守旧，裹足不前，必须随着时代的发展而发展，随着时代的 变化而变化", "image": null}, {"key": "B", "text": "行政机关必须树立很强的时效观念，及时高效地为行政首长和行政部门提供服务", "image": null}, {"key": "C", "text": "每个行政机关必须制定行之有效的规章制度，这是实现机关行政规范化管理和提 高行政效率的保证", "image": null}, {"key": "D", "text": "随着科学技术和计算机网络技术的发展，行政机关必须实现办公自动化和网络化", "image": null}], "answer": "A", "explanation": "结论型题目。题干讲述的是机关行政现代化，A 项从行政机关现代化角度更好地补充了上文，即行政机关不能墨守成规，应随着时代的发展而发展，故选A。B 项是说行政机关行政观念应民主化，C 项是说行政机关规章制度应人性化，D 项是说行政机关管理手段应科学化。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "panduan-059", "module": "panduan", "no": 59, "subType": "逻辑判断", "stem": "目前，越来越多的新婚夫妇登记结婚前进行个人财产公证，这种做法无论对于\n社会还是对于家庭都是有利的，应当提倡，至少不应反对。\n以下选项不能支持上述结论的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "在以往的离婚案件中，财产分割是最棘手的问题之一", "image": null}, {"key": "B", "text": "我国离婚率上升的一个重要原因，是当事人双方社会地位的失衡，如名人离婚率 是最高的", "image": null}, {"key": "C", "text": "世界先进国家中，婚前财产公证被普通接受", "image": null}, {"key": "D", "text": "婚前财产公证，只要当事人对此有正确的理解，不会对新婚夫妇的感情产生不利 的影响", "image": null}], "answer": "B", "explanation": "加强型题目。题中的结论是我们应当提倡，至少不应反对新婚夫妇在登记结婚前进行个人财产公证。A、C、D 三项均加强了题干论证。B 项是说双方社会地位失衡，与题干结论无关，因此不能支持题干。 15 内部资免费交流", "material": null, "srcPage": 19, "imgN": 0, "f": []}, {"id": "panduan-060", "module": "panduan", "no": 60, " 。\n根据以上定义，下列不属于创伤后应激障碍的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "从伊拉克战场回来的美国兵，大多患上了失眠、焦虑甚至严重的精神疾病", "image": null}, {"key": "B", "text": "扬扬小时候在邻居张阿姨家被狗咬过一口，从此再也不想去张阿姨家了", "image": null}, {"key": "C", "text": "小张曾经被困在电梯里五个多小时，当时感觉自己没救了，最后化险为夷，但从 此小张常常做被困在电梯里的梦，而且以后再也不敢乘坐电梯了", "image": null}, {"key": "D", "text": "目睹了儿子阿毛被野兽叼走的一幕，失魂落魄的祥林嫂见了人就说： “我真傻， 真的我不知道下雪的时候，野兽在山坳里没有食吃，会到村里来，我不知道春天也会 有……”", "image": null}], "answer": "B", "explanation": "创伤后应激障碍的定义要点是：①经历了创伤；②出现的持续的、不必要的、无法控制的障碍。B 项不符合②，扬扬被狗咬过一口后，虽然产生了从此再也不想去张阿姨家的结果，但这种结果不是“无法控制的障碍”。其他三个选项都符合定义。故答案为B。", "material": null, "srcPage": 28, "imgN": 0, "f": []}, {"id": "panduan-093", "module": "panduan", "no": 93, "subType": "定义判断", "stem": "物证是指能够证明案件真实情况的物质痕迹和物品。物证的特征是它的外形、\n质量、特性和所在的位置等，反映了某些案件事实，人们可以此来证明案件的事实真相。\n根据以上定义，下列属于物证的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "高速公路上发生一起交通事故，交通警察勘测现场时拍摄的现场照片", "image": null}, {"key": "B", "text": "在审理一起恶性的杀人案件中，因目击证人担心遭到报复，不愿出庭作证，而提 供的记录证言的录音带", "image": null}, {"key": "C", "text": "某地警方在打击盗窃机动车的行动中追缴回来的被盗车辆", "image": null}, {"key": "D", "text": "根据警方在盗窃现场提取的指纹，鉴定人员所做的指纹鉴定报告", "image": null}], "answer": "C", "explanation": "物证的定义要点是：①能够证明案件真实情况；②物质痕迹和物品。A 项中勘测现场时拍摄的现场照片、B 项中记录证言的录音带、D 项中的指纹鉴定报告都不符合②。C 项中的被盗车辆符合定义，属于物证。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "panduan-094", "module": "panduan", "no": 94, "subType": "定义判断", "stem": "行政授权是指法律、法规将行政职权及行政职责的一部分或全部授给非行政机\n关的社会组织来行使的法律行为。\n根据以上定义，下列属于行政授权的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "《植物检疫条例》规定，县级以上地方各级农业部门所属的植物检疫机构负责行 使植物检疫权", "image": null}, {"key": "B", "text": "某县政府文件规定，县自来水公司行使节约用水、计划用水的行政执法权", "image": null}, {"key": "C", "text": "宪法规定国务院行使省、自治区、直辖市范围内部分地区的戒严权", "image": null}, {"key": "D", "text": "县环保局局长要求一副局长代行其外出期间的局长职务", "image": null}], "answer": "A", "explanation": "行政授权的定义要点是：①法律、法规；②行政职权及行政职责；③非行政机关的社会组织。B 项“某县政府文件”不是法律、法规，不符合①；C 项“国务院”不符合③；D 项不符合①、③。A 项符合定义。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "panduan-095", "module": "panduan", "no": 95, "subType": "逻辑判断", "stem": "救助型社会保障制度：指国家通过建立健全社会保障的有关规章制度保证每个\n社会成员在遇到各种不测事故时，能得到救助而不至于陷入贫困。对于已经处于贫困境\n遇的人们，则发给社会保障津贴，以维持其基本生活。\n下列属于此种保障制度特征的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "南京市政府决定提高最低生活保障金", "image": null}, {"key": "B", "text": "所有适龄儿童都可以享受九年制义务教育", "image": null}, {"key": "C", "text": "设立公积金，为退休人士提供社会保障", "image": null}, {"key": "D", "text": "在各个社区设立老人保健中心，以便老人能在住所附近获得医疗照顾", "image": null}], "answer": "A", "explanation": "最低生活保障金是保障所有的人都能有最低的收入，不至于陷入贫困，是对贫困人口的救助，属于“已经处于贫困境遇的人们”。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "panduan-096", "module": "panduan", "no": 96, "subType": "定义判断", "stem": "亚健康：是指处于健康和疾病之间的一种临界状态，是介于健康和疾病之间的\n连续过程中的一个特殊阶段。\n以下属于亚健康的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "老张的父亲患有严重的老年痴呆症，在患病期间卧床不起，不能行走和说话", "image": null}, {"key": "B", "text": "记者小王在“十运会”期间，由于采访任务繁重，身体的主要器官处于入不敷出 的非正常负荷状态，过度疲劳，造成精力、体力透支", "image": null}, {"key": "C", "text": "运动员在进行短跑或足球等无氧运动时，体内的血糖进行无氧分解提供能量，运 动后肌肉里累积大量乳酸，引起肌肉痛", "image": null}, {"key": "D", "text": "桑兰是我国的一名体操运动员，她参加第四届世界友好运动会时，不幸失手严重 摔伤，导致胸部以下完全瘫痪", "image": null}], "answer": "B", "explanation": "小王“身体的主要器官处于入不敷出的非正常负荷状态，过度疲劳，造成精力、体力透支”的状态“介于健康和疾病之间”。", "material": null, "srcPage": 30, "imgN": 0, "f": []}, {"id": "panduan-097", "module": "panduan", "no": 97, "subType": "定义判断", "stem": "暗示效应，是指在无对抗的条件下，用含蓄、抽象诱导的间接方法对人们的心\n理和行为产生影响，从而诱导人们按照一定的方式去行动或接受一定的意见，使其思想、\n行为与暗示者期望的目标相符合。\n根据上述定义，下列选项中没有产生暗示效应的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "课堂上同学们仍在讨论课间的话题，正在讲课的老师停了下来，教室里立刻鸦雀 无声", "image": null}, {"key": "B", "text": "70 多岁的张奶奶一股劲儿念叨着：“我孙子快回来了”，没过多久，孙子果然 回来看望她", "image": null}, {"key": "C", "text": "森林里，老猎户一声不响地走着，大家紧随其后", "image": null}, {"key": "D", "text": "自从班主任在班会上表扬上小红学习进步快之后，小红学习更加努力了", "image": null}], "answer": "B", "explanation": "B 项张奶奶的念叨并未对孙子的心理和行为产生影响，使其按张奶奶的期望去行动。孙子回来看望张奶奶仅仅是种巧合。A、C、D 三项都符合暗示效应的定义。 18 内部资免费交流", "material": null, "srcPage": 30, "imgN": 0, "f": []}, {"id": "panduan-098", "module": "panduan", "no": 98, "subType": "定义判断", "stem": "无公害蔬菜，是指应用微生物农药、农用抗生素等生物防治措施及高效低毒、低\n残留的化学农药综合防治蔬菜病虫，使农药残留量低于国家规定允许食用标准的蔬菜。\n根据上述定义，下列选项中说法正确的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "无公害蔬菜必须使用微生物农药", "image": null}, {"key": "B", "text": "农用抗生素允许使用", "image": null}, {"key": "C", "text": "化学农药只要高效低毒就可以使用", "image": null}, {"key": "D", "text": "无公害蔬菜可放心食用，绝对不会对身体有一点伤害", "image": null}], "answer": "B", "explanation": "无公害蔬菜可以用农用抗生素等其他防治措施，A 项错误而B 项正确；化学农药不仅要高效低毒而且要求低残留，C 项错误；D 项说法过于绝对。故答案选B。", "material": null, "srcPage": 30, "imgN": 0, "f": []}, {"id": "panduan-099", "module": "panduan", "no": 99, "subType": "定义判断", "stem": "绿色科技，是指以提倡文明的生活方式和适度的消费方式，强调自然资源的合\n理开发和循环利用，发展清洁生产技术、无污染的绿色产品，企业实行绿色管理和对环\n境的治理，保持人类社会可持续发展的科学技术。\n根据上述定义，下列选项中不是发展绿色科技的手段是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "工业产品减少用料的小型化", "image": null}, {"key": "B", "text": "厂房减少占地实现多功能化", "image": null}, {"key": "C", "text": "废物的高回收利用化", "image": null}, {"key": "D", "text": "降低生产原材料经济成本", "image": null}], "answer": "D", "explanation": "降低原材料经济成本不属于绿色科技手段。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "panduan-100", "module": "panduan", "no": 100, "subType": "定义判断", "stem": "个人独资企业，是指依法设立，由一个自然人投资，财产为投资人个人所有，\n投资人以其个人财产对企业债务承担无限责任的经营实体。\n根据上述定义，下列选项中叙述正确的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "李某以个人积蓄出资办厂，后企业经营不善，无法偿付到期债务，债权人追至李 某家里，要求其家人替李某偿还债务", "image": null}, {"key": "B", "text": "小明患有小儿麻痹症，但不影响他成为个人独资企业的投资人", "image": null}, {"key": "C", "text": "晓辉， 15 岁，头脑活络，利用多年的“压岁钱”出资成立个人独资企业", "image": null}, {"key": "D", "text": "因香烟利润丰厚，龙某决定成立个人独资企业专卖自家土制香烟", "image": null}], "answer": "B", "explanation": "A 项中李某未对企业债务承担无限责任；C 项中晓辉15 岁，并不是完全民事行为能力人；D 项中烟草为国家专卖。C、D 两项都违反了法律规定，不能成立个人独资企业。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "panduan-101", "module": "panduan", "no": 101, "subType": "定义判断", "stem": "公务员权利是指法律对公务员在履行职责、执行国家公务的过程中可以做出一\n定行为、要求他人作出某种行为或者抑制一定行为的许可和保障。\n根据以上定义，下列不属于公务员权利的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "公务员全心全意为人民服务", "image": null}, {"key": "B", "text": "公务员获得工资报酬，享受福利、保险待遇", "image": null}, {"key": "C", "text": "公务员获得履行职责应当具有的工作条件", "image": null}, {"key": "D", "text": "公务员对机关工作和领导人员提出的批评和建议", "image": null}], "answer": "A", "explanation": "全心全意为人民服务并不是公务员在履行职责、执行国家公务员的过程中可以做出一定行为、要求他人作出某种行为或者抑制一定行为的许可和保障，而是公务员的义务之一。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "panduan-102", "module": "panduan", "no": 102, "subType": "定义判断", "stem": "公文是指国家机关在处理公务的过程中，形成的具有法定效力和规范体式的文\n字材料。\n根据以上定义，下列不属于公文的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "石家庄市人民政府《关于授予滹沱河生态开发整治工程市长特别奖的决定》", "image": null}, {"key": "B", "text": "文化部《关于同意邀请新加坡歌手林俊杰到江苏演出的批复》", "image": null}, {"key": "C", "text": "北京市政府《关于 2007 年北京地区普通中等专业学校毕业生毕业派遣工作安排 的通知》", "image": null}, {"key": "D", "text": "东北师范大学教务处《关于 2008 年度工作情况的报告》", "image": null}], "answer": "D", "explanation": "公文的发布主体是国家机关。D 项，东北师范大学教务处不属于国家机关，《关于2008 年度工作情况的报告》也不具有法定效力。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "panduan-103", "module": "panduan", "no": 103, "subType": "定义判断", "stem": "基层群众性自治组织是指依照有关法律规定，以城乡居民（村民）一定的居住\n地为纽带和范围设立，并由居民（村民）选举产生的成员组成的，实行自我管理、自我\n教育、自我服务的社会组织。\n根据以上定义，下列属于基层群众自治性组织的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "归阳镇人民政府", "image": null}, {"key": "B", "text": "南王村村民委员会", "image": null}, {"key": "C", "text": "槐底街道办事处", "image": null}, {"key": "D", "text": "石家庄阳光牧业管理服务公司", "image": null}], "answer": "B", "explanation": "A 项中人民政府不属于自治组织；C 项中办事处是政府派出机构，而不是居民选举产生；D 项的公司并不是由居民选举产生。只有B 项符合定义。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "panduan-104", "module": "panduan", "no": 104, "subType": "定义判断", "stem": "国家赔偿是指国家机关及其工作人员违法行使行政、侦察、检查、审判、监狱\n管理等职权，侵犯公民、法人和其他组织的合法权益并造成损害的，由法律规定的赔偿\n义务机关对受害人予以赔偿的法律制度。\n根据以上定义，下列属于国家赔偿的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "某战士因公殉职，国家追认其为烈士，并发给其家人每年 1 万元的抚恤金", "image": null}, {"key": "B", "text": "公务员李某因丢失从邻居处借来的一条金项链，赔了人家 3000 多块钱", "image": null}, {"key": "C", "text": "工商机关因错误地吊销某个体户的营业执照，使其蒙受经济损失，因此给予一次 性 2 万元赔偿", "image": null}, {"key": "D", "text": "国家财政每年从税收中拿出一部分用于扶贫建设", "image": null}], "answer": "C", "explanation": "A、B、D 三项中均并不存在工作人员违法行使职权而造成公司、法人和其他组织的合法权益的损害的事实。C 项中工商机关行使职权造成某个体户合法权益遭受损害，故答案为C。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "panduan-105", "module": "panduan", "no": 105, "subType": "逻辑判断", "stem": "行政复议：行政复议是公民、法人或者其他组织认为行政机关的具体行政行为\n或者行政不作为侵犯其合法权益的，对该行为或不作为提起行政复议。\n下列不属于行政复议行为的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "蔬菜市场摊主王某因不服区工商局的罚款处罚，向市工商局提出复议申请", "image": null}, {"key": "B", "text": "刘某因打架斗殴被刑事拘留 15 天，释放后由于不服而向上级机关提出复议申请", "image": null}, {"key": "C", "text": "某食品厂因违规操作而被吊销生产许可证，该厂向人民政府提出复议申请", "image": null}, {"key": "D", "text": "张某因不服超速驾驶被处以 200 元罚款的处罚，向上级公安交警部门提出复议申 请", "image": null}], "answer": "B", "explanation": "行政复议定义的关键信息为：行政机关的具体行政行为或者行政不作为行为。选项B 对刘某进行刑事拘留不是行政行为，而是一种司法行为，不符合定义的关键信息。答案选B。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "panduan-106", "module": "panduan", "no": 106, "subType": "逻辑判断", "stem": "白亮污染：是一类光污染，指过度光亮给人的视觉造成的不良影响，如光洁的金\n属表面、城市里建筑物的玻璃幕墙、釉面砖墙、磨光大理石以及各种涂料等装饰反射光\n线，明晃白亮、眩眼夺目，使人头昏眼花、心烦意乱、食欲下降、情绪低落等身体不适。\n下列表述不属于白亮污染的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "夏天，玻璃幕墙强烈的反光进入附近居民楼房内，增加了室内亮度，影响正常的 生活", "image": null}, {"key": "B", "text": "烈日下驾车行驶的司机会出其不意地遭到玻璃幕墙反射光的突然袭击，眼睛受到 强烈刺激，很容易诱发车祸", "image": null}, {"key": "C", "text": "夜幕降临后，商场、酒店上的广告灯、霓虹灯闪烁夺目，令人眼花缭乱", "image": null}, {"key": "D", "text": "在一些旅游景点，许多人拍照留影，不停闪烁的闪光灯让其他游客心烦意乱", "image": null}], "answer": "C", "explanation": "白亮污染的定义要点是：①过度光亮；②给人视觉造成不良影响。A、B、D 三项都符合这一标准；选项C 是彩光污染的表现。因此，本题选C。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "panduan-107", "module": "panduan", "no": 107, "subType": "定义判断", "stem": "城市热岛：是指随着城市规模的迅速扩大，城市气温明显高于外围郊区的现象。\n在气象学近地面大气等温线图上，郊外的广阔地区气温变化很小，如同一个平静的海面，\n而城区则是一个明显的高温区，如同突出海面的岛屿。由于这种岛屿代表着高温的城市\n区域，所以就被形象地称为“城市热岛”。\n根据上述定义，下列表述不正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "热岛效应不仅使城市的气候发生了变化，还带来严重的污染，成为影响城市环境 质量的重要因素", "image": null}, {"key": "B", "text": "一般情况下，城市规模越大，人口越密集，热岛效应也愈发明显", "image": null}, {"key": "C", "text": "城市热岛效应与机动车辆、工业生产及人群活动等产生的“温室效应”有关", "image": null}, {"key": "D", "text": "在城市中，增加道路、广场、体育馆等公用设施，对缓解热岛效应有帮助", "image": null}], "answer": "D", "explanation": "城市热岛是随着城市规模的迅速扩大，城市气温明显高于外围郊区的现象。城市热岛强度随着城市发展而加强，因此在控制城市发展的同时，要控制城市人口密度、建筑物密度。因为人口高密度区也是建筑物高密度区和能量高消耗区，常形成气温的高值区。A、B、C 项根据定义表述均正确，定义中没有提及增加道路、广场、体育馆等公用设施会缓解热岛效应，所以D 项错误。 19 内部资免费交流", "material": null, "srcPage": 33, "imgN": 0, "f": []}, {"id": "panduan-108", "module": "panduan", "no": 108, "subType": "类比推理", "stem": "消毒：手术", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "动员：开会", "image": null}, {"key": "B", "text": "生产：销售", "image": null}, {"key": "C", "text": "启动：驾驶", "image": null}, {"key": "D", "text": "彩排：演出", "image": null}], "answer": "C", "explanation": "消毒是手术前的必要操作，启动是驾驶前的必要操作。B项生产不是销售的必要条件。", "material": null, "srcPage": 33, "imgN": 0, "f": []}, {"id": "panduan-109", "module": "panduan", "no": 109, "subType": "类比推理", "stem": "枪：子弹", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "汽车：汽油", "image": null}, {"key": "B", "text": "门：窗户", "ima  "image": null}, {"key": "B", "text": "专家：青年", "image": null}, {"key": "C", "text": "四季：春天", "image": null}, {"key": "D", "text": "纸张：书法", "image": null}], "answer": "B", "explanation": "题干两个概念是交叉关系，即运动员有可能是大学生，而大学生也有可能是运动员。只有B 符合题意要求。", "material": null, "srcPage": 35, "imgN": 0, "f": []}, {"id": "panduan-127", "module": "panduan", "no": 127, "subType": "类比推理", "stem": "混凝土：建筑", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "高粱米：秧酒", "image": null}, {"key": "B", "text": "燕窝：浸淀", "image": null}, {"key": "C", "text": "紫金山：天文台", "image": null}, {"key": "D", "text": "公务员：管理", "image": null}], "answer": "A", "explanation": "混凝土是建筑的原料；高粱米则是酿制秧酒的原料，A 项正确。", "material": null, "srcPage": 35, "imgN": 0, "f": []}, {"id": "panduan-128", "module": "panduan", "no": 128, "subType": "类比推理", "stem": "火锅：饭桌", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "果树：水果", "image": null}, {"key": "B", "text": "船舶：水运", "image": null}, {"key": "C", "text": "潜艇：海洋", "image": null}, {"key": "D", "text": "太阳能：屋顶", "image": null}], "answer": "C", "explanation": "物品及其使用场所的关系。火锅一般放在饭桌上使用，潜艇在海洋里航行。", "material": null, "srcPage": 35, "imgN": 0, "f": []}, {"id": "panduan-129", "module": "panduan", "no": 129, "subType": "类比推理", "stem": "手机：通话", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "酱油：调味", "image": null}, {"key": "B", "text": "运动员：比赛", "image": null}, {"key": "C", "text": "树木：家具", "image": null}, {"key": "D", "text": "司机：驾驶", "image": null}], "answer": "A", "explanation": "手机可用来通话，而酱油可用来调味。", "material": null, "srcPage": 35, "imgN": 0, "f": []}, {"id": "panduan-130", "module": "panduan", "no": 130, "subType": "类比推理", "stem": "立方体：几何学", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "比重：物理学", "image": null}, {"key": "B", "text": "血液：植物学", "image": null}, {"key": "C", "text": "地质学：化合物", "image": null}, {"key": "D", "text": "基因：历史学", "image": null}], "answer": "A", "explanation": "立方体是几何学中的概念，而比重是物理学中的概念，A符合题意。", "material": null, "srcPage": 35, "imgN": 0, "f": []}, {"id": "yanyu-001", "module": "yanyu", "no": 1, "subType": "逻辑填空", "stem": "使儿童更好地适应互联网时代，不仅意味着要让他们掌握计算机技术、会使用计\n算机查找信息，更重要的在于要让儿童对互联网上 ________ 的信息有清醒的辨别能力。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "良莠不齐", "image": null}, {"key": "B", "text": "汗牛充栋", "image": null}, {"key": "C", "text": "纷繁芜杂", "image": null}, {"key": "D", "text": "浩如烟海", "image": null}], "answer": "C", "explanation": "良莠不齐：指好人坏人都有，混杂在一起。显然，此空是用来形容信息的，而不是人，排除A 项。汗牛充栋：指藏书太多，书运输时牛累得出汗，存放时可堆至屋顶，形容藏书非常多。用在此空也不合适，排除B 项。浩如烟海：形容典籍、图书等极为丰富。本题对信息的描写需要选择一个繁多复杂的词，而“浩如烟海”是用来形容丰富，故排除D 项。纷繁芜杂：多而杂乱，没有条理。在这里可以形容网络信息很多，需要儿童有辨别能力，故选择C。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "yanyu-002", "module": "yanyu", "no": 2, "subType": "逻辑填空", "stem": "有些人说了许多似乎很有道理的话，却让人摸不着边际；有些人只说了一两句，\n却有 ________ 之效。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "相见恨晚", "image": null}, {"key": "B", "text": "穿云破雾", "image": null}, {"key": "C", "text": "醍醐灌顶", "image": null}, {"key": "D", "text": "如释重负", "image": null}], "answer": "C", "explanation": "相见恨晚：只恨相见得太晚。形容一见如故，意气极其相投。穿云破雾：比喻突破重重障碍和困难。如释重负：像放下重担那样。形容紧张心情过去以后的轻松愉快。比喻人在解除某种负担后轻松愉快。醍醐灌顶：佛教指灌输智慧，使人彻底觉悟。比喻听了高明的意见使人受到很大启发。本题答案为C。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "yanyu-003", "module": "yanyu", "no": 3, "subType": "逻辑填空", "stem": "有效地进行人本管理，关键在于建立一整套完善的管理机制和环境，使每一个员\n工不是处于 ________ 状态，而是处于 ________ 状态，激励员工奋发向上、励精图治的精\n神。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "被主动", "image": null}, {"key": "B", "text": "消积极", "image": null}, {"key": "C", "text": "自协作", "image": null}, {"key": "D", "text": "紧放松", "image": null}], "answer": "A", "explanation": "根据“不是……而是……”可知，该处应选择一对反义词，排除C。“消极”和“积极”通常用来形容态度，而不是一种状态。“紧张”与“放松”与原题意思不合，故答案为A。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "yanyu-004", "module": "yanyu", "no": 4, "subType": "逻辑填空", "stem": "医学关系到每个人的生命安危，对于 ________ 社会的治安有重要作用，加上儒家\n思想认为，医者“上以疗君亲之疾，下以救贫贱之厄，中以保身长全，以养其生”，所\n以也受到历代政府和知识分子的 ________。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "维重视", "image": null}, {"key": "B", "text": "保推崇", "image": null}, {"key": "C", "text": "维支持", "image": null}, {"key": "D", "text": "保肯定", "image": null}], "answer": "A", "explanation": "词语习惯性搭配在选词填空中起到很重要的作用，题干中两个词都属于习惯性搭配，维护——治安，受到——重视。故本题答案为A。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "yanyu-005", "module": "yanyu", "no": 5, "subType": "逻辑填空", "stem": "如果一定要找到油价上涨的凶手，连驾驶者自己恐怕都不可避免地受到\n________，因为消费者不断上升的欲望构成了石油公司 ________ 的基础。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "非坐收渔利", "image": null}, {"key": "B", "text": "牵一本万利", "image": null}, {"key": "C", "text": "抨市无二价", "image": null}, {"key": "D", "text": "指漫天要价", "image": null}], "answer": "D", "explanation": "坐收渔利：比喻利用别人的矛盾而从中获利，这里并没有提到什么矛盾，因此排除A。一本万利：形容本钱小，利润大。石油公司当然不是本钱小的行业，“一本万利”用在这里不合适。而“市无二价”指买卖没有两种价钱，买卖公道，不欺骗人，形容社会风气好。也不符合句意，排除C。本题答案为D。", "material": null, "srcPage": 1, "imgN": 0, "f": []}, {"id": "yanyu-006", "module": "yanyu", "no": 6, "subType": "逻辑填空", "stem": "诗在其所具有的诸般品格中，十分重要的一条，便是对生活的 ________ 的打量。\n诗人的目光仿佛具有 ________ 的本领，生活中许多琐碎、平淡甚至枯燥的事物，经过它\n的抚摸，便产生了丰富的意味。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "别具一点石成金", "image": null}, {"key": "B", "text": "别具匠明察秋毫", "image": null}, {"key": "C", "text": "别具匠点石成金", "image": null}, {"key": "D", "text": "别具一明察秋毫", "image": null}], "answer": "A", "explanation": "“别具一格”是说另有一种独特的风格。“别具匠心”指在技巧和艺术方面具有与众不同的巧妙构思。句意是说对生活有与众不同的打量，“别具一格”更为合适，因而排除B、C。“点石成金”比喻修改文章时稍稍改动原来的文字，就使它变得很出色。“明察秋毫”指任何细小的事物都能看得很清楚，多形容人能洞察事理。根据句意选择A。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "yanyu-007", "module": "yanyu", "no": 7, "subType": "逻辑填空", "stem": "这来的便是闰土。 ________ 我一见便知道是闰土，但又不是我 ________ 上的闰土\n了。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "当追忆", "image": null}, {"key": "B", "text": "虽记忆", "image": null}, {"key": "C", "text": "果记忆", "image": null}, {"key": "D", "text": "虽回忆", "image": null}], "answer": "B", "explanation": "“虽然”与后面的“但”构成一组搭配。闰土留给作者的印象应该是在记忆中，因此B 项搭配合理。 2 内部资免费交流", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "yanyu-008", "module": "yanyu", "no": 8, "subType": "逻辑填空", "stem": "电视读报是二次 ________ 报刊信息，它 ________ 报刊精华，聚集热点话题。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "整浓缩", "image": null}, {"key": "B", "text": "整浓缩", "image": null}, {"key": "C", "text": "编提取", "image": null}, {"key": "D", "text": "加提炼", "image": null}], "answer": "A", "explanation": "“整合”指把一些零散的东西通过某种方式而彼此衔接，从而形成有价值有效率的一个整体。电视读报正是对报刊信息的二次“整合”。与精华对应的是“浓缩”，因此，本题选A。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "yanyu-009", "module": "yanyu", "no": 9, "subType": "逻辑填空", "stem": "一直盛传的数字电视地面传输标准强制实施将被迫推迟的消息，近日终于得到了\n________，伴随而来的，将是安装在某市近万辆公交车上的欧标机顶盒和它们背后的 4\n个覆盖全市的欧标基站被拆掉，并代之以国标产品，该市也成为新国标在全国强制实施\n的缩影和 ________。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "否表率", "image": null}, {"key": "B", "text": "否标准", "image": null}, {"key": "C", "text": "承标杆", "image": null}, {"key": "D", "text": "认先行", "image": null}], "answer": "A", "explanation": "根据上下文，前面出现“被推迟的消息”，而后“终于得到”，之后是“被拆掉”，从这几个词中可以看出数字电视地面传输标准得到了推行。因此，前一空填“否认”。“表率”有榜样、模范之意。根据句意，该市成为新国标在全国的一个缩影，因此选择A。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "yanyu-010", "module": "yanyu", "no": 10, "subType": "逻辑填空", "stem": "当前，各国政治、经济和社会 ________ 不同，历史文化 ________ 不同，发展\n________ 也不尽一致。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "传制速度", "image": null}, {"key": "B", "text": "制水速度", "image": null}, {"key": "C", "text": "制传水平", "image": null}, {"key": "D", "text": "水传制度", "image": null}], "answer": "C", "explanation": "“政治经济制度”、“历史文化传统”、“发展水平”，搭配一致，根据排除法选择C。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "yanyu-011", "module": "yanyu", "no": 11, "subType": "逻辑填空", "stem": "人类已在全球范围内给大自然以影响： ________ 陆地， ________ 人工湖和人工\n河， ________ 了整个区域气候。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "改建影响", "image": null}, {"key": "B", "text": "建改改变", "image": null}, {"key": "C", "text": "改建调整", "image": null}, {"key": "D", "text": "改改影响", "image": null}], "answer": "A", "explanation": "人工湖本来不存在，是人造的，因此用“建造”作为搭配动词，而非“改造”，排除B、D 项。“调整”是不断做出变化使适合，排除C。对气候造成的是“影响”，因此选择A。", "material": null, "srcPage": 2, "imgN": 0, "f": []}, {"id": "yanyu-012", "module": "yanyu", "no": 12, "subType": "逻辑填空", "stem": "海南三亚以其 ________ 的旅游环境、 ________ 的生活环境和 ________ 的自然环\n境，一直受到各界人士的青睐。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "独舒优美", "image": null}, {"key": "B", "text": "独优舒适", "image": null}, {"key": "C", "text": "舒独优美", "image": null}, {"key": "D", "text": "优独舒适", "image": null}], "answer": "A", "explanation": "生活环境用“舒适”形容，自然环境用“优美”形容，根据排除法选择A。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "yanyu-013", "module": "yanyu", "no": 13, "subType": "逻辑填空", "stem": "________ 都说“盛世收藏，乱世藏金”， ________， ________ 对黄金投资品种\n及其特点真正了解的话， ________ 会发现黄金在任何时候都不失为一种很好的理财产\n品。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "因所只才", "image": null}, {"key": "B", "text": "虽但如就", "image": null}, {"key": "C", "text": "虽但只才", "image": null}, {"key": "D", "text": "因所如就", "image": null}], "answer": "B", "explanation": "文中前面提到“乱世藏金”，最后一句又提到“黄金在任何时候都不失为一种很好的理财产品”可以看出短文前后部分属于转折关系，排除A、D两项。“如果……就”属于假设关系，“只有……才”属于条件关系，原文中有“对黄金投资品种及其特点真正了解的话”，“……的话”表示假设关系，所以，此题选B。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "yanyu-014", "module": "yanyu", "no": 14, "subType": "逻辑填空", "stem": "________ 今天的人类居住在一个空间探索和虚拟现实的完全现代化的世界里，\n但他们的活动和石器时代的狩猎者的活动基于 ________ 的智力本质，例如，在受到威胁\n时进行对抗的本能，以及交换信息和分享秘密的动力。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "其不同", "image": null}, {"key": "B", "text": "尽同样", "image": null}, {"key": "C", "text": "虽不同", "image": null}, {"key": "D", "text": "尽类似", "image": null}], "answer": "B", "explanation": "由句中的“但”可知，第一空所填关联词语应能与“但”搭配，排除A。根据题干的转折关系以及“例如”后面的内容可知，今天的人类与石器时代的人类虽然居住在不同的世界里，但是智力本质是相同的，第二空应选“同样”，故正确答案为B。 【知识点拨】本题D 为干扰项。“类似”意为大致相像，说明还存在不同的地方，而题干中的“例如”后面的内容并没有说明有不一样的地方，由此我们可以排除D 项。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "yanyu-015", "module": "yanyu", "no": 15, "subType": "逻辑填空", "stem": "当体育界、工业界和其他领域中的一些领导者将他们的成功归因于一种高度的\n________ 意识时，一个社会还是应该更好地为那些即将成为领导者的年轻人灌输一种\n________ 的意识。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "竞合作", "image": null}, {"key": "B", "text": "大协作", "image": null}, {"key": "C", "text": "协分工", "image": null}, {"key": "D", "text": "危团队", "image": null}], "answer": "A", "explanation": "句中的“还是应该”体现的是一种“反其道而行”的做法，由此可知，题干中前后两空应表示相反的意思。四个选项中，只有“竞争”与“合作”符合这一特点，故正确答案为A。 3 内部资免费交流 【知识点拨】本题干扰项为C。虽然“协作”与“分工”某种程度上也存在相反关系，但与“即将成为领导者的年轻人”相对应，显然强调“合作”意识比“分工”意识更有必要。", "material": null, "srcPage": 3, "imgN": 0, "f": []}, {"id": "yanyu-016", "module": "yanyu", "no": 16, "subType": "逻辑填空", "stem": "据说泰山是古代名匠鲁班的弟子，天资聪颖，心灵手巧，干活总是 ________，\n但往往耽误了鲁班的事，于是惹恼了鲁班，被撵出了“班门”。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "巧夺天工", "image": null}, {"key": "B", "text": "别出心裁", "image": null}, {"key": "C", "text": "尽善尽美", "image": null}, {"key": "D", "text": "任劳任怨", "image": null}], "answer": "B", "explanation": "泰山既然因“耽误了鲁班的事”而被逐出师门，那么他干活就不可能是“巧夺天工”、“任劳任怨”，排除A、D 两项。“尽善尽美”有追求完美之意，泰山有可能因凡事追求完美而误事，但不能与“天资聪颖，心灵手巧”相照应，而“别出心裁”很好的体现了这一含义。本题选B。 【知识点拨】巧夺天工：人工的精巧胜过天然，形容技艺精妙高超。别出心裁：另外想出与众不同的办法、主意。尽善尽美：形容事物达到完美无缺的地步。任劳任怨：指做事不辞劳苦、不怕别人埋怨。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "yanyu-017", "module": "yanyu", "no": 17, "subType": "逻辑填空", "stem": "《拾穗者》本来描写的是农村夏收劳动的一个极其 ________ 的场面，可是它在\n当时产生的艺术效果却远不是画家所能 ________ 的。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "热设想", "image": null}, {"key": "B", "text": "平意料", "image": null}, {"key": "C", "text": "火控制", "image": null}, {"key": "D", "text": "忙想象", "image": null}], "answer": "B", "explanation": "由句中的关联词“本来……可是……”可知，前后分句之间为转折关系。句意为：《拾穗者》这幅画在当时产生的艺术效果非常突出，但其描写的题材却又是农村夏收劳动再平常不过的场面。“热闹”、“火热”、“忙碌”均无法与这幅画的非凡艺术效果构成强烈反差。故第一空只能填“平凡”，即B 项。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "yanyu-018", "module": "yanyu", "no": 18, "subType": "逻辑填空", "stem": "去世 100 年后，挪威最伟大的文学家 ________ 是易卜生，他给挪威民族带来的\n荣誉，比别的任何挪威人都要多。然而，这个人生前从不 ________ 自己是挪威人，他是\n他自己的祖国和上帝。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "已知道", "image": null}, {"key": "B", "text": "始认为", "image": null}, {"key": "C", "text": "依承认", "image": null}, {"key": "D", "text": "公希望", "image": null}], "answer": "C", "explanation": "由第一句可知，易卜生确实是挪威人，而第二句说易卜生是“他自己的祖国”，显然他不认可自己挪威人的身份。由此可排除A、D 两项。“始终”表示在从头到尾这个时间段里持续不变；“依然”表示在某个时间点仍照往常保持不变。句中的“去世100 年后”指的是某个时间点，故应填“依然”，本题的正确答案为C。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "yanyu-019", "module": "yanyu", "no": 19, "subType": "逻辑填空", "stem": "美元贬值可以有效提高美国企业的国际竞争力，同时打击其他国家对美出口能\n力，而促使美元贬值的有效手段就是推高市场的原油价格，使人们对经济前景持\n________ 态度， ________ 美元下跌。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "
