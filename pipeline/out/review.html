A", "text": "悲带动", "image": null}, {"key": "B", "text": "观遏制", "image": null}, {"key": "C", "text": "怀阻止", "image": null}, {"key": "D", "text": "乐导致", "image": null}], "answer": "A", "explanation": "句中说的是“使美元贬值的有效手段”，故最后的落脚点应放在促使美元下跌上，B、C 的“遏制”、“阻止”恰与此相反，故可首先排除。另由经济常识可知，只有当人们对经济前景持悲观态度时，才会引起美元下跌。故本题应选A。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "yanyu-020", "module": "yanyu", "no": 20, "subType": "逻辑填空", "stem": "由于疏于 ________，院里的房屋大多十分陈旧，与旁边修建得簇新的正乙祠戏\n楼相比要 ________ 得多，不过在院中我们依稀还可以看到正乙祠当年的身影。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "修寒酸", "image": null}, {"key": "B", "text": "修逊色", "image": null}, {"key": "C", "text": "管破败", "image": null}, {"key": "D", "text": "维杂乱", "image": null}], "answer": "B", "explanation": "“修饰”不能与“房屋”搭配，故排除A。再看第二空，由“陈旧”、“簇新”可知，这里是新旧的对比，用“杂乱”形容不合适。排除D。“修葺”意为修缮，适用对象常为建筑物，与句中的“房屋”搭配恰合句意。本题答案选B。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "yanyu-021", "module": "yanyu", "no": 21, "subType": "逻辑填空", "stem": "发展与壮大文化产业，既要盯着市场做文章， ________ 文化生产部门的自我生\n存能力，最大限度地让文化产品增值；又不唯市场是从，一味 ________ 市场低层次需求，\n让那些格调不高的文化产品大行其道。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "扩限制", "image": null}, {"key": "B", "text": "维满足", "image": null}, {"key": "C", "text": "提降低", "image": null}, {"key": "D", "text": "增迎合", "image": null}], "answer": "D", "explanation": "“扩大”、“维护”与“能力”搭配不当，排除A、B。由“一味”、“低层次需求”、“格调不高”可知，第二空应该填一个带贬义的词，四个选项中只有“迎合”符合这一要求。故本题答案选D。 4 内部资免费交流 【知识点拨】“一味‘迎合’……需求”是一种惯用搭配，由此可直接锁定答案为D。", "material": null, "srcPage": 4, "imgN": 0, "f": []}, {"id": "yanyu-022", "module": "yanyu", "no": 22, "subType": "逻辑填空", "stem": "心理学家发现，手势和话语在交流时具有同样的丰富性，手和嘴 ________ 表达\n着说话人的意思。人们听故事时，如果在听到声音的同时能够看见讲故事人的手势，他\n们对故事理解的准确度要比 ________ 听到声音时增加 10。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "分单纯", "image": null}, {"key": "B", "text": "共单纯", "image": null}, {"key": "C", "text": "独单独", "image": null}, {"key": "D", "text": "一单独", "image": null}], "answer": "B", "explanation": "由第二句可知，文段强调的是手势和声音的相互配合在表达中的重要性，“分别”、“独立”、“一致”都没有体现出配合的意思，排除A、C、D，故本题的答案为B。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "yanyu-023", "module": "yanyu", "no": 23, "subType": "逻辑填空", "stem": "一方水土养一方人，一方人筑一方城。边地城市风貌的千姿百态，原本就是\n________ 的事情。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "水到渠成", "image": null}, {"key": "B", "text": "司空见惯", "image": null}, {"key": "C", "text": "顺其自然", "image": null}, {"key": "D", "text": "顺理成章", "image": null}], "answer": "D", "explanation": "句中是在分析边地城市风貌千姿百态的原因，由“一方水土养一方人，一方人筑一方城”可知，这种千姿百态风貌的形成是由各地不同的水土和人造成的，水土不同人不同，城市的风貌自然各异，这原本就是理所应当的事情。“顺理成章”比喻某种原因合乎逻辑或事理产生某种结果，填入句中意思相符，故当选。 【知识点拨】本题易误选A，“水到渠成”比喻时机成熟，事情自然会成功，多用于劝人不要急于求成，或说明某事的成功是因为客观条件成熟。这与“一方水土养一方人，一方人筑一方城”所表达的逻辑上的顺承关系不符，故排除司空见惯：形容某类事物或某种现象经常见到，不足为奇。顺其自然：指不刻意作为，任事情自然发展。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "yanyu-024", "module": "yanyu", "no": 24, "subType": "逻辑填空", "stem": "柏克和阿伦特等思想家把博爱和同情视为感伤主义，是滥情、不理智的表现，\n认为结果会 ________，达不到改善弱者境遇的效果。贫困等问题的解决还是要靠政治，\n而非部分人的善心。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "适得其反", "image": null}, {"key": "B", "text": "事与愿违", "image": null}, {"key": "C", "text": "南辕北辙", "image": null}, {"key": "D", "text": "雪上加霜", "image": null}], "answer": "B", "explanation": "题干只是说“达不到改善弱者境遇的效果”，但没有明确到底是什么样的效果，“适得其反”、“南辕北辙”都强调得到的是截然相反的结果，应排除；“雪上加霜”强调境遇进一步恶化，词义过重。正确答案为B。 【知识点拨】适得其反：恰恰得到与预期相反的结果。事与愿违：指事情没能按照预想的方向发展。南辕北辙：想往南而车子却向北行，比喻行动和目的正好相反。雪上加霜：比喻接连遭受灾难，苦上加苦。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "yanyu-025", "module": "yanyu", "no": 25, "subType": "逻辑填空", "stem": "我从不怀疑“城市车”概念的 ________ 性，因为这是全世界都需要的东西：干\n净、简洁、低能源消耗。我们不是在 ________ 让“城市车”概念成真，而是必须让它实\n现。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "超梦想", "image": null}, {"key": "B", "text": "可尝试", "image": null}, {"key": "C", "text": "实期待", "image": null}, {"key": "D", "text": "科努力", "image": null}], "answer": "B", "explanation": "本题的突破点在第一空，这里应填一个表示“城市车”概念性质的词语。“超前性”意为超越目前正常条件的，即具有未来性、预见性，由“全世界都需要”并不能推出概念很超前，排除A。“科学性”意为经得起推敲，符合客观规律，由“全世界都需要”并不能推出概念很科学，排除D。“实用性”意为有实际使用价值，一般针对的是具体事物，“城市车”作为一个概念不具有使用价值，只有当其实现以后才具有实用性，排除C 项。B 项的“可行性”意为行得通，可操作，因为全世界都需要，所以“可行”，B 项当选。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "yanyu-026", "module": "yanyu", "no": 26, "subType": "逻辑填空", "stem": "互联网并非 ________、整齐划一的技术革命的产物，而是在各种混乱、争论和\n复杂的利益纠葛中发展成今天的规模和影响力。正是一个小小的草根网络，最终汇集成\n一个 ________ 的大潮流。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "一呼百铺天盖地", "image": null}, {"key": "B", "text": "自上而不可逆转", "image": null}, {"key": "C", "text": "有条不举世瞩目", "image": null}, {"key": "D", "text": "运筹帷波涛汹涌", "image": null}], "answer": "B", "explanation": "第一空中的成语应能与“整齐划一”连用，“整齐划一”表示步调的一致性，这一点与后文的“在各种混乱、争论和复杂的利益纠葛中发展成今天 5 内部资免费交的规模和影响力”相对应。再由后文的“小小的草根网络”可知，互联网的发展是从底层起步的，B 项的（并非）“自上而下”恰当地表明了互联网的这种发展方向上的特点。“并非自上而下、整齐划一”，两词连用也完整地表达了互联网发展的特点，第二空中“不可逆转”修饰“大潮流”也符合句意，本题选B。 【知识点拨】一呼百应：形容响应的人很多。有条不紊：形容有条有理，一点不乱。运筹帷幄：常指在后方决定作战方案，也泛指主持大计，考虑决策。", "material": null, "srcPage": 5, "imgN": 0, "f": []}, {"id": "yanyu-027", "module": "yanyu", "no": 27, "subType": "逻辑填空", "stem": "如果我们继续让市场决定命运，让政府在稀缺的石油和食品上互相 ________，\n资源将会成为全球经济增长的瓶颈。但如果世界各国在研究、开发以及传播节能技术和\n可再生能源上进行 ________，快速的经济增长就有可能成为现实。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "争支持", "image": null}, {"key": "B", "text": "制分工", "image": null}, {"key": "C", "text": "竞合作", "image": null}, {"key": "D", "text": "抵改革", "image": null}], "answer": "C", "explanation": "本题中两句之间存在转折关系，故两空应为表意相反的词。符合这一要求的唯有“竞争”与“合作”，故选C。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "yanyu-028", "module": "yanyu", "no": 28, "subType": "逻辑填空", "stem": "实践表明， ________ 良善的制度设计，住房保障已不再是政府的财政包袱，相\n反，它还是经济增长的 ________。住房保障本身已表现出一种强大的可持续的生命力，\n并成为能够产生稳定回报的投资品。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "基机遇", "image": null}, {"key": "B", "text": "出动力", "image": null}, {"key": "C", "text": "由前提", "image": null}, {"key": "D", "text": "鉴表现", "image": null}], "answer": "A", "explanation": "先看第二空，由“相反”可知，这里所填的词语应是“包袱”的反义词，据此排除C、D 项。“基于”意为由于，表示原因；“出于”表示动机，适用对象为人。由“良善的制度设计”可知，这里不是强调人的动机，故排除B 项，本题选A。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "yanyu-029", "module": "yanyu", "no": 29, "subType": "逻辑填空", "stem": "作家、出版社、图书零售商依然依靠传统的纸质书利润分成系统获取各自最主\n要的收入，网络盗版被视为 ________ 这一系统利益的首害。 2000 年曾 ________ 于电子\n出版的许多出版社后来都放缓了推出电子化新书的脚步，主要原因便是担心这样会加快\n网络盗版的速度，减少图书的销售量。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "冲争先恐后", "image": null}, {"key": "B", "text": "侵跃跃欲试", "image": null}, {"key": "C", "text": "破摩拳擦掌", "image": null}, {"key": "D", "text": "分踌躇满志", "image": null}], "answer": "B", "explanation": "从第二空入手，由句中表示时间先后的词语“曾”、“后来”可知，该空所填词语应与句中“放缓了脚步”的意思相反，故此处应填表示“急切”意义的词语，由此排除D。再看第一空，“侵蚀”有“暗中一点一点地侵占”之意，契合“网络盗版”的特征。故本题的正确答案为B。 【知识点拨】摩拳擦掌：形容战斗或劳动之前，人们精神振奋，跃跃欲试的样子。踌躇满志：形容心满意足，从容得意的样子。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "yanyu-030", "module": "yanyu", "no": 30, "subType": "逻辑填空", "stem": "什么是人才，可谓 ________。在全球化和信息化时代，人才应该具备的几点基\n本素质倒是 ________ 的。很多大企业认为，引领未来企业发展的，也是企业最缺乏的人\n才必须具备三大条件：领导才能、谈判能力和全球思维。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "众说纷统一", "image": null}, {"key": "B", "text": "莫衷一固定", "image": null}, {"key": "C", "text": "见仁见共通", "image": null}, {"key": "D", "text": "因人而公认", "image": null}], "answer": "C", "explanation": "第二空前后是解说关系，注意是“很多大企业”而非“所有人”形成了共识，故这里用“统一”、“固定”、“公认”都太绝对，“共通”强调通行或适用于各个领域，程度灵活，综合当选C。 【知识点拨】众说纷纭：人多嘴杂，各有各的说法，议论纷纷。莫衷一是：不能断定哪个对，哪个不对，也指意见纷纭，分歧很大，不能得出一致的结论。见仁见智：对同一个问题，不同的人从不同的立场或角度有不同的看法。因人而异：因人的不同而有所差异。", "material": null, "srcPage": 6, "imgN": 0, "f": []}, {"id": "yanyu-031", "module": "yanyu", "no": 31, "subType": "逻辑填空", "stem": "看过许多名人访谈，他们无不谈到过去某段时期的迷茫与困惑、低潮与失败。\n彼时，如果他们向命运低头，他们就是失败者。只有冷静下来，摆正心态，才有 ________、\n赢取辉煌的可能。可见，平日的积累与锻炼固然重要，但关键时刻的 ________ 与爆发力\n却能成就一个真正的王者。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "背水一表现", "image": null}, {"key": "B", "text": "反败为勇气", "image": null}, {"key": "C", "text": "逆水行速度", "image": null}, {"key": "D", "text": "反戈一突破", "image": null}], "answer": "B", "explanation": "由语境可知，“________、赢取辉煌”表达的是在逆境中取得胜利。“逆水行舟”一般与“不进则退”连用，比喻不努力就要后退。“反戈一击”意为掉转武器向自己所属阵营进行攻击，比喻恩将仇报陷害自己的朋友或盟友的行为。 6 内部资免费交由词义排除C、D。第二空中，与“爆发力”相对应，这里也应填入一个表示人的素质的词语，“勇气”符合句意。本题选B。 【知识点拨】背水一战：比喻在艰难情况下跟敌人决一死战。反败为胜：扭转败局，变为胜利。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "yanyu-032", "module": "yanyu", "no": 32, "subType": "逻辑填空", "stem": "一场惨痛的飞机失事，使海外游学夏令营成为舆情关注的焦点，也使游学乱象\n集中地暴露出来。本应以促进学习、增长见识、开阔眼界为目的的学生活动，却正在逐\n渐演变成各种盈利机构追逐利润的功利行为，而且，越来越有低龄化、贵族化、商业化\n趋势。可是，如果因此紧急叫停各种暑期学生夏令营活动，那就是 ________ 的“懒政”\n思维了。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "亡羊补牢", "image": null}, {"key": "B", "text": "矫枉过正", "image": null}, {"key": "C", "text": "因噎废食", "image": null}, {"key": "D", "text": "不思进取", "image": null}], "answer": "C", "explanation": "“亡羊补牢”比喻出了问题以后想办法补救，可以防止继续受损失；“矫枉过正”比喻纠正错误超过了应有的限度；“因噎废食”比喻要做的事情由于出了点小毛病或怕出问题就索性不去干；“不思进取”指不想努力上进，无所作为。文段批判的是因为海外夏令营出了问题就一刀切地叫停所有暑期夏令营活动的“懒政”思维，“因噎废食”符合句意。本题选C。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "yanyu-033", "module": "yanyu", "no": 33, "subType": "逻辑填空", "stem": "中国制造业超越美国指日可待，中国 GDP 超越美国也将在这一代中国人的有生\n之年变为现实。这两个超越凝聚了几代中国人的奋斗，当然意义巨大。但过分陶醉，就\n会变自信为自大，进而 ________。毕竟，物质产出只是硬实力，历史上，船坚炮利的国\n家甚多，基业长青的却少有， ________ 更多在“软实力”而不在“硬实力”。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "妄自尊关键", "image": null}, {"key": "B", "text": "忘乎所秘密", "image": null}, {"key": "C", "text": "目中无原因", "image": null}, {"key": "D", "text": "趾高气秘诀", "image": null}], "answer": "B", "explanation": "第一空，由“进而”可知，横线部分的含义应比“自大”更进一步，“妄自尊大”、“趾高气扬”与“自大”同义，排除A、D。第二空，“原因”与“在……”搭配不当，排除C。因此本题答案为B。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "yanyu-034", "module": "yanyu", "no": 34, "subType": "逻辑填空", "stem": "目前，美国和西方各国深陷 2008 年以来的世界经济萧条中，复苏 ________；另\n一方面，中国、印度等金砖国家又呈现出经济增速下行的征兆。在此世界经济格局下，\n重温哈耶克与凯恩斯之间有关货币、利息、信用、资本形成和商业周期发生机理的大论\n战，重新 ________ 人类进入现代社会后经济危机发生的深层原因和复苏机理，不但具有\n经济学说史上的理论意义，也显然有着极强的、切实的和巨大的当下意义。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "遥遥无反思", "image": null}, {"key": "B", "text": "步履维认识", "image": null}, {"key": "C", "text": "旷日持审视", "image": null}, {"key": "D", "text": "进退维探讨", "image": null}], "answer": "B", "explanation": "由“深陷2008 年以来的世界经济萧条中”可知，第一空只能表示复苏遥远或艰难，排除C、D。第二空，“反思”的对象应是过去的事，与“复苏机理”搭配不当，排除A。本题选B。", "material": null, "srcPage": 7, "imgN": 0, "f": []}, {"id": "yanyu-035", "module": "yanyu", "no": 35, "subType": "逻辑填空", "stem": "赵景深在《文心剪影》里说：“他（叶圣陶）的复信措辞谦抑，字迹圆润丰满，\n正显出他那 ________ 而又诚实的心。”正如当年他主编《小说月报》曾精心培育了一大\n批后来成为新文学史上的著名作家时那样，他那 ________ 的精神和工作态度，给予年轻\n一代的教育、鼓舞的力量是无法 ________ 的。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "谦兢兢业估价", "image": null}, {"key": "B", "text": "谦公而忘估量", "image": null}, {"key": "C", "text": "正大公无衡量", "image": null}, {"key": "D", "text": "率孜孜以想象", "image": null}], "answer": "B", "explanation": "第一空所填词语对应于前句的“措辞谦抑”，排除不含“谦”义的C、D 项。第三空，句中说的是给予年轻一代的教育、鼓舞的力量很大，即无法估量，排除A。本题选B。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "yanyu-036", "module": "yanyu", "no": 36, "subType": "逻辑填空", "stem": "要最大程度地 ________ 网络谣言，一方面要依赖法制力量，另一方面也需要网\n民尤其是所谓“网络大 V” ________ 高度理性和负责的精神。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "消秉持", "image": null}, {"key": "B", "text": "去把持", "image": null}, {"key": "C", "text": "根维持", "image": null}, {"key": "D", "text": "清操持", "image": null}], "answer": "A", "explanation": "本题从第二空入手，“把持”、“维持”、“操持”与“精神”均不搭配，排除B、C、D。第一空填“消除”也符合句意。故本题答案为A。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "yanyu-037", "module": "yanyu", "no": 37, "subType": "逻辑填空", "stem": "人们享受着科学给生活带来新奇和益处的同时，也开始关注科学存在的风险及\n其对社会的影响。未来，投入市场的纳米技术创新将在清洁能源、纳米医学等领域有所\n建树，而这一全新领域的 ________ 风险和二次影响也不可忽视，科学家们正在进行纳米\n技术前景分析并将设计更好的评估方法，以 ________ 的态度展望未来。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "潜审慎", "image": null}, {"key": "B", "text": "潜慎重", "image": null}, {"key": "C", "text": "隐克制", "image": null}, {"key": "D", "text": "既谨慎", "image": null}], "answer": "A", "explanation": "第一空，文段说的是纳米技术在未来的影响，故这些影响尚未发生，“既有”不合文意，排除D。第二空，纳米技术可以带来好的影响，故“克制”程度过重，排除C。“审慎”包含“慎重”的意思，且“审”与“科学家们正在进行纳米技术前景分析并将设计更好的评估方法”对应。故本题答案为A。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "yanyu-038", "module": "yanyu", "no": 38, "subType": "逻辑填空", "stem": "真正的批评，总是建立在对等的基础之上，只有修养与 ________ 对等的人的批\n评，才值得 ________ 和理会。至于无边无际的谩骂，除了 ________ 之外，没有任何意义。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "才关气急败坏", "image": null}, {"key": "B", "text": "学关自我贬低", "image": null}, {"key": "C", "text": "才注贻笑大方", "image": null}, {"key": "D", "text": "知注自娱自乐", "image": null}], "answer": "B", "explanation": "先看第二空，此处的主语为“批评”，“注目”和“注视”均不能与“批评”搭配，由此排除C、D。再看第三空，与前面的“对等”相呼应，此处用“自我贬低”更恰当。故本题选B。", "material": null, "srcPage": 8, "imgN": 0, "f": []}, {"id": "yanyu-039", "module": "yanyu", "no": 39, "subType": "逻辑填空", "stem": "随着劳动年龄人口进入负增长，人口红利终究要消失，经济增长从过去的高速\n转为相对低速的常态也是不可避免的。生育政策调整也不能在短期内 ________ 人口红\n利。不过， ________ 地调整生育政策，对于未来中国人口均衡发展 ________ 长期潜在增\n长率，仍然可以产生积极的效果。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "带高瞻远甚至", "image": null}, {"key": "B", "text": "增恰如其以及", "image": null}, {"key": "C", "text": "逆未雨绸乃至", "image": null}, {"key": "D", "text": "恢不失时抑或", "image": null}], "answer": "C", "explanation": "本题从第三空入手，“未来中国人口均衡发展”与“长期潜在增长率”为递进关系，故排除表并列的B 和表选择的D 项。再看第一空，“逆转” 7 内部资免费交指向相反的方向转化。由“人口红利终究要消失，经济增长从过去的高速转化为相对低速的常态也是不可避免的”、“生育政策调整也不可能在短期内……人口红利”可知，生育政策调整无法改变人口红利逐渐消失的趋势，故选“逆转”比“带来”更恰当。故本题答案为C。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "yanyu-040", "module": "yanyu", "no": 40, "subType": "逻辑填空", "stem": "关于如何有效解释两次世界大战的起源和暴行产生的机制，战争史家一直感到\n________。他们发现，当落实到细节研究上时，常常 ________ 迭出。譬如马克思主义史\n家认为经济压力是大战的动因，但历史事实却是二战爆发在欧洲的经济上扬期，因此许\n多战争史家不得不有此共识：战争起源问题并非历史学专业所能解释。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "尴谬论", "image": null}, {"key": "B", "text": "困悖论", "image": null}, {"key": "C", "text": "犹矛盾", "image": null}, {"key": "D", "text": "沮误解", "image": null}], "answer": "B", "explanation": "“譬如”后内容是对第二空的解释。由“马克思主义史家认为经济压力是大战的动因，但历史事实却是二战爆发在欧洲的经济上扬期”可知，第二空所填词语应含相反、矛盾之意，排除A、D 项。第一空中，“困惑”指感到疑难，不知道该怎么办；“犹豫”指不果断，拿不定主意。对应末句“战争起源问题并非历史学专业所能解释”，选“困惑”更贴切。本题答案为B。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "yanyu-041", "module": "yanyu", "no": 41, "subType": "逻辑填空", "stem": "现在，很多保健品的广告做得很好，但消费者并不知道自己有没有必要吃这些\n东西。其实很多保健品在研发时并未做过 ________ 调查，并不知道哪种营养素是大家普\n遍缺乏的。服用未经这样的调查就开发出的保健品，对消费者来说完全是一种 ________。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "严误导", "image": null}, {"key": "B", "text": "科浪费", "image": null}, {"key": "C", "text": "跟欺骗", "image": null}, {"key": "D", "text": "实伤害", "image": null}], "answer": "B", "explanation": "第一空中，“实地”指事情发生或出现的地方，“实地调查”不适用于研发保健品之前所要做的营养素缺乏状况调查，排除D。第二空，与“不知道自己有没有必要吃这些东西”、“并不知道哪种营养素是大家普遍缺乏的”相照应，消费者服用实际并不缺乏的营养素应是一种“浪费”。本题答案为B。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "yanyu-042", "module": "yanyu", "no": 42, "subType": "逻辑填空", "stem": "以鸟类迁徙为话题的纪录片《迁徙的鸟》向我们完美展示了一个自然界的奇迹。\n虽然大部分地表已被人类改造得 ________，但在天空中，鸟儿仍是主角，无论雪鹅、野\n鸭还是云雀，都自有其尊严。“我们需要与自然界和平相处，因为人类不可能 ________\n地生活在这个地球上。”导演雅克·贝汉如是说。\n填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "面目全孤单", "image": null}, {"key": "B", "text": "支离破傲慢", "image": null}, {"key": "C", "text": "元气大自私", "image": null}, {"key": "D", "text": "体无完麻木", "image": null}], "answer": "A", "explanation": "本题可从第二空入手，由“我们需要与自然界和平相处，因为人类不可能地生活在这个地球上”可知，文段强调人要与自然万物共同生存，和谐相处，“孤单”符合文意。第一空填含贬义的“面目全非”也能表达出人类对大自然的破坏性改造的意思。本题答案为A。", "material": null, "srcPage": 9, "imgN": 0, "f": []}, {"id": "yanyu-043", "module": "yanyu", "no": 43, "subType": "逻辑填空", "stem": "读书时对感兴趣的东西深钻细研，无疑有助于我们更全面、系统、深入地了解\n这些东西。但不感兴趣的东西，有的也可能恰恰是我们所 ________ 的。这不仅因为兴趣\n本身有一定的局限性，而且因为在特定领域浸染日久，往往会 ________ 这种兴趣，形成\n越不感兴趣越排斥的恶性循环，导致短板更短。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "需泛化", "image": null}, {"key": "B", "text": "忽僵化", "image": null}, {"key": "C", "text": "欠固化", "image": null}, {"key": "D", "text": "提弱化", "image": null}], "answer": "C", "explanation": "本题主要从第二空解题。由“形成越不感兴趣越排斥的恶性循环”可知，在特定领域浸染久了后会强化这种兴趣，A 项“泛化”、D 项“弱化”都与句意不符，排除。“僵化”一般与“思想”搭配，与“兴趣”不搭配，排除B。C 项“固化”符合句意，第一空填“欠缺”也能与后文“短板更短”照应。故答案为C。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "yanyu-044", "module": "yanyu", "no": 44, "subType": "逻辑填空", "stem": "当人类社会进入到信息时代，曾有人 ________，计算机是方块汉字的掘墓人。\n然而，事实 ________ 了对汉字的这些偏见和悲观论调。据统计，现在已有 1000 多种汉\n字输入法，无论从速度还是准确率上看，方块汉字的计算机输入丝毫不逊色于拼音文字。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "宣打破", "image": null}, {"key": "B", "text": "断粉碎", "image": null}, {"key": "C", "text": "妄驳斥", "image": null}, {"key": "D", "text": "预批判", "image": null}], "answer": "B", "explanation": "“宣称”指公开表示。一般用于说话者公开表示自己怎么样或要做什么。与句子语境不符，排除A。“妄言”指胡说，随便说说。不合句意，排除C。第二空，“批判”与空缺前的“事实”不搭配，且由“无论……还是……丝毫不逊色”可知，选语义较重的“粉碎”更契合句子语境。故本题答案为B。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "yanyu-045", "module": "yanyu", "no": 45, "subType": "逻辑填空", "stem": "在早已对漂亮假花、假树司空见惯的现代人眼里，干枯苍白的植物标本或许难\n有多少魅力可言。但在标本馆中，每一份看似不起眼的植物标本都代表着它在地球上的\n________。它们虽然远离了阳光雨露，告别了生长的土地，却在科学殿堂中 ________\n了自己的生命。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "物证明", "image": null}, {"key": "B", "text": "经重现", "image": null}, {"key": "C", "text": "存超越", "image": null}, {"key": "D", "text": "同延续", "image": null}], "answer": "D", "explanation": "第一空，从常识来看，植物标本代表的只能是这类植物，不能代表它在地球上的“经历”，排除B。第二空，“证明”与“生命”不搭配，排除A。植物标本“超越了自己的生命”的说法也欠妥，排除C。“它们虽然远离了阳光雨露， 8 内部资免费交告别了生长的土地”表示作为标本的植物已经没有了生命，故说它们在科学的殿堂中“延续”了自己的生命，契合句意。故答案为D。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "yanyu-046", "module": "yanyu", "no": 46, "subType": "逻辑填空", "stem": "历史反复昭示我们，向海而兴，背海而衰，是一条 ________ 的铁律。中华民族\n要实现伟大复兴，必须 ________ 地走向海洋、经略海洋，坚定不移地走以海富国、以海\n强国的和平发展之路。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "亘古不义无反顾", "image": null}, {"key": "B", "text": "一成不勇往直前", "image": null}, {"key": "C", "text": "原封不理直气壮", "image": null}, {"key": "D", "text": "颠扑不昂首阔步", "image": null}], "answer": "A", "explanation": "句意为“向海而兴，背海而衰”是一条不变的发展规律，“一成不变”指守旧不变或固守陈法。含贬义，与句意不符，排除B。“原封不动”与“铁律”不搭配，排除C。第二空，对应“必须”、“坚定不移”可知，选语气较重的“义无反顾”比“昂首阔步”更恰当。故本题答案为A。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "yanyu-047", "module": "yanyu", "no": 47, "subType": "逻辑填空", "stem": "治理环境确为政府职责，环境出现问题，其监管 ________、执法不严难逃其责。\n但是，当大家不断 ________ 政府不作为时，是不是也应该 ________ 一下自己：我们有没\n有污染环境？\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "不谴检察", "image": null}, {"key": "B", "text": "不斥检查", "image": null}, {"key": "C", "text": "不苛检点", "image": null}, {"key": "D", "text": "不指检讨", "image": null}], "answer": "D", "explanation": "本题可从固定搭配角度入手，迅速得出答案。“监管不力”、“检讨自己”为常见搭配，由此即可得答案D。", "material": null, "srcPage": 10, "imgN": 0, "f": []}, {"id": "yanyu-048", "module": "yanyu", "no": 48, "subType": "逻辑填空", "stem": "对很多作家来说，最 ________ 的文字，几乎都是源自早年的乡土经验。因为一\n进入旧时的场景，就温暖，就自在，就身心通泰， ________，有如神助。相反，那些凭\n空想象的创作，虽然 ________，用尽心力，还是拘涩凝滞，不能自由伸展。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "成洋洋洒精雕细琢", "image": null}, {"key": "B", "text": "得下笔成绞尽脑汁", "image": null}, {"key": "C", "text": "原文思泉处心积虑", "image": null}, {"key": "D", "text": "珍妙语连费尽心机", "image": null}], "answer": "B", "explanation": "此题由第三空入手，第三空的词语应和“用尽心力”形成并举呼应，感情色彩应该一致，“处心积虑”和“费尽心机”均为贬义词，排除C、D。第二空的主语应与“就温暖，就自在，就身心通泰”的主语一致，都为作家，而“洋洋洒洒”的主语一般为文章或谈话，由此排除A。故本题答案为B。", "material": null, "srcPage": 11, "imgN": 0, "f": []}, {"id": "yanyu-049", "module": "yanyu", "no": 49, "subType": "逻辑填空", "stem": "①谁也不能以任何理由 ________ 赡养父母的义务。\n②要合法经营，不能靠搞歪门邪道来 ________。\n③咱们认真 ________ 一下这件事该怎么办。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "推盈合计", "image": null}, {"key": "B", "text": "推营核计", "image": null}, {"key": "C", "text": "推盈核计", "image": null}, {"key": "D", "text": "推营合计", "image": null}], "answer": "D", "explanation": "“推托”指借故拒绝或推辞（对象多为别人请求的事情）。“推脱”指推卸（多与责任搭配）。结合句意，“推脱”与“义务”搭配更恰当，排除A、B。“盈利”指收支相减之后的利润。“营利”指谋取利润。结合前文的“歪门邪道”可推断，用“营利”更恰当。故本题答案为D。", "material": null, "srcPage": 11, "imgN": 0, "f": []}, {"id": "yanyu-050", "module": "yanyu", "no": 50, "subType": "逻辑填空", "stem": "①比起秋天的枫林来，夏天的枫林没有那么撩人的红韵，但那生机盎然的绿，\n________ 着的却是一股青春的朝气。\n②推进黄河三角洲高效生态经济发展，有利于实现开发建设与生态保护的有机统\n一，有利于 ________ 经济结构，创造高效生态经济发展新模式。\n③我们相隔的不是几小时的车程，而是一整块大陆，就像歌里所唱的，用我的晚安\n陪你吃早餐，但是 ________ 也隔不断彼此的思念。\n依次填入画横线部分最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "萌调地久天长", "image": null}, {"key": "B", "text": "涌调山长水远", "image": null}, {"key": "C", "text": "萌调山长水远", "image": null}, {"key": "D", "text": "涌调地久天长", "image": null}], "answer": "B", "explanation": "“涌动”指像水一样冒出来，涌出。“萌动”指新生命的开始或者新事物刚刚出现，有时也指有新的思想或者心理活动。“青春的朝气”用“涌动”更贴切，排除A、C。第三空，由“一整块大陆”可知，两人之间是空间的距离远，用“山长水远”更合适。且“调整”与“经济结构”为固定搭配。本题答案为B。", "material": null, "srcPage": 11, "imgN": 0, "f": []}, {"id": "yanyu-051", "module": "yanyu", "no": 51, "subType": "片段阅读", "stem": "有一种很流行的观点，即认为中国古典美学注重美与善的统一。言下之意则是\n中国古典美学不那么重视美与真的统一。笔者认为，中国古典美学比西方美学更看重美\n与真的统一。它不仅给美赋予善的品格，而且真的品格大大高于善的品格。概而言之，\n中国古典美学在对美的认识上，是以善为灵魂而以真为最高境界的。\n通过这段文字我们可以知道，作者的观点：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "正确而不流行", "image": null}, {"key": "B", "text": "流行而不正确", "image": null}, {"key": "C", "text": "新颖而不流行", "image": null}, {"key": "D", "text": "流行而不新颖", "image": null}], "answer": "C", "explanation": "这是一个典型的在理解文意的基础上对观点进行评价判断的题型。显然这段文字没有对材料中体现的两种观点进行对与错的评价，因而，所有有关“正确”的答案都是不能选择的，所以排除A、B；另外，第一句话指出很流行的观点是“美与善的统一”，所以作者的观点“美与真的统一”就肯定不是流行的，D 应被排除，因此正确答案为C。", "material": null, "srcPage": 12, "imgN": 0, "f": []}, {"id": "yanyu-052", "module": "yanyu", "no": 52, "subType": "片段阅读", "stem": "气味分子又是如何转化为嗅觉信号传递到大脑的呢？美国科学家理查德·阿克\n塞尔和琳达·巴克发现，当气味分子与嗅觉受体结合后，作为化学信号的气味分子经过\n属于 CTP、结合蛋白（通称 C 蛋白）的嗅觉受体的复杂作用，转变为电信号后，便沿\n着嗅觉神经开始一场接力跑。这些信号先从鼻腔进入颅内，最后被传至大脑嗅觉皮层某\n些精细区域，在那里它们被翻译成特定的嗅觉信息，即被人们感知。这就是阿克塞尔和\n巴克为我们描述的完整的嗅觉信号通路理论。\n下列对阿克塞尔和巴克的嗅觉信号通路理论理解错误的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "气味分子在属于 C 蛋白的嗅觉受体的作用下从化学信号转变成为电信号", "image": null}, {"key": "B", "text": "嗅觉信号通路的末端是大脑嗅觉皮层中的某些精细区域", "image": null}, {"key": "C", "text": "嗅觉信号通路理论阐述的是气味分子转化为嗅觉信号传递到大脑的过程", "image": null}, {"key": "D", "text": "作为化学信号的气味分子到达大脑嗅觉皮层某些精细区域被翻译成嗅觉信息", "image": null}], "answer": "D", "explanation": "根据文段叙述，作为化学信号的气味分子是转变为电信号后才传至大脑的，所以D 项说“气味分子到达大脑嗅觉皮层被翻译成嗅觉信息”是错误的。由“作为化学信号的气味分子经过属于CＴＰ、结合蛋白（通称C 蛋白）的嗅觉受体的复杂作用，转变为电信号后”推出A 项正确。由“最后被传至大脑嗅觉皮层某 9 内部资免费交些精细区域”推出B 项正确。C 项是对嗅觉通路理论的概括，符合文意，正确。所以应选D。", "material": null, "srcPage": 12, "imgN": 0, "f": []}, {"id": "yanyu-053", "module": "yanyu", "no": 53, "subType": "片段阅读", "stem": "中国戏剧，可用三句话综括指出其特点，即是：动作舞蹈化，语言音乐化，布\n景图案化。此三者之配合，可谓是人生之艺术化。王国维《人间词话》中说，文学不应\n有隔。但从中国戏剧来说，正是相反。中国戏剧之长处，正在其与真实人生有隔。西方\n戏剧求逼真，说白动作，完全要逼近真，要使戏剧与人生间不隔。但中国戏剧则只是游\n戏三味。即如绘画，西方也求逼真，要写实，因此连阴影也画上。中国画则是抽离现实，\n得其大意，重要在神韵，在意境，始是上乘作品。中国人作画也称“戏笔”，便是这意\n义。中国京剧亦如作画般，亦要抽离不逼真，至少在这点上，中国京剧已是获得了中国\n艺术共同精神主要之所在。\n能说明“中国艺术共同精神”的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "与现实保持距离，重要在神韵，在意境", "image": null}, {"key": "B", "text": "教人轻松，教人解脱", "image": null}, {"key": "C", "text": "艺术与人生不应有隔", "image": null}, {"key": "D", "text": "把人生事象来绘画化、舞蹈化和音乐化", "image": null}], "answer": "A", "explanation": "“中国画则是抽离现实，得其大意，重要在神韵，在意境，始是上乘作品。中国人作画也称‘戏笔’，便是这意义。中国京剧亦如作画般，亦要抽离不逼真，至少在这点上，中国京剧已是获得了中国艺术共同精神主要之所在。”从这段话可知，中国艺术的共同精神在于与现实保持距离，重要在神韵，在意境。B 项与文段无关，C 项是西方戏剧的特点，D 项是中国戏剧的特点，均不是中国艺术共同精神。所以选A。", "material": null, "srcPage": 12, "imgN": 0, "f": []}, {"id": "yanyu-054", "module": "yanyu", "no": 54, "subType": "片段阅读", "stem": "使人类学缓慢成长的另一个重要因素是，欧洲人只是逐渐认识到，在所有这些\n差异的掩饰下，他们可能与任何地方的人共享基本的“人性”。不与欧洲人共享基本文\n化价值的社会被贴上“未开化的”或“野蛮的”标签。直到 18 世纪中叶，相当多的欧\n洲人才开始认为这类人的行为与对他们自身的理解是完全相关的。这样一个时代到来\n了：人们越来越努力根据自然法来解释事情，对以权威文本为根据的传统解释表示怀疑，\n对人类多样性的兴趣日渐浓厚。\n下面对“人类多样性”理解最恰当的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "不同民族的文化差异及其在年龄、性别、性格等方面的不同", "image": null}, {"key": "B", "text": "人类的不同起源和人们对不同民族、不同文化的独特看法", "image": null}, {"key": "C", "text": "民风习俗的差异和对“未开化的”或“野蛮的”民族的认同", "image": null}, {"key": "D", "text": "不同的民族在文化价值观念上的差异及其独特的行为方式", "image": null}], "answer": "D", "explanation": "文段主要介绍欧洲人对人类多样性的认识及接受过程。A 项文段中没有提及，排除。B 项不符合文段的内容，排除。文段指出欧洲人承认人类多样性的存在，而不是认同“未开化”和“野蛮”的民族。C 项表述与文段内容不符。由此可知，人类多样性包括文化价值观念、行为方式，所以选D。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "yanyu-055", "module": "yanyu", "no": 55, "subType": "片段阅读", "stem": "大运河涉及黄河与长江这两个古代文化、文明的核心地区，连接着燕文化、齐\n鲁文化、吴越文化等中国历史上重要的文化区域，其沿岸是古代中国人口集中、文化遗\n址密集的地区。各个时代，大运河贯穿之地都留下了丰富的文化古迹，被誉为“古代文\n化长廊”，其文物价值与意义非同寻常。不仅如此，大运河在开凿的长度、年代上还创\n下了傲视环宇的纪录，特别是沿岸几十座城市有着独特的人文景观和民俗风韵，保存了\n极具特色的内河文化。但是，作为华夏先民智慧与创造力结晶的大运河，至今未被列入\n全国重点文物保护单位，也没有一部专门的法律法规肯定和保障它的历史地位。大运河\n的保护现状确实令人忧虑。除千百年来河堤决口、泥沙淤塞、水量匮乏等自然原因外，\n更有乱开支渠、截流用水、管理不善等人为因素。由于不少河段利用了天然的湖泊和自\n然河流，很多人认识不到大运河也是文化遗产或文物古迹；而出于局部利益考虑随意改\n拆遗存的现象时有发生，分省分段的管理体制也使大运河的保护无法形成综合性的全盘\n规划。\n下列表述，不符合原文意思的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "大运河实际上是连接中国古代几个重要文化区域的桥梁和纽带", "image": null}, {"key": "B", "text": "从开凿时间和规模上看，大运河是世界同类工程所无法企及的", "image": null}, {"key": "C", "text": "部分河段借用湖泊和河流，影响到大运河的文化遗产地位", "image": null}, {"key": "D", "text": "大运河的文物价值至今没有得到专门的法律法规的肯定和保护", "image": null}], "answer": "C", "explanation": "文段主要介绍了大运河重要的文化价值以及未得到重视和保护的现状。由第一句可知A 项符合原文意思。由“大运河在开凿的长度、年代上还创下了傲视环宇的纪录”可知B 项符合原文意思。由“至今未被列入全国重点文物保护单位，也没有一部专门的法律法规肯定和保障它的历史地位”可知D 项符合原文意思。原文讲到由于不少河段利用了天然的湖泊和自然河流，所以导致很多人“认识不到”大运河也是文化遗产或文物古迹，而不是“影响到大运河的文化遗产地位”，所以C 项不符合文意。", "material": null, "srcPage": 13, "imgN": 0, "f": []}, {"id": "yanyu-056", "module": "yanyu", "no": 56, "subType": "片段阅读", "stem": "夏天少数人为贪图凉爽，早餐以冷饮代替豆浆和牛奶，这种做法在短时间内不\n会对身体产生影响，但长期如此会伤害“胃气”。在早晨，身体各系统器官还未走出睡\n眠状态，过多食用冰冷的食物，会使体内各个系统出现挛缩及血流不顺的现象。所以早\n饭时应首先食用热稀饭、热豆浆等热食，然后再吃蔬菜、面包、水果和点心等。\n这段文字主要谈的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "夏天吃早餐的重要性", "image": null}, {"key": "B", "text": "夏天早餐喝冷饮的危害", "image": null}, {"key": "C", "text": "夏天早餐应吃什么食物", "image": null}, {"key": "D", "text": "夏天吃早餐的注意事项", "image": null}], "answer": "D", "explanation": "文段既强调了夏天早餐吃冷饮的不合理之处，又指出了合理的早餐内容。第一句指出夏天早餐吃冷饮会伤胃。第二句从医学上解释早餐吃冰冷食物对胃的危害。第三句是说吃早餐的食物顺序问题。A 项吃早餐的重要性在文段中没有体现。B 项只讲了文段的一个方面，排除。C 项的“夏天早餐应吃什么食物”，不如D项全面，并且文段重点不在“吃什么食物”上。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "yanyu-057", "module": "yanyu", "no": 57, "subType": "片段阅读", "stem": "19 世纪的一项重大发明导致制蜡业产生了革命性的变化，也使得照明成为了普\n通老百姓的现实。在 19 世纪的早期和中期，人类发现了利用碱和硫酸提炼动物脂的工\n艺，其产品硬脂比没有提炼的动物硬脂更加坚硬，燃烧时间也更长。这一发明创造意味\n着人类可以生产出点燃时无太多烟尘和太臭气体的脂蜡。\n下列关于 19 世纪人类发明了硬脂产品以后的各项说法中正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "蜡燃烧时没有太多烟尘", "image": null}, {"key": "B", "text": "蜡燃烧时散发出香味", "image": null}, {"key": "C", "text": "蜡没有达到普遍使用", "image": null}, {"key": "D", "text": "蜡燃烧时间不长", "image": null}], "answer": "A", "explanation": "由文段中“使得照明成为了普通老百姓的现实”可知蜡已经开始普遍使用，故排除C 项。由文段第二句话中“燃烧时间也更长”可以将D 项排除。根据末句“这一发明创造意味着人类可以生产出点燃时无太多烟尘和太臭气体的脂蜡”可知B 项说法错误，A 项正确。故本题正确答案为A。 10 内部资免费交流", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "yanyu-058", "module": "yanyu", "no": 58, "subType": "片段阅读", "stem": "中国的工业革命开始得相对较晚，其大部分效果在过去四十年中才显现出来。\n它对中国人与自然环境关系的影响，发生得肯定比其他任何地方都要快，而且可能比其\n他任何地方都要大。随着政治越来越稳定，大规模的发展、生产、消费、运输和废物处\n理已经改变了中国。\n上述文字透露出来的潜在的信息是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "中国工业改革的效果在较长时间内才能显现出来", "image": null}, {"key": "B", "text": "中国工业改革对中国的影响比其他任何地方都快", "image": null}, {"key": "C", "text": "中国工业革命后政治越来越稳定", "image": null}, {"key": "D", "text": "中国自然环境的发展前景和威胁", "image": null}], "answer": "D", "explanation": "首先理解题意，要求选出潜在的信息，B、C 可以在文段中找到相应的内容，由“其大部分效果在过去四十年中才显现出来”可推出A，所以也不是潜在的信息，排除。由最后一句“大规模的发展、生产、消费、运输和废物处理已经改变了中国”能得出作者的潜在意思是“中国自然环境的发展前景和威胁”，D 正确。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "yanyu-059", "module": "yanyu", "no": 59, "subType": "片段阅读", "stem": "定律具有普适性，不受文化、宗教、地域等因素的限制。壶如果没有底或者开\n口比其他部位开敞，我们就不认为这是传统意义上的壶。物理学定律决定了实用型工艺\n品的一般形式，“它们”具有一些基本的样式，其功能也只能在一定限度内有所变化。\n这里的“它们”是指：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "实用型工艺品", "image": null}, {"key": "B", "text": "物理学定律", "image": null}, {"key": "C", "text": "壶", "image": null}, {"key": "D", "text": "壶的底与开口", "image": null}], "answer": "A", "explanation": "“物理学定律决定了实用型工艺品的一般形式，‘它们’具有一些基本的样式”这句话中，前半句主要讲实用型工艺品，后半句中又提出了“它们”，根据语气连贯原则，“它们”应指“实用型工艺品”。因此，本题选A。", "material": null, "srcPage": 14, "imgN": 0, "f": []}, {"id": "yanyu-060", "module": "yanyu", "no": 60, "subType": "片段阅读", "stem": "解放初期，有一次毛泽东和周谷城谈话。毛泽东说：“失败是成功之母。”周\n谷城回答说：“成功也是失败之母。”毛泽东思索了一下说：“你讲得好。”\n上述文字所要强调的内容是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "戒骄戒躁", "image": null}, {"key": "B", "text": "毫不气馁", "image": null}, {"key": "C", "text": "忍辱负重", "image": null}, {"key": "D", "text": "持之以恒", "image": null}], "answer": "A", "explanation": "分析可知，文段重在强调两句话，即“失败是成功之母”和“成功也是失败之母”，前者说明成功来源于失败，应该吸取经验，而后者说明成功也是失败的来源，那么在成功后就不应该骄傲，即“戒骄戒躁”。因此本题选A。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "yanyu-061", "module": "yanyu", "no": 61, "subType": "片段阅读", "stem": "新时期以来，我国经济从一度濒于崩溃的边缘发展到总量跃至世界第四、进出\n口总额位居世界第三，人民生活从温饱不足发展到总体小康，农村贫困人口从两亿五千\n多万减少到两千多万。\n本段的主旨可概括为：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "我国取得了举世瞩目的成就", "image": null}, {"key": "B", "text": "我国的国际地位显著提升", "image": null}, {"key": "C", "text": "新时期我国经济工作的快速发展", "image": null}, {"key": "D", "text": "人民生活水平迅速提高", "image": null}], "answer": "C", "explanation": "文段中主要从“经济地位”和“人民生活”两个角度描述了我国经济发展现状。D 项只涉及“人民生活”，不够全面，排除。文段并没有体现“举世瞩目”的成就，排除A；文段中关于我国经济总量及进出口额发展状况的描述，并不足以说明“国际地位”显著提升，排除B。因此，本题选C。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "yanyu-062", "module": "yanyu", "no": 62, "subType": "片段阅读", "stem": "要加大技术研发的投入，通过深化国有企业改革，形成企业自主创新的机制，\n同时通过落实国家关于鼓励自主创新的各项政策措施，引导企业增加技术开发的投入。\n只有形成一批具有自主知识产权的核心技术，才能立于不败之地。\n上述文字阐述的主旨是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "提高自主创新能力", "image": null}, {"key": "B", "text": "加大技术研发的投入", "image": null}, {"key": "C", "text": "落实鼓励自主创新的各项政策", "image": null}, {"key": "D", "text": "形成具有自主知识产权的核心技术", "image": null}], "answer": "A", "explanation": "文段围绕“自主创新”展开，B、C 项的“加大投入”、“落实政策”都是提高自主创新能力的措施，故可首先排除。D 项是自主创新的结果，只有提高自主创新能力，才能形成具有自主知识产权的核心技术，从而最终立于不败之地。故本题选A。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "yanyu-063", "module": "yanyu", "no": 63, "subType": "片段阅读", "stem": "一件可能使人感到吃惊的事实是，目前不但世界粮食产量的增长速度超过了人\n口的增长速度，而且同世界上人均收入的增长速度相比，粮食增长速度也是较快的，甚\n至其他商品价格的增长速度也比不上粮食的增长速度。尽管如此，今天在全世界仍有很\n多人口得不到充足的粮食。据估计，由于缺粮而面临饥饿的人口有 3.4 到 7.3 亿之多，\n他们尤其集中在南亚和非洲撒哈拉以南的地区。\n这段文字想要说明的问题是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "世界粮食产量的增长速度超过了人口的增长速度", "image": null}, {"key": "B", "text": "尽管世界粮食生产充足，但仍有很多人口得不到充足的粮食", "image": null}, {"key": "C", "text": "其他产品价格的增长速度比不上粮食的增长速度", "image": null}, {"key": "D", "text": "因缺粮而面临饥饿的人口有 3.4 到 7.3 亿之多", "image": null}], "answer": "B", "explanation": "文段首先说明世界粮食产量的增长速度超过了人口的增长速度，接着用“尽管如此”作转折指出全世界仍有很多人得不到充足的粮食，并列举出面临饥饿的人口数据，由此可知，文段意在说明的问题是转折词之后的内容，故A、C 两项不是文段想要说明的问题，D 项是作为一个论据出现的，均可排除。本题正确答案为B。", "material": null, "srcPage": 15, "imgN": 0, "f": []}, {"id": "yanyu-064", "module": "yanyu", "no": 64, "subType": "片段阅读", "stem": "“亚健康”一词是从国外传过来的，“亚健康”在全世界发生率很高，它是由\n于心理社会环境的压力而造成人体的一种不适状态。近年来，“亚健康”在国内外的发\n生率逐渐增高，因此展开“亚健康”的研讨是有意义的。从字面来说，亚，就是次于。\n“亚健康”就是介于健康与疾病之间的状态。\n与这段文字意思不符合的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "“亚健康”在全世界发病率很高", "image": null}, {"key": "B", "text": "“亚健康”一词是从国外传过来的", "image": null}, {"key": "C", "text": "“亚健康”是由于心理社会环境的压力而造成人体的一种不适状态", "image": null}, {"key": "D", "text": "“亚健康”就是介于健康与疾病之间的状态", "image": null}], "answer": "A", "explanation": "由文段可知“亚健康”是“由于心理社会环境的压力而造成人体的一种不适状态”，它是一种状态，而并非是一种病，且文段所说是“‘亚健康’在全世界发生率很高”，故A 项中“发病率很高”是不正确的。其他三项都在文中有所体现，所以，本题选A。", "material": null, "srcPage": 16, "imgN": 0, "f": []}, {"id": "yanyu-065", "module": "yanyu", "no": 65, "subType": "片段阅读", "stem": "按照近代政治学理论观点，共和含义比较广泛，涵盖着民主概念。具体来说，\n共和国相对于君主国而言，凡是非君主制国家便是共和国，共和国在历史上分成贵族共\n和国和民主共和国。应当说，这种政治理论观点可能适用于近代国家情况，但不合乎古\n代政治观念。共和国概念源于古罗马，在西塞罗的著作中共和国基本上相同于城市国家，\n用来表示一种国家形态。\n对这段文字主题的概括正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "共和含义比较广泛，涵盖着民主概念", "image": null}, {"key": "B", "text": "共和国的概念在古今有所不同", "image": null}, {"key": "C", "text": "凡是非君主制国家便是共和国", "image": null}, {"key": "D", "text": "共和国在历史上分成贵族共和国和民主共和国", "image": null}], "answer": "B", "explanation": "“应当说，这种政治理论观点可能适用于近代国家情况，但不合乎古代政治观念”这句话将这段文字分成两部分，前一部分介绍了近代政治学理论 11 内部资免费交中共和国的概念，后一部分介绍了古代政治观念中共和国的概念，而这两个概念是有所不同的。所以，本题选择B。", "material": null, "srcPage": 16, "imgN": 0, "f": []}, {"id": "yanyu-066", "module": "yanyu", "no": 66, "subType": "片段阅读", "stem": "游泳是人体处于一个完全陌生的环境下进行的一项运动。人在陆地上的日常生\n活中所形成的走、跑、跳、投等习惯性的运动技能，由于活动环节、姿势、呼吸、动力\n等因素的改变，都不能在水中直接运用。因此，凡是初学游泳的人，不是先学某一个动\n作，而是先从熟悉水性这个环节开始，亲临水中了解水的浮力、压力、阻力，体验水中\n运动技能形成的感觉。消除怕水的恐惧心理，是学习游泳的入门关键。\n下列选项不符合文意的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "游泳是人体处于一个完全陌生的环境下进行的一项运动", "image": null}, {"key": "B", "text": "人在陆地上的运动技能可以直接在水中运用", "image": null}, {"key": "C", "text": "初学游泳的人先从熟悉水性开始", "image": null}, {"key": "D", "text": "消除怕水的恐惧心理，是学习游泳的入门关键", "image": null}], "answer": "B", "explanation": "“人在陆地上的日常生活中所形成的走、跑、跳、投等习惯性的运动技能，由于活动环节、姿势、呼吸、动力等因素的改变，都不能在水中直接运用”，这句话直接点明了人在陆地上的运动技能不能直接在水中运用，所以，B 项不符合文意。其他三项在文中均有说明。", "material": null, "srcPage": 16, "imgN": 0, "f": []}, {"id": "yanyu-067", "module": "yanyu", "no": 67, "subType": "片段阅读", "stem": "虽然帧扩展技能可以增加千兆位以太网的地理跨距，但是当大量传输短帧时会\n造成系统带宽浪费严重，大大降低了半双工模式下的传输性能，千兆位以太网采用帧突\n发技术解决了大量短帧传输所收起的传输性能下降的问题。帧突发技术可以使一个站点\n一次能连续发送多个帧，是千兆位以太网的一个可选功能。\n解决了千兆位以太网传输性能下降问题的一项技术是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "帧扩展技术", "image": null}, {"key": "B", "text": "半双工模式", "image": null}, {"key": "C", "text": "帧突发技术", "image": null}, {"key": "D", "text": "千兆位以太网的一个可选功能", "image": null}], "answer": "C", "explanation": "这段文字中“千兆位以太网采用帧突发技术解决了大量短帧传输所收起的传输性能下降的问题”直接说明了解决千兆位以太网传输性能下降问题的是“帧突发技术”，所以，本题选C。", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "yanyu-068", "module": "yanyu", "no": 68, "subType": "片段阅读", "stem": "中国对待西方文化的态度具有某种程度的暧昧性和矛盾性，对物质文化和科技\n文化一般比较乐于接受，而一旦涉及到精神文化层面时则常常比较踌躇，甚至是内在抵\n制。这构成中西文化互动的复杂性。物质文化和科技文化具有直接改善和提高人们生活\n水平的功能，同时和增强国力密不可分，而且科技文化又是一种带有普遍意义的文化，\n与人文文化的民族性和特殊性有极大不同。\n下列选项符合文意的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "中国对西方文化在精神层面较易接受", "image": null}, {"key": "B", "text": "中国对西方文化的物质层面常常比较踌躇，甚至是内在抑制", "image": null}, {"key": "C", "text": "中国对待西方文化的态度具有某种程度的暧昧性和矛盾性", "image": null}, {"key": "D", "text": "中西文化有很大差异，水火不容", "image": null}], "answer": "C", "explanation": "从“中国对待西方文化的态度具有某种程度的暧昧性和矛盾性，对物质文化和科技文化一般比较乐于接受，而一旦涉及到精神文化层面时则常常比较踌躇，甚至是内在抵制”这句话中我们就可以直接排除A、B、D，选择C。", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "yanyu-069", "module": "yanyu", "no": 69, "subType": "片段阅读", "stem": "要买铁炒锅，不要买不锈钢炒锅，因为不锈钢炒锅易糊锅，又不好清洗，而且\n化学结构复杂。大家知道，用不锈钢杯子泡的茶水就不好喝。据《食品与健康》杂志介\n绍，不要用不锈钢锅长期烹饪食物，也不要用不锈钢锅长期盛放油、酱、醋等食品，因\n为使用不当会释放对身体有害的物质，这些物质能与含有碱性的茶生成有毒、有害的氧\n化物。\n下列说法符合文意的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "不锈钢炒锅比铁锅好", "image": null}, {"key": "B", "text": "不锈钢炒锅可以长期盛放油、酱、醋等食品", "image": null}, {"key": "C", "text": "不锈钢炒锅可能会释放对人体有害的物质", "image": null}, {"key": "D", "text": "铁锅化学结构复杂，会释放对身体有害的物质", "image": null}], "answer": "C", "explanation": "“要买铁炒锅，不要买不锈钢炒锅，因为不锈钢炒锅易糊锅，又不好清洗，而且化学结构复杂”，通过这句话就可以排除A。“不要用不锈钢锅长期烹饪食物，也不要用不锈钢锅长期盛放油、酱、醋等食品，因为使用不当会释放对身体有害的物质”，通过这句话我们就可以排除B，选择C。D 项“化学结构复杂”的是不锈钢锅，而非铁锅，故排除。", "material": null, "srcPage": 17, "imgN": 0, "f": []}, {"id": "yanyu-070", "module": "yanyu", "no": 70, "subType": "片段阅读", "stem": "孔子是中国伟大的哲学家，对人的本性有着透彻的分析，对中国的历史发展产\n生过巨大的影响。孔子学说从汉代以来成为中国文化的主要支柱，统治着广大学者以至\n普通人民的思想。后梁孔子学说中最重要的信条是，每个人必须知道他或她在社会等级\n制度中所处的地位，必须固守而不能逾越。这就大大妨碍了人们的好奇心和创造力，也\n就限制了人对自己周围事物的自由探讨。\n这段文字所要表达的中心思想是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "孔子是中国伟大的哲学家", "image": null}, {"key": "B", "text": "孔子对人的本性等有着透彻的分析", "image": null}, {"key": "C", "text": "孔子让每个人必须知道他或她在社会等级制度中所处的地位", "image": null}, {"key": "D", "text": "孔子学说对后世影响巨大，同时也限制了人们的思想自由", "image": null}], "answer": "D", "explanation": "这段文字有两部分，文段的前两句话为第一部分，说明孔子学说对中国历史发展产生过影响；后两句为第二部分，说明孔子学说的信条有其局限性，对人们的思想具有消极的影响。综合来看，本题选D。其余三项只表达孔子学说的一个方面。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "yanyu-071", "module": "yanyu", "no": 71, "subType": "片段阅读", "stem": "中华人民共和国建立以后，国家没有设置独立审计机构，以会计检查取代了审\n计，一方面赋予会计人员以监督财政、财务收支的职权；另一方面实行由主管部门对所\n属单位进行不定期的会计检查，由财政、税务、银行等部门进行业务监督。但这些检查\n监督，既不能自行监督，也不能互相监督，更不能适应经济发展的需要。\n下列选项最接近上文叙述内容的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "没有审计机构就不能有效进行监督", "image": null}, {"key": "B", "text": "会计检查制度可以适应经济发展的需要", "image": null}, {"key": "C", "text": "中华人民共和国建立以后，国家就设置了独立的审计机构", "image": null}, {"key": "D", "text": "以会计检查取代审计可以实现自行监督", "image": null}], "answer": "A", "explanation": "通过这段文字第一句话“中华人民共和国建立以后，国家没有设置独立审计机构，以会计检查取代了审计”，排除C。从最后一句“但这些检查监督，既不能自行监督，也不能互相监督，更不能适应经济发展的需要”我们就可以排除B、D，故正确答案为A。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "yanyu-072", "module": "yanyu", "no": 72, "subType": "片段阅读", "stem": "孙子，齐国乐安（山东惠民）人，他的《孙子兵法》是世界上公认的最古老的\n军事理论著作。“善战”是他的军事思想的核心。他说：“善战者知智胜也，无智名，\n无勇功。”因为在他看来，真正的善战者所打的胜仗，绝不是那种杀人一千、自损八百\n的浴血苦战、拼死激战，而是“胜于易胜”——打的是好打易打之敌。“胜已败者”—\n—打的是已经处于失败地位之敌。\n这段文字所讲的孙子善战思想的核心是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "以小的代价赢得大的胜利", "image": null}, {"key": "B", "text": "“不战而屈人之兵”", "image": null}, {"key": "C", "text": "朴素的军事辩证法思想", "image": null}, {"key": "D", "text": "除了“全胜”之外，就是“破胜”", "image": null}], "answer": "A", "explanation": "分析文段可知，孙子善战思想的核心是：“胜于易胜”和“胜已败者”，即以小的代价赢得大的胜利。故选项A 为正确答案。选项D 中的“全胜”指的是通过政治手段即不流血的战争取得胜利，“破胜”指的是通过军事手段即流血的 12 内部资免费交战争取得胜利。文段主要阐述的是孙子关于“破胜”中的“善战”思想，没有提及“全胜”的问题。故选项D 应排除。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "yanyu-073", "module": "yanyu", "no": 73, "subType": "片段阅读", "stem": "现在，经常出国的中国人都明显感到一种巨大的落差：一边是中国经济越来越\n强大，一边是部分国人的人文形象和公众形象不断下跌。\n这段话想要表达的观点是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "不要妄自菲薄", "image": null}, {"key": "B", "text": "不要妄自尊大", "image": null}, {"key": "C", "text": "需要道德建设", "image": null}, {"key": "D", "text": "需要经济建设", "image": null}], "answer": "C", "explanation": "阅读文段可知，落差是指中国经济的强大和部分国人人文形象、公众形象的下跌。“妄自菲薄”是指过分看轻自己，形容自卑，与句意明显不符。中国经济的强大和国人人文形象、公众形象的下跌构不成必然的因果联系，所以选项B中“妄自尊大”也不合文意。文段主要是介绍了落差的事实，在物质文明建设取得巨大成就的同时，精神文明建设却出现了明显落后的局面，文段意在强调需加强精神文明建设，尤其需加强道德文明建设，所以正确答案为C。选项D 为无关项。", "material": null, "srcPage": 18, "imgN": 0, "f": []}, {"id": "yanyu-074", "module": "yanyu", "no": 74, "subType": "片段阅读", "stem": "医学专家宣布：他们经过临床实验发现，普通的感冒病毒可以杀死癌细胞。有\n多名自愿的患者在接受这项治疗后，身上的癌细胞都呈萎缩状。专家们指出，要运用基\n因工程的办法研究出能引进感冒的腺病毒有机体，让含有易变基因的癌细胞染上那个感\n冒。而这项新技术，估计每年可望挽救数十万名癌症病人的生命。\n上面文字传达的最重要的一条信息是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "目前，正在开展的用感冒病毒治疗癌症的试验取得了可喜的成果", "image": null}, {"key": "B", "text": "目前，癌细胞在感冒病毒作用下萎缩的这一事实引起医学界的重视", "image": null}, {"key": "C", "text": "今后，将日益广泛地推广用感冒病毒治疗癌症这一新方法", "image": null}, {"key": "D", "text": "今后要攻克运用基因工程让癌细胞染上感冒的新技术", "image": null}], "answer": "D", "explanation": "“专家们指出”后的内容为重点，强调的是新技术的研发，所以选D 项。A、B、C 三项都没有提到这项新技术，都不属于文中最重要的信息。", "material": null, "srcPage": 19, "imgN": 0, "f": []}, {"id": "yanyu-075", "module": "yanyu", "no": 75, "subType": "片段阅读", "stem": "尽管他后来步入了哲学上悲观主义的路途，但这和他的生活状况是不相干的，\n在现实世界中，他可以算是个幸运儿了。\n这段话的主要意思是说：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "尽管他的生活很不幸，但他在哲学上始终是幸运的", "image": null}, {"key": "B", "text": "他在现实世界中的幸运反而导致了他在哲学上的悲观主义", "image": null}, {"key": "C", "text": "他的生活景况虽然不佳，但在现实世界中依然是幸运的", "image": null}, {"key": "D", "text": "在现实世界中，他的命运还是不错的", "image": null}], "answer": "D", "explanation": "这句话的意思是：他在生活上是幸运的，在哲学上是悲观主义，二者没有关系。A 项“生活很不幸”与文段内容不符。B 项二者不具备因果关系。C 项的“生活景况不佳”与文段内容矛盾。文段中“但”后面表转折，现实生活状况与悲观相反，算是个幸运儿了，故此题应选D。", "material": null, "srcPage": 19, "imgN": 0, "f": []}, {"id": "yanyu-076", "module": "yanyu", "no": 76, "subType": "片段阅读", "stem": "千栏居是一种将房屋同桩柱架离地面的宫室形式。《新唐书·南平獠传》称：\n“山有毒草、沙风、蚣蛇，人楼居而上，君曰‘千栏’”。《说文》中的“泽中守\n草楼”它应是千栏形式。与其认为千栏居是巢居的演化，倒不如说千栏居就是巢居的一\n种较高级形式，并且与楼阁的起源有着密切关系，千栏居以下部架空的桩柱或“千栏”\n得名，但与上部房屋的结构形制并无确定关系，故就整座建筑而言，千栏居并不能算作\n一种结构类型。\n下列关于“千栏居”的表述正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "千栏居是巢居的一种较高级形式，属宫室演化过程中的一种建筑类型", "image": null}, {"key": "B", "text": "楼阁建筑应是居室向宫室演化过程中的高级阶段，它的起源就是千栏居", "image": null}, {"key": "C", "text": "千栏居不因上部房屋的结构形制取名，而是因为下部架空的桩柱或“千栏”得名", "image": null}, {"key": "D", "text": "就整座建筑而言，千栏居形制的建筑并不是一种房屋结构类型", "image": null}], "answer": "C", "explanation": "文段只是提到千栏居是一种“宫室形式”，并不能由此推出千栏居是宫室演化过程中的一种建筑类型，所以A 项不合题意。文段提到千栏居“与楼阁的起源有着密切关系”，并不能由此说明楼阁建筑的起源就是千栏居，所以B 项不合题意。文段指出就整座建筑而言，“千栏居”并不能算作一种结构类型，而不是D项的“千栏居形制的建筑”，属于偷换概念。", "material": null, "srcPage": 19, "imgN": 0, "f": []}, {"id": "yanyu-077", "module": "yanyu", "no": 77, "subType": "片段阅读", "stem": "与真菌、细菌、病毒、昆虫等生物相比，人可能更脆弱，作为一种对有害生物\n所向披靡的杀虫剂，溴甲烷对人的毒害也是显而易见的，它是一种强烈的神毒剂，可对\n人的皮肤、肺、肾脏和肝脏造成直接的损伤。中毒严重者可出现心脏衰竭、休克等症状，\n个别中毒者还会双目失明。经溴甲烷消毒后的土壤，有助于农作物的生长。然而，溴甲\n烷在杀灭病原菌的同时，也杀灭了土壤中一些对农作物生长有益的生物。而这些生物对\n于调节土壤的微生态、抑制病原菌的种群数量和改善土壤结构都是至关重要的。所以，\n经溴甲烷熏蒸处理后，土壤中的生物种类急剧减少，形成一种“生物真空”的临界状态。\n由于没有其他种类生物的竞争和牵制，农作物的病原菌势必大量繁殖、积累，这就影响\n了农作物的正常生长；反过来，又不得不加大溴甲烷的用量，从而进入恶性循环。更为\n严重的是，溴甲烷在使用过程中，会排放到大气中，影响大气臭氧层，破坏大气环境。\n正是由于溴甲烷存在“不光彩”的一面，一些国际组织和发达国家呼吁尽快禁止使用溴\n甲烷。\n从上下文看，下列对溴甲烷“‘不光的一面”的理解，不正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "溴甲烷在使用过程中，会挥发到大气中，破坏大气臭氧层，恶化大气环境", "image": null}, {"key": "B", "text": "溴甲烷无色无味，作为熏蒸剂使用时，容易使人放松警惕，从而存在安全隐患", "image": null}, {"key": "C", "text": "溴甲烷虽然能杀灭病原菌，但同时也杀灭了土壤中一些对农作物生长有益的生物", "image": null}, {"key": "D", "text": "溴甲烷可使有的中毒者出现心脏衰竭、休克、双目失明等症状", "image": null}], "answer": "B", "explanation": "由文段中“溴甲烷在使用过程中，会排放到大气中，影响大气臭氧层，破坏大气环境”可知A 项正确；由“溴甲烷在杀灭病原菌的同时，也杀灭了土壤中一些对农作物生长有益的生物”可知，C 项正确；由“中毒严重者可出现心脏衰竭、休克等症状，个别中毒者还会双目失明”可知，D 项正确。B 项在文段中找不到根据，属无中生有，因此本题选B。", "material": null, "srcPage": 20, "imgN": 0, "f": []}, {"id": "yanyu-078", "module": "yanyu", "no": 78, "subType": "片段阅读", "stem": "当然，能够只是送出去，也不算坏事情，一者见得丰富，二者见得大度。尼采\n就自诩过他是太阳，光热无穷，只是给予，不想取得。然而尼采究竟不是太阳，他发了\n疯。中国也不是，虽然有人说，掘起地下的煤来，就足够全世界几百年之用。但是，几\n百年之后呢？几百年之后，我们当然是化为魂灵，或上天堂，或落了地狱，但我们的子\n孙是在的，所以还应该给他们留下一点礼品。要不然，则当佳节大典之际，他们拿不出\n东西来，只好磕头贺喜，讨一点残羹冷炙做奖赏。\n这段文字的主旨是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "批判“送去主义”者自诩“丰富”、“大度”的愚昧", "image": null}, {"key": "B", "text": "揭露帝国主义者侵占中国资源的罪行", "image": null}, {"key": "C", "text": "说明中国煤炭资源即使丰富，也会有开采完的一日，所以不能一味“送去”", "image": null}, {"key": "D", "text": "揭示“送去主义”所造成的祸国殃民的严重危害", "image": null}], "answer": "D", "explanation": "此文段的重心是在谈“送去主义”对于未来子孙的危害，而不在于只是批判“送去主义”者的愚昧，所以A 项错误。B 项中的揭露帝国主义的侵略罪行，文中没有提到。C 项中的煤炭资源只是作为论述观点的例证。D 项是文段的主旨。 13 内部资免费交流", "material": null, "srcPage": 20, "imgN": 0, "f": []}, {"id": "yanyu-079", "module": "yanyu", "no": 79, "subType": "片段阅读", "stem": "在西斯廷礼拜堂的天花板上，文艺复兴时期的艺术巨匠米开朗基罗把他笔下的\n人物描绘得如此雄壮、有力。在意大利，每当我们看到这些魁伟强劲、丰满秀美的人体\n艺术作品时，就会深深地感到人类征服自然、改造自然的勇气和力量，使我们对文艺复\n兴运动与现代体育的渊源有了更深刻的理解。\n这段文字是在谈文艺复兴运动与：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "意大利", "image": null}, {"key": "B", "text": "现代体育", "image": null}, {"key": "C", "text": "人体艺术", "image": null}, {"key": "D", "text": "米开朗基罗", "image": null}], "answer": "B", "explanation": "这是一个考查材料谈论重点的题型。本题虽然谈到了“米开朗基罗笔下的人物”、“意大利”、“人体艺术”，但这些显然不是材料的谈论重点。而材料的最后一句话明确指出了这段材料的谈论重点，即文艺复兴运动与现代体育的渊源。", "material": null, "srcPage": 21, "imgN": 0, "f": []}, {"id": "yanyu-080", "module": "yanyu", "no": 80, "subType": "片段阅读", "stem": "我国目前甲醛的年产量、使用量很大，出现的甲醛职业危害很广泛，如用于树\n脂的生产、塑料和涂料的制造、织物整理和工业化学品的生产。甲醛不但能导致鼻腔癌\n和鼻窦癌，并有可能引起白血病。因为目前白血病方面的证据还仅限于流行病学方面的\n发现，尚未能分析白血病的癌变机理。世界卫生组织发布的“甲醛致癌分析”是由 26\n位专家对被污染的 10 个国家评议的结果。\n这段文字表述的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "甲醛被确认为致癌物质", "image": null}, {"key": "B", "text": "莫把“甲醛污染”当耳边风", "image": null}, {"key": "C", "text": "对甲醛污染应引起高度重视", "image": null}, {"key": "D", "text": "专家支招防甲醛污染", "image": null}], "answer": "B", "explanation": "这段文字从甲醛在我国的年产量、使用量很大，引出甲醛的危害“不但能导致鼻腔癌和鼻窦癌，并有可能引起白血病”，意在提醒人们对“甲醛污染”不要忽视。A 项“甲醛被确认为致癌物质”，文段中虽有“甲醛不但能导致鼻腔癌和鼻窦癌，并有可能引起白血病”的表述，但这旨在说明甲醛的危害，意在引起人们的重视，并非是提出一项新的医学发现，排除。C 项“应引起高度重视”中的“高度”一词程度太深，在文中没有体现，排除。D 项说“专家支招”，从文中完全看不出“支招”的痕迹，属凭空臆想，排除。本题的正确答案为B。", "material": null, "srcPage": 21, "imgN": 0, "f": []}, {"id": "yanyu-081", "module": "yanyu", "no": 81, "subType": "片段阅读", "stem": "悲观的人抱怨风，乐观的人期盼转向，现实的人调整帆。爱就要冒没有回报的\n风险，希望就要冒失望的风险，尝试就要冒失败的风险，但之所以要冒风险就是因为生\n命中最大的危险就是一点风险不冒。乐观主义者和悲观主义者的区别非常好笑，前者看\n到的是面包圈，后者看到的是那个窟窿。\n对这段文字的概括最恰当的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "乐观与悲观", "image": null}, {"key": "B", "text": "乐观主义者和悲观主义者", "image": null}, {"key": "C", "text": "面包圈与那个窟窿", "image": null}, {"key": "D", "text": "生活中的哲理", "image": null}], "answer": "A", "explanation": "文段通过对比人们对待风、对待风险、以及对待面包圈的不同，阐述了乐观与悲观这两种截然不同的生活态度。B 项为干扰项，但是“乐观主义者”与“悲观主义者”讲的都是人，由文段第二句“希望就要冒失望的风险，尝试就要冒失败的风险”可看出，文段强调的还是“态度”，故A 项比B 项恰当。C 项“面包圈”和“那个窟窿”是乐观主义者与悲观主义者对待事物两种态度形象化的表述，不能完全代表乐观与悲观两种生活态度。D 项“生活中的哲理”的表述过于抽象，没有体现出文段的论题，排除。本题最恰当的答案为A。", "material": null, "srcPage": 21, "imgN": 0, "f": []}, {"id": "yanyu-082", "module": "yanyu", "no": 82, "subType": "片段阅读", "stem": "一位长者对一个青年人说：“批评和侮辱，跟泥巴没什么两样。你看，我大衣\n上的泥点，是刚过马路溅上的。当时擦一定会很糟，所以就等到泥巴干了再去处理。”\n但是，任何比喻都是蹩脚的，假如泥点变成了油漆，大衣变成了玻璃，再依据上面比喻\n中的逻辑，就适得其反。生活给我们准备了各种各样的逻辑，它们互不相同，也许还会\n打架。而我们奉行什么样的逻辑，全取决于自己。\n最适合做本段文字标题的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "事物具有辩证性", "image": null}, {"key": "B", "text": "批评与侮辱", "image": null}, {"key": "C", "text": "异杂逻辑", "image": null}, {"key": "D", "text": "生活中的逻辑不是单一的", "image": null}], "answer": "C", "explanation": "文段由长者的话引出了一种逻辑，话锋一转，改变了条件，原来的逻辑就“适得其反”了。由此，作者得出结论：逻辑各种各样，互不相同，也许还会打架，而奉行哪种，全取决于自己。题干要求选择最适合的文段标题，这就要求选项简短又切合文义。综观全文是在讲逻辑。所以排除A、B 两项。D 项的表述本身没有问题，但是它只强调了逻辑的“多”，对其“互不相同，也许还会打架”的特点没有涉及，排除。本题的正确答案为C。", "material": null, "srcPage": 21, "imgN": 0, "f": []}, {"id": "yanyu-083", "module": "yanyu", "no": 83, "subType": "片段阅读", "stem": "由于“鸟巢”和别的建筑不同，“东倒西歪”的柱子结构，交线非常复杂，对\n焊接技术的要求和难度都非常高。那些经过培训、优中选优的焊工们，不但优质高效地\n如期完成了任务，而且在“鸟巢”每条焊缝边上，都镌刻了自己的名字。用管理人员的\n话说，让无数普通焊工在这项世人瞩目的奥运工程中留下自己的微小痕迹——也许公众\n没有机会看到，却永不会磨灭。\n对这段话的理解最恰当的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "让建设者留下自己的名字，是一个温暖人心的举动", "image": null}, {"key": "B", "text": "对于建设者来说，就是要抬头挺胸签下自己的名字", "image": null}, {"key": "C", "text": "建设者签名，是对历史负责，也是对自己的人生负责", "image": null}, {"key": "D", "text": "普通焊工在奥运工程中留下自己的痕迹", "image": null}], "answer": "C", "explanation": "文段讲述了“鸟巢”的焊工们在“鸟巢”的每条焊缝边上镌刻自己名字这样一个事件。建造“鸟巢”这样的伟大建筑，离不开劳动者的智慧和血汗，让他们刻下自己的名字，既能留下永久的纪念（对历史负责），又是对普通劳动者的尊重（对自己的人生负责）。故答案为C。A 项“是一个温暖人心的举动”体现了这一事件背后所透露出的尊重劳动者的一面，但是对于文中所说的“也许公众没有机会看到， 14 内部资免费交却永不会磨灭”，却没有涉及，排除。B 项是站在建设者的角度，强调签下名字时的态度，从文中看不出建设者当时的状态，排除。D 项是对这个事件本身的概括，其后反映的较深层次的内涵没有涉及，排除。", "material": null, "srcPage": 22, "imgN": 0, "f": []}, {"id": "yanyu-084", "module": "yanyu", "no": 84, "subType": "片段阅读", "stem": "从清朝初期至新中国成立之前，由于自然灾害、战乱等原因，迫于生计的 2000\n万山东人相继踏上了东北大地。电视连续剧《闯关东》是一部表现山东百姓迫于生存闯\n荡东北的历史传奇故事。通过朱开山一家闯关东的经历，浓缩 1904 年至 1931 年“九·一\n八”爆发的历史。通过对一个普通人家闯荡历程的追踪，完成一个小业到大业、小人物\n到大英雄的塑造，讴歌自强不息、艰苦奋斗、勤劳勇敢、百折不挠的民族精神。这部剧\n写深写透了民族的魂魄，抓住了民族的品格。\n这段文字主要说明：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "朱开山一家跌宕起伏的命运抓住了观众", "image": null}, {"key": "B", "text": "作品把“家族史”和“社会史”很好地融合在了一起", "image": null}, {"key": "C", "text": "以百年传奇故事映照中华民族精神", "image": null}, {"key": "D", "text": "闯关东人身上所体现出来的山东人精神", "image": null}], "answer": "C", "explanation": "文段通过《闯关东》这个具有典型性的传奇故事来反映民族的“自强不息、艰苦奋斗、勤劳勇敢、百折不挠”的精神，突出的是民族的气魄，所以正确答案为C。A 项是这部电视剧受欢迎的一个原因，文中没有提及，排除。B 项是这部电视剧的一个特点，文中虽有印证，但这不是文段主要说明的内容。D 项说“所体现出的山东人精神”，山东人的表述太过狭隘，文中后两句说的是“民族精神”、“民族的魂魄”、“民族的品格”，故排除D，本题的正确答案为C。", "material": null, "srcPage": 22, "imgN": 0, "f": []}, {"id": "yanyu-085", "module": "yanyu", "no": 85, "subType": "片段阅读", "stem": "一位农夫请了工程师、物理学家和数学家来，想用最少的篱笆围出最大的面积。\n工程师用篱笆围出一个圆，称这是最优设计。物理学家将篱笆拉开成一条长长的直线，\n假设篱笆有无限长，认为围起整个地球总够大了。数学家用很少的篱笆把自己围起来，\n然后说：“我现在是在篱笆外面。”\n这个故事所说明的道理不包括：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "农夫与科学家", "image": null}, {"key": "B", "text": "要善于从多角度思考问题", "image": null}, {"key": "C", "text": "质疑、异想是人类进步的阶梯", "image": null}, {"key": "D", "text": "一个人要有所创新，就要不断地调整思维方法", "image": null}], "answer": "A", "explanation": "文段通过工程师、物理学家和数学家用篱笆围出最大面积的故事说明了诸多道理。题干要求选出故事中说明的道理“不包括”的一项。由“道理”二字可知，本题即可轻易选出答案A。因为A 项只是对这个故事内容的概括，并不包含什么道理。B 项强调“多角度”，故事中工程师、物理学家、数学家分别从不同的角度对问题给出了解答，因此符合。C 项“质疑、异想”，三个科学家正是对别人质疑、再加上自己的异想才得出自己的答案，因此符合。D 项谈到“调整思维方法”，三个科学家正是从不同的思维方法出发，才得出了完全不同的结论，故符合。本题的正确答案为A。", "material": null, "srcPage": 22, "imgN": 0, "f": []}, {"id": "yanyu-086", "module": "yanyu", "no": 86, "subType": "片段阅读", "stem": "先进的文化往往具有灯与火的功能。灯可照亮前进的路，火可温暖渴望的心。\n在《莎士比亚命名日》中曾这样表达他对文化感染力的感悟：“他的著作我读了每一页，\n就被他终身折服；读完他的第一个剧本，我仿佛一个天生的盲人，瞬息间，有一只神奇\n的手给我送来了光明。”文化就是送“光明”、鼓舞士气、提高修养的。\n这段文字主要说明：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "理靠感染，感染靠文化", "image": null}, {"key": "B", "text": "理靠文化是理之感染的有效途径", "image": null}, {"key": "C", "text": "理是软约束，就要靠感染", "image": null}, {"key": "D", "text": "感染是通过语言文字或其他形式激起他人相同的思想感情", "image": null}], "answer": "A", "explanation": "这段文字主要讲述了文化的感染力。第一、二句总说文化具有灯与火的功能。第三句进一步引用歌德的话强调了文化的这种感染力。末句总说文化就是送“光明”、鼓舞士气、提高修养的。B 项说“理靠文化是理之感染的有效途径”，从文中并不能看出二者关系，排除。C 项着重说明“理靠感染”，没有提到文化，这与文义不符，排除。D 项意在解释“感染”是什么，也没有涉及文化的内容，排除。A 项说“感染靠文化”，这与文段强调的文化的感染力相符，故本题的正确答案为A。", "material": null, "srcPage": 23, "imgN": 0, "f": []}, {"id": "yanyu-087", "module": "yanyu", "no": 87, "subType": "片段阅读", "stem": "1924 年第 8 届现代奥运会在巴黎举行，主办者将参加者安置在特意建造的木制\n房屋里，这就是最早的奥运村。从 1932 年洛杉矶奥运会开始，为各国参赛人员提供奥\n运村成了一个传统。从首届现代奥运会到 20 世纪末，美国是举办现代奥运会次数最多\n的国家，包括 4 届夏季奥运动和 3 届冬季奥运会。 20 世纪的两次世界大战，使原拟在\n1916 年、 1940 年、 1944 年举行的第 6 届、第 12 届和第 13 届奥运会被迫取消。按照古\n代奥运会旧制，凡因故未能举行的奥运会也要在运动史上排下序列。\n这段话的准确概括是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "奥运村", "image": null}, {"key": "B", "text": "奥运点滴", "image": null}, {"key": "C", "text": "被迫取消的奥运会", "image": null}, {"key": "D", "text": "举行现代奥运会次数最多的国家", "image": null}], "answer": "B", "explanation": "这段文字介绍了有关奥运会的一些知识。第一、二句介绍了奥运村的传统。第三句介绍的是举办现代奥运会次数最多的国家。最后两句则是介绍被迫取消的奥运会，以及其也要排下序列的奥运规则。纵观全文，文段仅仅是三部分内容的简单罗列，并无侧重。因此“奥运点滴”的概括最为准确。A、C、D 三项均是对文段部分内容的概括，排除。本题的正确答案为B。 15 内部资免费交流", "material": null, "srcPage": 23, "imgN": 0, "f": []}, {"id": "yanyu-088", "module": "yanyu", "no": 88, "subType": "片段阅读", "stem": "有个偷针者和偷牛者一起被游街，偷针的觉得很委屈：“我只偷了一根针，为\n什么要和盗牛贼一起游街，太不公平了！”盗牛者却对他说：“别嚷了，我走到这一步\n是从偷针开始的。”\n这个寓言故事所告诉我们的道理不包括：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "小事小节是可大可小的问题", "image": null}, {"key": "B", "text": "“堤溃蚁穴，气泄针芒”", "image": null}, {"key": "C", "text": "质变是由量变生成的", "image": null}, {"key": "D", "text": "“小节不慎，大节难保”", "image": null}], "answer": "A", "explanation": "由偷针者和偷牛者一起被游街的下场可知，这个故事是要告诉我们小事小节不是可大可小的事，而是大事，因为“偷牛是从偷针开始的”。A 项说“小事小节可大可小”，这显然没有认识到“小事小节”的重要性，而是把它当做可随意放大或忽略，凭自己主观判断来决定其性质的问题，与故事要告诉我们的道理相悖。B、C、D 三项都体现出了要重视小事、小节的思想。故本题的正确答案为A。", "material": null, "srcPage": 23, "imgN": 0, "f": []}, {"id": "yanyu-089", "module": "yanyu", "no": 89, "subType": "片段阅读", "stem": "人们不喜欢丢掉自己的原有“地盘”，不喜欢丢面子。他们往往陷入一种思想\n陷阱，也就是经济学家所说的“沉没成本”，它指一种时间和金钱的投资，只有在产品\n销售成功后才可顺利回收。在英语国家中，也被称为“将钱掉进排水沟里”。\n这段文字意在告诉我们：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "很多人有怀旧情绪，不善于放弃", "image": null}, {"key": "B", "text": "所有金钱和时间上的投资都会得到回报", "image": null}, {"key": "C", "text": "计算投资成本时，应该把“沉没成本”也加进去", "image": null}, {"key": "D", "text": "当决定是否进行投资的时候，必须忘掉自己过去的投资", "image": null}], "answer": "D", "explanation": "“人们不喜欢丢掉自己的原有‘地盘’，不喜欢丢面子。”这显然是作者批评的现象。所以作者的观点就是：不要顾及丢面子，要舍得丢掉自己的原有“地盘”。材料中的“思想陷阱”指人们对“沉没成本”的念念不忘，而实际上这种成本“只有在产品销售成功后才可顺利回收”。所以当决定是否进行投资的时候，必须忘掉自己过去的投资。", "material": null, "srcPage": 24, "imgN": 0, "f": []}, {"id": "yanyu-090", "module": "yanyu", "no": 90, "subType": "片段阅读", "stem": "张三问李四：“你常看《新华文摘》吗？”李四回答：“谁说我不常看《新华\n文摘》？”张三又问李四：“这么说你常看《新华文摘》了？”李四回答：“我并不是\n说我常看《新华文摘》。”\n从逻辑规律的角度判定，李四的回答：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "违反了矛盾律", "image": null}, {"key": "B", "text": "违反了排中律", "image": null}, {"key": "C", "text": "既违反了矛盾律，又违反了排中律", "image": null}, {"key": "D", "text": "既没有违反矛盾律，又没有违反排中律", "image": null}], "answer": "B", "explanation": "这道题实际考查的是逻辑知识。矛盾律是指两个矛盾关系的命题不能同时为真，必有一个为假；排中律则指两个矛盾关系的命题不能同时为假，必有一个为真。两个规律的侧重点不同。“谁说我不常看《新华文摘》”否定了“不常看”，即“不常看”为假；“我并不是说我常看《新华文摘》”否定了“常看”，即“常看”为假。两个矛盾命题不能同时为假，必有一真，所以违反了排中律。而文段中没有命题为真的判断，所以与矛盾律无关。故答案选B。", "material": null, "srcPage": 24, "imgN": 0, "f": []}, {"id": "yanyu-091", "module": "yanyu", "no": 91, "subType": "片段阅读", "stem": "一个正常人能够把自己的悲伤、愤怒、怨恨、委屈、不满等等情绪表达出来，\n那么朋友和同事就会知道他的困难，并尽自己的能力来帮助他。而“阳光抑郁症”患者\n往往会把自己真正的情绪隐藏起来，只向人展示自己阳光的一面，长期得不到宣泄的负\n面情绪积累下来，就会形成巨大的压力。\n通过这段话我们可以知道：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "阳光抑郁症患者不愿意得到别人的帮助", "image": null}, {"key": "B", "text": "阳光抑郁症患者得不到别人的帮助", "image": null}, {"key": "C", "text": "阳光抑郁症患者有巨大的心理压力", "image": null}, {"key": "D", "text": "阳光抑郁症患者认为自己的人生不完美", "image": null}], "answer": "C", "explanation": "文中只是说阳光抑郁症患者往往把自己真正的情绪隐藏起来，我们不能由此得出他们不愿意得到别人的帮助，也不能推知他们得不到别人的帮助，故排除A、B。D 项在文中完全没有提及，也排除。由文段最后一句话可得出C 为正确选项。", "material": null, "srcPage": 24, "imgN": 0, "f": []}, {"id": "yanyu-092", "module": "yanyu", "no": 92, "subType": "片段阅读", "stem": "通过遥感探测发现，每年 10 月到次年的 3 月期间，每 2~3 天在 2 公里以上的高\n空就有一股从西风带吹来的浮尘，当它抵达华北平原上空后，由于地势降低，风速下降\n以后浮尘便会往下与污染物相混合，遭遇水汽后细粒子个体便迅速增大，造成大范围高\n强度的污染现象。如果遇上南边气流比较强，会形成华北地区持续多天的重污染天气。\n这段文字意在说明华北地区空气污染现象的：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "形成原因", "image": null}, {"key": "B", "text": "形成过程", "image": null}, {"key": "C", "text": "覆盖范围", "image": null}, {"key": "D", "text": "发生时间", "image": null}], "answer": "A", "explanation": "文段通过遥感探测发现，对华北地区空气污染现象频发的原理进行了分析。D 项的“发生时间”非文段重点，C 项的“覆盖范围”文段未涉及，均可排除。由“由于……造成……”的句式可知，文段侧重说明的是“原因”而非“过程”。本题答案为A。", "material": null, "srcPage": 24, "imgN": 0, "f": []}, {"id": "yanyu-093", "module": "yanyu", "no": 93, "subType": "片段阅读", "stem": "目前在火电领域诞生的新技术很多，联合循环技术就是其中之一。简单来说，\n联合循环技术就是“一气两用”：将燃气轮机排出的高温废气，通过余热锅炉回收转换\n为蒸汽，进入蒸汽轮机后驱动其运转，两台轮机都将动能输送至发电机进行发电；废气\n再次进入锅炉，进一步将其中蕴含的热能转化为动能，降低最终排出气体的温度。这样\n不仅环保，还能节省燃料。启动速度快也是一大优点，其工作原理是在开机之初关闭运\n转较慢的蒸汽轮机，只启动燃气轮机，产生足够的热能后，再切换到联合循环模式。这\n一特点对于电力应急事件频发的大都市十分实用。\n关于联合循环技术，下列说法与上述文字不相符的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "停电时可在短时间内迅速启动", "image": null}, {"key": "B", "text": "蒸汽轮机早于燃气轮机启动", "image": null}, {"key": "C", "text": "高温废气得以循环利用", "image": null}, {"key": "D", "text": "明显提高了发电效率", "image": null}], "answer": "B", "explanation": "由“其工作原理是在开机之初关闭运转较慢的蒸汽轮机，只启动燃气轮机”可知，应是燃气轮机早于蒸汽轮机启动，故B 项错误，当选。", "material": null, "srcPage": 25, "imgN": 0, "f": []}, {"id": "yanyu-094", "module": "yanyu", "no": 94, "subType": "片段阅读", "stem": "作为我国首位女性航天员，刘洋当然有报道的价值，但这并不意味着一切都具\n有新闻价值，无限挖掘刘洋背后的“故事”，首先折射出的是一种舆论导向的迷失和新\n闻价值观的病态。典型人物的报道固然可以写得更有趣、更人性化一点，但不能为了刺\n激眼球把它当成娱乐八卦。\n下列说法与作者观点不符的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "对刘洋的新闻报道娱乐化是病态新闻价值观的表现", "image": null}, {"key": "B", "text": "无限挖掘刘洋背后的“故事”是新闻报道娱乐化的表现", "image": null}, {"key": "C", "text": "刘洋背后的某些“故事”不具有新闻价值", "image": null}, {"key": "D", "text": "所有娱乐八卦的报道都偏离了正确的娱乐轨道", "image": null}], "answer": "D", "explanation": "D 项“所有娱乐八卦的报道都偏离了……”说法过于绝对，与文意不符。其他三项均可以从文段中找到依据。 16 内部资免费交流", "material": null, "srcPage": 25, "imgN": 0, "f": []}, {"id": "yanyu-095", "module": "yanyu", "no": 95, "subType": "片段阅读", "stem": "过去五年，全国贫困人口由 6431 万减少到 2688 万人，但我国贫困标准一向比\n国际标准低，如果贫困标准上调到年人均纯收入 1500 元，贫困人口将增多，可再回到\n9000 多万甚至上亿。\n这段文字意在说明：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "我国的扶贫需向国际标准看齐", "image": null}, {"key": "B", "text": "过去五年我国扶贫成绩斐然", "image": null}, {"key": "C", "text": "我国扶贫任务仍然艰巨", "image": null}, {"key": "D", "text": "我国贫困人口曾近一亿", "image": null}], "answer": "C", "explanation": "文段首先肯定了我国扶贫工作的成就，然后以“但”作转折说明我国扶贫标准比国际标准低，如果提高标准，我国的贫困人口数量将会大量上升。由此可知，我国的扶贫任务仍然很艰巨。故本题答案为C。", "material": null, "srcPage": 25, "imgN": 0, "f": []}, {"id": "yanyu-096", "module": "yanyu", "no": 96, "subType": "片段阅读", "stem": "公车改革的漏洞是一面镜子，它寓示着只有让所有公共治理的漏洞都充分聚焦\n民意，社会才能进步。现在，公车改革新政遭遇质疑，让那些可能被权力钻空子的漏洞\n被及时曝光，尽管会让人看到改革滞重难行的一面，但我们更应该感受到民意洪流无法\n阻挡。每一项制度改革的漏洞，如果都能有民意与权力进行深度博弈，社会就一定能够\n渐渐步入民主与法治的轨道，一路畅行。\n对这段材料的关键词提炼准确的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "公车改民权博弈", "image": null}, {"key": "B", "text": "制度改轨权畅行", "image": null}, {"key": "C", "text": "漏民权博弈", "image": null}, {"key": "D", "text": "公共治轨权畅行", "image": null}], "answer": "C", "explanation": "本题可采用排除法。“轨道”、“畅行”两个词语出现在文段末句，在文段中本身没有什么实际意义，不应将其作为关键词，由此可排除B、D 两项。A 项中的“公车改革”是为了引出“漏洞”，其本身并不是关键所在，亦可排除。故本题答案为C。", "material": null, "srcPage": 26, "imgN": 0, "f": []}, {"id": "yanyu-097", "module": "yanyu", "no": 97, "subType": "片段阅读", "stem": "中央党校政法教研部教授声称“微博问政也存在无序发展的问题”，认为\n“群众通过个人微博举报贪官，一方面容易‘打草惊蛇’，另一方面也给自己人身安全\n带来了一些问题。”林教授说，“我还是赞同公众通过正常渠道去反映官员腐败问题。”\n对林教授的观点理解正确的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "微博反腐因网络暴力而失序", "image": null}, {"key": "B", "text": "微博不是反腐的首选途径", "image": null}, {"key": "C", "text": "微博反腐弊大于利", "image": null}, {"key": "D", "text": "微博反腐安全成本高", "image": null}], "answer": "B", "explanation": "通过林教授声称的内容“群众通过个人微博举报贪官，一方面……，另一方面……”、“我还是赞同公众通过正常渠道去反映官员腐败问题”可知，林教授认为微博不是反腐的首选途径。A 项中的“网络暴力”文段没有提到，C 项的利弊对比偏离了文段强调微博反腐弊端的重点，D 项“安全成本”只是弊端的一个方面。故本题答案为B。", "material": null, "srcPage": 26, "imgN": 0, "f": []}, {"id": "yanyu-098", "module": "yanyu", "no": 98, "subType": "片段阅读", "stem": "形成思维惰性的心理因素有三个，一是因循守旧。当普朗克实际上已经冲破经\n典物理学框框，提出量子假说，向着微观世界迈步时，他却“作茧自缚”，仍然抱着传\n统的观念不放，力图把自己的新理论纳入经典物理学的轨道，结果徒劳无益。二是迷信\n权威。伽利略发现的“摆动定律”和“落体定律”，所以遭到那么多人的讥笑和反对，\n就是因为他推翻了被奉为权威的亚里斯多德的“摆幅短，需时少”和“重者下落快、轻\n者下落慢”的错误观点。三是怕犯错误。德国化学家维勒在从无机原料合成有机尿素后，\n却在有机化学面前却步了。其原因，在他给老师的信里说得很清楚：有机化学就像是一\n片“原始热带森林”，是“一片狰狞的、无边无际的、使人没法逃得出来的丛莽，也使\n人非常害怕走进去”。\n下列评价分析不符合原文意思的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "作者精辟地指出了人类思维惰性的三个心理因素", "image": null}, {"key": "B", "text": "文段引用名人事例，内容详实，深入浅出，却又无堆砌之感", "image": null}, {"key": "C", "text": "作者倡导打破传统和权威的思维桎梏，大胆进行创新思维", "image": null}, {"key": "D", "text": "思维惰性是因为人脑有一种依据传统观念作判断的强烈倾向", "image": null}], "answer": "D", "explanation": "文段说，形成思维惰性的心理因素有三个：一是因循守旧，二是迷信权威，三是怕犯错误，故D 项把思维惰性的形成仅仅归结为“人脑有一种依据传统观念作判断的强烈倾向”说法错误。因此本题选D。", "material": null, "srcPage": 26, "imgN": 0, "f": []}, {"id": "yanyu-099", "module": "yanyu", "no": 99, "subType": "片段阅读", "stem": "取消高中阶段的文理分科，应当慎行。只有当绝大部分学校的课程、师资等教\n育资源丰富起来时，我国高中教育阶段实施真正意义上的学分制教育才具有坚实的发展\n基础；只有当包括高考和高校录取制度改革在内的教育整体改革逐步完成时，全面取消\n文理分科方可说水到渠成。\n文理分科方可说水到渠成的因素的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "我国绝大部分学校资源足够丰富", "image": null}, {"key": "B", "text": "分步实施，先做试点，再全面推开", "image": null}, {"key": "C", "text": "高考和高校录取制度改革等教育整体改革基本完成", "image": null}, {"key": "D", "text": "我国高中教育实施真正意义上的学分制", "image": null}], "answer": "C", "explanation": "由文段末句“只有当包括高考和高校录取制度改革在内的教育整体改革逐步完成时，全面取消文理分科方可说水到渠成”可知，C 项正确。", "material": null, "srcPage": 27, "imgN": 0, "f": []}, {"id": "yanyu-100", "module": "yanyu", "no": 100, "subType": "片段阅读", "stem": "研究人员指出，术语“生物降解”这个词的使用是不规范的。一些生产厂家说，\n这些产品如果在物理上发生变化，则是可能生物降解的，它们一旦与其他物质混合，便\n会自然消失或者可以支持生物的成长。研究人员认为，真正的生物降解物质在需氧条件\n下可以分解成二氧化碳和水。在厌氧条件下它们则可以分解成甲烷和二氧化碳。然而经\n他们试验的每个产品都不能降解，也不能达到上述标准。\n文中“术语 ‘生物降这个词的使用是不规范的这句话的意思是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "“生物降解”不是一个科学的术语", "image": null}, {"key": "B", "text": "“生物降解”这个说法名不副实", "image": null}, {"key": "C", "text": "“生物降解”在现实中不存在", "image": null}, {"key": "D", "text": "“生物降解”这个术语的运用有语法错误", "image": null}], "answer": "B", "explanation": "“生物降解”这个术语使用不规范，是因为经试验证明，“每个产品都不能降解，也不能达到上述标准”，由此可知，“生物降解”这个说法名不副实，不可能实现，B 项正确。", "material": null, "srcPage": 27, "imgN": 0, "f": []}, {"id": "yanyu-101", "module": "yanyu", "no": 101, "subType": "片段阅读", "stem": "金砖国家的经济活力和发展前景令国际社会刮目相看，但现阶段这些国家自身\n经济发展仍面临一些困难，如经济结构不尽合理，基础设施相对落后，金融市场功能尚\n不完善，地区发展差异明显等。解决好这些问题，就要充分发挥金融的核心作用，通过\n加强金融合作、探索合作机制、丰富合作内容、完善合作方式，有效提高资源配置效率。\n这段文字意在说明金砖国家：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "迫切需要深化金融合作", "image": null}, {"key": "B", "text": "自身经济发展面临困境", "image": null}, {"key": "C", "text": "具有带动全球经济发展的潜力", "image": null}, {"key": "D", "text": "目前以金融业为工作重点", "image": null}], "answer": "A", "explanation": "文段首先提出金砖国家在现阶段的经济发展中面临一些困难，然后提出解决这些困难的方法是充分发挥金融的核心作用，深化金融合作，故本题答案为A。", "material": null, "srcPage": 27, "imgN": 0, "f": []}, {"id": "yanyu-102", "module": "yanyu", "no": 102, "subType": "片段阅读", "stem": "在法国人到达北美之前，这片土地早已住着土著居民北美印第安人。据说他们\n的祖先早在 3 万至 1 万年前便陆续通过亚洲东北角当时与北美仍接壤的地带（即今白令\n海峡），来到阿拉斯加和育空地区的非冻土地带居住下来，有的继续向北美东南部扩散，\n直到大西洋沿岸和南美尖端。一般认为，这里最早的土著人属于亚洲的蒙古种族，当时\n亚洲还处在石器时期，这从当代加拿大发掘出来的石制器具和武器可以得到佐证。\n这段文字中的“这里”具体指的是", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "大西洋沿岸", "image": null}, {"key": "B", "text": "阿拉斯加", "image": null}, {"key": "C", "text": "加拿大", "image": null}, {"key": "D", "text": "美洲", "image": null}], "answer": "D", "explanation": "根据文段中划线的“这里”前的句子“来到阿拉斯加和育空地区的非冻土地带居住下来，有的继续向北美东南部扩散，直到大西洋沿岸和南美尖端”可知，“这里”指的是美洲。故答案为D。", "material": null, "srcPage": 28, "imgN": 0, "f": []}, {"id": "yanyu-103", "module": "yanyu", "no": 103, "subType": "片段阅读", "stem": "阅读同看电影、看录像、听音乐会有很大不同。后者是一块巨大的生日蛋糕，\n可以美味地共享；而前者只是孤灯下的一盏清茶，只可独啜，仿佛倾听一个遥远的灵魂\n对你一个人窃窃私语，他在不同的时间对不同的人说过同样的话，但此时你感觉他只在\n为你而歌唱。\n对这段文字概括最恰当的是", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "在阅读中最能体验孤独的滋味", "image": null}, {"key": "B", "text": "阅读的收获难以与人分享", "image": null}, {"key": "C", "text": "阅读的乐趣来源于内心的体会", "image": null}, {"key": "D", "text": "阅读的魅力需独自品味", "image": null}], "answer": "D", "explanation": "文段首句指出读书与看电影、看录像、听音乐会不同，后者“可以美味地共享”，前者“只可独啜”。由“独啜”与“共享”的对比以及“你感 17 内部资免费交觉他只在为你而歌唱”可知，文段主要说明的是阅读的魅力需独自品味，即本题答案为D。", "material": null, "srcPage": 28, "imgN": 0, "f": []}, {"id": "yanyu-104", "module": "yanyu", "no": 104, "subType": "片段阅读", "stem": "毋庸置疑，晚清以降中国遭逢千百年未遇之大变局，被强行纳入世界资本主义\n体系当中，从世界中心沦为所谓边缘的“远东”，在世界历史和文化上一再缺席，遭遇\n了深刻的文化身份危机，不断被误读、曲解和妖魔化。正是在这一历史语境中，发现东\n方与文化输出就显得越发重要和紧迫。\n这段文字中的“历史语境”是指", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "中国被西方列强边缘化", "image": null}, {"key": "B", "text": "晚清中国所遭遇的历史大变局", "image": null}, {"key": "C", "text": "中国融入资本主义体系的时机", "image": null}, {"key": "D", "text": "对中国文化的误读、曲解和妖魔化", "image": null}], "answer": "D", "explanation": "此题可以用就近原则来解。分析可知，“正是在这一历史语境中”中的“历史语境”指的便是前面提到的“遭遇了深刻的文化身份危机，不断被误读、曲解和妖魔化”，故本题答案为D。", "material": null, "srcPage": 28, "imgN": 0, "f": []}, {"id": "yanyu-105", "module": "yanyu", "no": 105, "subType": "片段阅读", "stem": "在公路发展的早期，它们的走势还很顺利，即沿河流或森林的边缘发展。可如\n今，公路已无所不在，狼、熊等原本可以自由游荡的动物群被分割得七零八落。与大型\n动物的种群相比，较小动物的种群在数量上具有更大的波动性，更容易发生杂居现象。\n这段文字主要陈述的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "公路发展的趋势", "image": null}, {"key": "B", "text": "公路对动物的影响", "image": null}, {"key": "C", "text": "动物生存状态的变化", "image": null}, {"key": "D", "text": "不同动物的不同命运", "image": null}], "answer": "B", "explanation": "文段共三句话，第一句讲公路发展的早期，因走势顺利，对动物影响比较小。第二句和第三句分别说了大型动物和较小动物随着公路的迅速发展出现的变化。本题正确答案为B。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "yanyu-106", "module": "yanyu", "no": 106, "subType": "片段阅读", "stem": "下列各句中没有语病的一句是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "为期一周的布鲁塞尔会议将就各种国际性犯罪活动以及国际之间的执法合作问 题展开广泛的讨论。", "image": null}, {"key": "B", "text": "吴菲生性好动，像个野小子似的，为此，她没少受妈妈的训斥和挨骂。", "image": null}, {"key": "C", "text": "大批灾区儿童重新走进了宽敞明亮的教室，坐上了崭新的木制桌凳，广大家长对 此十分满意。", "image": null}, {"key": "D", "text": "他从小就受到唐诗宋词的熏陶，这有利于他准确地把握肖邦的旋律所蕴含的诗 境。", "image": null}], "answer": "A", "explanation": "B 项成分赘余，“受妈妈的训斥”和“挨骂”重复啰嗦。C 项搭配不当，不能“坐上桌凳”应改为“用上桌凳”。D 项“把握”与“诗境”搭配不当，可把“把握”改为“体会”。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "yanyu-107", "module": "yanyu", "no": 107, "subType": "片段阅读", "stem": "下列句子中没有语病的一句是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "这些蔬菜长得这么好，是由于菜农们精心管理的结果。", "image": null}, {"key": "B", "text": "我每次向他借书，他不顾年老体衰，都亲自冒着严寒酷暑跑进小书屋寻找。", "image": null}, {"key": "C", "text": "为了发展国民经济，难道我们共产党人还有什么个人得失不能抛弃吗？", "image": null}, {"key": "D", "text": "她虽然缺乏对待顾客的热忱，却有一套对付顾客批评的本事。", "image": null}], "answer": "D", "explanation": "A 项句式杂糅，去掉“由于”或“的结果”；B 项不合事理，“酷暑”是在夏天，“严寒”是在冬天，不可能同时到来，“我”每次向他借书，“他”不可能每次都冒着严寒酷暑寻找。C 项“得”可以抛弃，“失”则不能。应该把“得失”改为“利益”。D 项没语病，故当选。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "yanyu-108", "module": "yanyu", "no": 108, "subType": "片段阅读", "stem": "下列句子没有语病的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "面对全球气候变暖的趋势，我们目前的当务之急，就是加快全球环保统筹合作的 进程。", "image": null}, {"key": "B", "text": "他们兄弟手足情深，他怎么能丢下生病的哥哥和弟弟去看马戏团的表演呢？", "image": null}, {"key": "C", "text": "为了防止游人不再践踏这片刚铺好的草皮，公园管理员在此立了一块警示牌。", "image": null}, {"key": "D", "text": "英国科学家最新的一项研究发现，茶叶是改善记忆力的良品之一，多喝茶能使人 的大脑更健康。", "image": null}], "answer": "D", "explanation": "A 项重复累赘，“目前的当务之急”去掉“目前的”。B项“和”的词性不同造成歧义，“和”为介词，丢下的是哥哥一个人；“和”为连词，则丢下的是哥哥和弟弟两个人。C 项否定失当，可去掉“不”。故本题正确答案为D。", "material": null, "srcPage": 29, "imgN": 0, "f": []}, {"id": "yanyu-109", "module": "yanyu", "no": 109, "subType": "片段阅读", "stem": "下列各句中，没有语病的一句是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "如果不重视网络道德建设， subType": "片段阅读", "stem": "下列选项中没有语病的一项为：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "为北京申奥成功作出贡献的《申办报告》是一幅全面展现中国北京风采的锦绣画 卷，国际奥委会已经收藏，目前陈列在瑞士洛桑奥林匹克博物馆中。", "image": null}, {"key": "B", "text": "在美国密歇根州希尔斯代尔市市长改选中，刚满 18 岁的美国少年塞申斯击败了 现任市长英格戡斯，产生了美国历史上最年轻的市长。", "image": null}, {"key": "C", "text": "改革公费医疗制度，实施医疗保险制度，对于人民群众并不是一下子就能愉快接 受的，政府部门应做好宣传解释工作。", "image": null}, {"key": "D", "text": "然而，至 20 世纪末期， 128 公路地区在计算机生产领域长期占有的主导地位却 让位于硅谷，它在地区就业人数、销售额、高新技术企业总数等方面远远落后于硅谷。", "image": null}], "answer": "D", "explanation": "A 项偷换主语，可改为“已经被国际奥委会收藏”。B 项搭配不当，“产生了”改为“成为了”。C 项主客倒置，可改为“对于改革……制度，人民群众并不是……”。", "material": null, "srcPage": 30, "imgN": 0, "f": []}, {"id": "yanyu-113", "module": "yanyu", "no": 113, "subType": "片段阅读", "stem": "下列选项中有语病的一句为：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "王洛宾的生命是以歌为主线的，信仰、工作甚至生活中的衣食住行都成了歌的附 属，就像一根树干上的柔枝绿叶。", "image": null}, {"key": "B", "text": "在专业研究、实验方面有优势的单位，有派出讲学人员、接受访问学者、举办训 练班以及对其他协作单位提供帮助的义务。", "image": null}, {"key": "C", "text": "当前和今后一个相当长的时间内，每年进入劳动年龄的人口数很大，安排城镇青 年劳动力就业是一项相当繁重的任务。", "image": null}, {"key": "D", "text": "他马上召集常委会进行研究，统一安排了现场会的内容、时间和出席人员，以及 会议中应注意的问题。", "image": null}], "answer": "D", "explanation": "D 项“安排”与“问题”搭配不当，可改为“安排了……人员，强调了……应注意的问题”。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "yanyu-114", "module": "yanyu", "no": 114, "subType": "片段阅读", "stem": "下列语句中表述正确的一句是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "在平凡的岗位上，他默默成为了育种的英雄。", "image": null}, {"key": "B", "text": "这种新研制的农药杀虫效果很好，但有不好控制、成本高等特点。", "image": null}, {"key": "C", "text": "太阳和月球带来了昼夜更替，星星虽小，也是生活的重要部分。", "image": null}, {"key": "D", "text": "老公快把那几幅名画拿出来，让大家开开眼。", "image": null}], "answer": "D", "explanation": "A 项语序颠倒，应改为“他成为了默默育种的英雄”。B项“不好控制、成本高”应是“缺点”，不应是“特点”。C 项词语表述不一致，“太阳”、“月球”、“星星”这三个词中“月球”应改为“月亮”。D 项表述正确。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "yanyu-115", "module": "yanyu", "no": 115, "subType": "片段阅读", "stem": "下列语句中有语病的一句是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "作者着力刻画了两位主要人物，这两位主要人物的一言一行、一举一动都体现了 作者对这两位女性的深刻理解和深切同情。", "image": null}, {"key": "B", "text": "我本想这次能在北京与你见面，到京后才知你正忙于创办合资企业，已经到广州 了。", "image": null}, {"key": "C", "text": "数据显示，在 2000 至 2003 年期间，占全美国 20比例最贫困家庭的年平均收入 为 16780 美元。", "image": null}, {"key": "D", "text": "参加这次活动的有我校师生将近四百多人。", "image": null}], "answer": "D", "explanation": "D 项中“将近”与“多”矛盾，宜根据实际情况，删去其一。", "material": null, "srcPage": 31, "imgN": 0, "f": []}, {"id": "yanyu-116", "module": "yanyu", "no": 116, "subType": "语句排序", "stem": "①其中包括他们的肤色、相貌、身材、线条、姿态、气质、风度等许多方面\n②这样的美，才是广大女性更加向往、追求和渴望的\n③真正的女性美，应该是结实、精干、肌肉强健，富有区别于男子的特有曲线美\n④越来越多的人们现在都倾向于认为：现代女性人体美，绝不是苗条、柔软、纤细\n⑤当代青年人心目中美的典型，已不再是一个或一种人，而是一个多层次、多因素\n的复杂模式\n⑥既不失女性的妩媚，又足以承担生活竞争的压力，担当起社会责任\n排列组合最连贯的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "⑤⑥③②④①", "image": null}, {"key": "B", "text": "⑤④⑥②①③", "image": null}, {"key": "C", "text": "⑤①④③⑥②", "image": null}, {"key": "D", "text": "②⑤①③④⑥", "image": null}], "answer": "C", "explanation": "首先，通读六个句子，可以初步确定这是一个描写现代年轻人心目中的美的语段，而从各种美中又着重谈了女性美，属于总—分结构。第一句是一个总起句。六个句子中，⑤是总起句应为首句，根据⑤句内容“多层次、多因素”，可以推出接下来是①句。接下来谈女性美，同样需要一个领起句，④句承启恰当。根据④句内容“绝不是……”接下来就应点明是什么，③句“应该是……”符合题意，为了表达的通顺⑥应在③后，②句“这样的美”承接前文，因此，本题选C。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "yanyu-117", "module": "yanyu", "no": 117, "subType": "语句排序", "stem": "①因为细胞这种旺盛的生长过程如不加抑制地发展下去，细胞病变生成肿瘤的\n可能性极大\n②当人体处于生长发育期时，体内细胞生长迅速\n③但是，衰老程序一旦启动就不可逆转\n④但这一细胞迅速生长的过程同时也给人体带来了危险\n⑤这一在人类年轻时启动的保护程序，最终发展成了人类的死亡程序\n⑥为了避免这种危险，人体就会启动衰老程序，通过一些功能基因降低细胞增殖能\n力\n排列组合最连贯的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "⑤②①⑥③④", "image": null}, {"key": "B", "text": "②④①⑥③⑤", "image": null}, {"key": "C", "text": "②⑥①④③⑤", "image": null}, {"key": "D", "text": "⑤⑥②③①④", "image": null}], "answer": "B", "explanation": "由⑤句的指代词“这”可知，⑤句不适合放在段首，排除A、D。④句的“这一细胞迅速生长的过程”对应②句的“体内细胞生长迅速”，故④句应紧承②句，排除C 项。本题答案为B。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "yanyu-118", "module": "yanyu", "no": 118, "subType": "语句排序", "stem": "①任何的企业活动，都要接受伦理道德方面的约束和限制\n②企业同心合力地珍惜环境品质并不会花费企业太大的成本\n③但是，赢利不能是企业的惟一目的，不管它如何的必要\n④而对环境的道德责任与义务则更为重要\n⑤企业活动是赢利性的\n⑥事实上，企业接受环境道德的约束是有利可图的\n排列组合最连贯的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "⑤②①⑥④③", "image": null}, {"key": "B", "text": "⑤④①③⑥②", "image": null}, {"key": "C", "text": "⑥②①④⑤③", "image": null}, {"key": "D", "text": "⑤③①④⑥②", "image": null}], "answer": "D", "explanation": "通读六个句子，发现③中有一个转折词“但是”，根据内容很容易就可以确定③前面是⑤，由此排除A、B；分析文段可知，文段先从企业的赢利性展开论述，进而引申到道德方面的约束，由此可知⑤③应排在句首，故正确答案为D。", "material": null, "srcPage": 32, "imgN": 0, "f": []}, {"id": "yanyu-119", "module": "yanyu", "no": 119, "subType": "语句排序", "stem": "①当人感到不适或生病时，身体可以从自身的“药铺”中找到 30 至 40 种“药”\n来对症治疗\n②每天坚持以舒适的姿态闭目养神 10 至 20 分钟，将思想集中在愉快的事情上，并\n多做腹式呼吸有助于提高人体的这种自愈能力\n③这种治疗过程是由荷尔蒙、免疫抗体等因素综合发挥作用的\n④经研究发现，人体自身有能力治愈 60至 70的不适和疾病\n⑤在这一过程中，保持积极向上的精神状态非常重要\n⑥科学家目前已经解开了机体自愈的一些秘密\n排列组合最连贯的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "⑥④①③⑤②", "image": null}, {"key": "B", "text": "⑤④②①③⑥", "image": null}, {"key": "C", "text": "④③②①⑥⑤", "image": null}, {"key": "D", "text": "②⑤③①④⑥", "image": null}], "answer": "A", "explanation": "通读六个句子，初步了解到这是一篇介绍人体自愈和如何自愈的短文。⑥很明显是引出短文内容的总起句，接下来就是介绍科学家的发现：人体有自愈能力及如何自愈。④和①说明人体有自愈能力，③⑤②说明人体的自愈能力是如何发生作用，以及如何使人体自愈能力更好地发挥作用。由此可知答案为A。 19 内部资免费交流", "material": null, "srcPage": 33, "imgN": 0, "f": []}, {"id": "yanyu-120", "module": "yanyu", "no": 120, "subType": "语句排序", "stem": "①演化性适应的重要秘诀之一就是多样性\n②维持世界秩序并保存文化多元化的问题，这是一个我们面临、但想象不出解决办\n法的问题\n③一旦去除了文化的差异，出现了一个一致的世界文化，虽然若干政治整合的问题\n得以解决\n④去除了人类的多样性可能到最后会付出持续的意想不到的代价\n⑤文化的歧异多端是一项极其重要的人类资源\n⑥但可能会使人类一切智慧和理想的源泉枯竭\n排列组合最连贯的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "⑤④③①②⑥", "image": null}, {"key": "B", "text": "②⑤③⑥①④", "image": null}, {"key": "C", "text": "②④①⑤⑥③", "image": null}, {"key": "D", "text": "⑤⑥②③①④", "image": null}], "answer": "B", "explanation": "通读六个句子，可以看出这是一个论述文化多样化的重要性的短文。②句总领全文，应放在第一句。所以，可排除A、D。③和⑥中有一对关联词“虽然……，但……”所以③⑥放在一起，并且③在前⑥在后，由此，答案选B。", "material": null, "srcPage": 33, "imgN": 0, "f": []}, {"id": "yanyu-121", "module": "yanyu", "no": 121, "subType": "篇章阅读", "stem": "结合材料和现实，下列关于人工智能的表述中，不正确的一项是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "人工智能的最终目标是实现大脑的全部功能，替代人脑解决所有问题", "image": null}, {"key": "B", "text": "2000 年的时候，想要解决人像识别问题是不可能的", "image": null}, {"key": "C", "text": "从三次浪潮看，数据处理技术的进步决定了人工智能发展的前景", "image": null}, {"key": "D", "text": "到今天为止，人工智能已经发展了 60 多年，绝非新出现的概念", "image": null}], "answer": "A", "explanation": "A 项，结合材料开头和现实可知，人工智能的最终目标绝非代替人脑解决所有问题，而是“实现人脑的部分功能，替代人脑解决特定问题”。A项表述不正确。 B 项，2000 年人工智能发展处于第二阶段，根据材料文字和图1 可知，当时主要成果是神经网络理论的提出和简单应用，而在语音和视觉识别上取得重大突破是在人工智能发展的第三阶段，故B 项表述正确。 C 项，由材料可知，第三次浪潮也就是当前发展阶段，人工智能应用核心是基于神经网络的深度学习，其对于数据处理在技术上取得的质的进步，也决定了人工智能未来的发展前景，故C 项表述正确。 D 项，根据材料开头“人工智能的概念最早在20 世纪50 年代提出……”可知，D项表述正确故本题选A。", "material": {"id": "yanyu-m01", "module": "yanyu", "title": "篇章1", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "人工智能，英文缩写为 AI （ArtificialIntelligence），指的是由人类发明设计的智能"}, {"t": "text", "v": "系统，能够模仿人类的思考方式，实现人脑的部分功能，替代人脑解决特定问题。"}, {"t": "text", "v": "人工智能的概念最早在 20 世纪 50 年代提出， 1956 年的达特茅斯暑期会议上正式"}, {"t": "text", "v": "提出了人工智能的概念。期间经历了三次发展浪潮，当前处于第三次大发展期。"}, {"t": "text", "v": "第一次浪潮发生在 1956 — 1976 年，主导理论是逻辑主义，主要成果是完成了一些"}, {"t": "text", "v": "定理证明以及一些逻辑程序语言。"}, {"t": "text", "v": "第二次浪潮发生在 1976 — 2006 年，主导理论是连接主义，主要成果是神经网络理"}, {"t": "text", "v": "论的提出以及应用。但是在实践中发现可以解决一些简单、单一的问题，对于复杂问题"}, {"t": "text", "v": "的处理效果不尽理想。"}, {"t": "text", "v": "第三次浪潮发生在 2006 —现在，可以称之为基于互联网大数据的深度学习，将大"}, {"t": "text", "v": "数据、神经元网络和数学统计的方法结合在一起。第三次浪潮的理论基础和第二次浪潮"}, {"t": "text", "v": "类似。主要的差别在于基于神经网络的深度学习算法取得了巨大的成功。这里的主要推"}, {"t": "text", "v": "动因素包括了硬件的进步、卷积神经网格模型优化、参数训练技巧的发展等。"}, {"t": "img", "v": "img/material/YY-mat01-01.png"}, {"t": "text", "v": "1"}, {"t": "text", "v": "前两次浪潮解决了人工智能的一些基础理论问题，第三次浪潮的发展已经使得人工"}, {"t": "text", "v": "智能技术的发展程度（识别率、准确率等）可以实际解决很多传统需要人类大脑才能解"}, {"t": "text", "v": "决的问题，具备了很强的实用性，获得生产力。"}, {"t": "text", "v": "人工智能根据从底层到应用的技术逻辑可以分成基础层、技术层、应用层。"}, {"t": "text", "v": "基础层从硬件和理论层面，为人工智能的实现提供了根本保障，主要包括 AI 芯片"}, {"t": "text", "v": "和深度学习算法， AI 芯片的发展进步，提供了越来越强的计算能力 ; 深度学习算法的"}, {"t": "text", "v": "建立，提供了 AI 解决问题的计算方法。"}, {"t": "text", "v": "技术层是基于基础层的支撑，设计出的解决某一类过去需要人脑解决问题的通用方"}, {"t": "text", "v": "法，具体包括智能语音、计算机视觉、自然语言处理以及其他类这四大人脑功能的处理"}, {"t": "text", "v": "方法。这些方法基于深度学习算法，根据具体的数据以及处理场景，形成了专门的成套"}, {"t": "text", "v": "技术处理方法和最佳实践，通过技术层的实现，我们可以将基础层提供的计算能力以及"}, {"t": "text", "v": "计算方法运用到具体领域，去真实对应到大脑的某一类功能以及实践能力。"}, {"t": "text", "v": "应用层是指基于技术层的能力，去解决具体现实生活中的问题。比如利用计算机视"}, {"t": "text", "v": "觉技术，实现金融、安防等多个领域的人脸识别，利用智能语音技术，实现智能音箱、"}, {"t": "text", "v": "录音笔等的语音识别 ; 利用自然语言处理技术，用于智能客服的问答。在实际的应用中，"}, {"t": "text", "v": "技术层和应用层的关系是相互交叉的，某个领域的应用可能用到多个维度的技术层的能"}, {"t": "text", "v": "力，比如金融行业的应用对于智能语音、计算机视觉、自然语言处理技术都会有需求 ;"}, {"t": "text", "v": "同样某个技术层的能力也可以广泛应用到多个不同的应用领域，比如计算机视觉技术可"}, {"t": "text", "v": "以广泛应用到金融、安防、医疗、交通、教育等多个维度。"}, {"t": "img", "v": "img/material/YY-mat01-02.png"}, {"t": "text", "v": "2"}, {"t": "text", "v": "当前的人工智能应用的核心，是基于神经网络的深度学习，该方法的特点是需要根"}, {"t": "text", "v": "据特定应用目的，利用大量且优质的数据，对学习网络进行反复训练，通过传播算法，"}, {"t": "text", "v": "不断自动变换各层以及各节点的参数，以最终得到符合实际应用要求的训练结果。"}]}, "srcPage": 36, "imgN": 0, "f": []}, {"id": "yanyu-122", "module": "yanyu", "no": 122, "subType": "篇章阅读", "stem": "如果小明的愿望是投身于 AI 技术研发工作，那么，必须要掌握的是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "深度学习算法", "image": null}, {"key": "B", "text": "计算机的结构", "image": null}, {"key": "C", "text": "互联网运营", "image": null}, {"key": "D", "text": "Prolog", "image": null}], "answe 在实际的应用中，"}, {"t": "text", "v": "技术层和应用层的关系是相互交叉的，某个领域的应用可能用到多个维度的技术层的能"}, {"t": "text", "v": "力，比如金融行业的应用对于智能语音、计算机视觉、自然语言处理技术都会有需求 ;"}, {"t": "text", "v": "同样某个技术层的能力也可以广泛应用到多个不同的应用领域，比如计算机视觉技术可"}, {"t": "text", "v": "以广泛应用到金融、安防、医疗、交通、教育等多个维度。"}, {"t": "img", "v": "img/material/YY-mat01-02.png"}, {"t": "text", "v": "2"}, {"t": "text", "v": "当前的人工智能应用的核心，是基于神经网络的深度学习，该方法的特点是需要根"}, {"t": "text", "v": "据特定应用目的，利用大量且优质的数据，对学习网络进行反复训练，通过传播算法，"}, {"t": "text", "v": "不断自动变换各层以及各节点的参数，以最终得到符合实际应用要求的训练结果。"}]}, "srcPage": 36, "imgN": 0, "f": []}, {"id": "yanyu-123", "module": "yanyu", "no": 123, "subType": "篇章阅读", "stem": "从文中可以知道， AI 芯片的作用是：", "stemImages": [], "optionImage": null, "graphicOptions": false, "options": [{"key": "A", "text": "是自然语言处理的平台，提供强大的算法支持", "image": null}, {"key": "B", "text": "提供智能操作系统，使各种通用技术得以运行", "image": null}, {"key": "C", "text": "提供强大的计算能力，处理特定场景下的海量数据", "image": null}, {"key": "D", "text": "是处理现实问题的机器核心部件，相当于人的大脑", "image": null}], "answer": "C", "explanation": "由材料可知，AI 芯片处于人工智能技术逻辑的基础层，由“AI 芯片的发展进步，提供了越来越强的计算能力；深度学习算法的建立，提供了AI解决问题的计算方法”可知，AI 芯片的作用是提供了强大的计算能力，使海量数据得以快速处理，C 项正确。 A 项，自然语言处理平台处于人工智能的技术层，作为解决问题的通用方法之一，其基于深度学习算法而非AI 芯片。A 项说法有误。 B 项，智能操作系统作为应用平台处于人工智能的应用层，其基于技术层，因此不是作为基础层的AI 芯片所具备的作用。B 项说法有误。 20 内部资免费交流 D 项，AI 芯片作为硬件设施是机器的核心部件之一，但“人脑”不仅仅靠硬件，更要靠“软件”，人工智能基础层、技术层、应用层综合才能具备“人脑”的功能。D项说法有误故本题选C。", "material": {"id": "yanyu-m01", "module": "yanyu", "title": "篇章1", "content": [{"t": "text", "v": "阅读以下文段，回答问题："}, {"t": "text", "v": "人工智能，英文缩写为 AI （ArtificialIntelligence），指的是由人类发明设计的智能"}, {"t": "text", "v": "系统，能够模仿人类的思考方式，实现人脑的部分功能，替代人脑解决特定问题。"}, {"t": "text", "v": "人工智能的概念最早在 20 世纪 50 年代提出， 1956 年的达特茅斯暑期会议上正式"}, {"t": "text", "v": "提出了人工智能的概念。期间经历了三次发展浪潮，当前处于第三次大发展期。"}, {"t": "text", "v": "第一次浪潮发生在 1956 — 1976 年，主导理论是逻辑主义，主要成果是完成了一些"}, {"t": "text", "v": "定理证明以及一些逻辑程序语言。"}, {"t": "text", "v": "第二次浪潮发生在 1976 — 2006 年，主导理论是连接主义，主要成果是神经网络理"}, {"t": "text", "v": "论的提出以及应用。但是在实践中发现可以解决一些简单、单一的问题，对于复杂问题"}, {"t": "text", "v": "的处理效果不尽理想。"}, {"t"
